name: Upgrade container image
on:
  pull_request:
    types:
      - opened
      - edited
    paths:
      - "**/deploy.yml"
      - "**/cronjob.yml"
jobs:
  upgrade-container-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract renovate dependency and version
        uses: ./.gitea/actions/extract-renovate
        id: renovate
