---
creation_rules:
  # TrueCharts apps - paperless-ngx secrets (must precede the generic truecharts rule)
  - path_regex: ^fluxcd/apps/truecharts/paperless-ngx/.*\.yml$
    encrypted_regex: ^ADMIN_PASSWORD$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # TrueCharts apps - encrypt all yml files with specific field patterns
  - path_regex: ^fluxcd/apps/truecharts/.*/.*\.yml$
    encrypted_regex: ^(admin_|api_key|client_|CF_APITOKEN|password|installation|SSO)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # TrueCharts apps - encrypt all yml files with specific field patterns (gamevault)
  - path_regex: ^fluxcd/apps/truecharts/gamevault/.*\.yml$
    encrypted_regex: ^(admin_|api_key|client_)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # TrueCharts apps - encrypt all yml files with specific field patterns (cloudflareddns)
  - path_regex: ^fluxcd/apps/truecharts/cloudflareddns/.*\.yml$
    encrypted_regex: CF_APITOKEN
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # TrueCharts apps - encrypt enc.yml files with password field (immich)
  - path_regex: ^fluxcd/apps/truecharts/immich/enc\.yml$
    encrypted_regex: ^(password)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # TrueCharts apps - encrypt enc.yml files with multiple field patterns (vaultwarden)
  - path_regex: ^fluxcd/apps/truecharts/vaultwarden/enc\.yml$
    encrypted_regex: ^(token|password|installation|SSO)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # TrueCharts apps - encrypt enc.yml files with multiple field patterns (vaultwarden env)
  - path_regex: (tinyauth|vaultwarden)/.*\.env$
    encrypted_regex: CLIENT
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # TrueCharts apps - encrypt all enc.yml files (default)
  - path_regex: ^fluxcd/apps/truecharts/.*/enc\.yml$
    encrypted_regex: ^(data|stringData)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya

  # Razzia - encrypt all json files
  - path_regex: ^fluxcd/apps/razzia/.*\.json$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Razzia - encrypt secrets env file
  - path_regex: ^fluxcd/apps/razzia/secrets/.*\.env$
    encrypted_regex: (MANAGER_PASSWORD|JWT_SECRET)
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # AI apps - encrypt llama.cpp secrets env file
  - path_regex: ^fluxcd/apps/ai/llama\.cpp/secrets/.*\.env$
    encrypted_regex: HF_TOKEN
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Infrastructure configs - encrypt enc.yml files
  - path_regex: ^fluxcd/infrastructure/configs/.*enc\.yml$
    encrypted_regex: ^(data|stringData)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya

  # Infrastructure configs/cert-manager - encrypt enc.yml files
  - path_regex: ^fluxcd/infrastructure/configs/cert-manager/.*enc\.yml$
    encrypted_regex: ^(data|stringData)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Infrastructure controllers/longhorn - encrypt env files with ACCESS pattern
  - path_regex: ^fluxcd/infrastructure/controllers/longhorn/.*env$
    encrypted_regex: ACCESS
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Infrastructure controllers/renovate - encrypt enc.yml files
  - path_regex: ^fluxcd/infrastructure/controllers/renovate/.*\.enc\.yml$
    encrypted_regex: ^(data|stringData)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya

  # Infrastructure controllers/tailscale - encrypt enc.yml files
  - path_regex: ^fluxcd/infrastructure/controllers/tailscale/enc\.yml$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya

  # Infrastructure IAM/cloudflared - encrypt env files
  - path_regex: ^fluxcd/infrastructure/iam/cloudflared/.*env$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Infrastructure IAM/pocket-id - encrypt enc.env files with KEY pattern
  - path_regex: ^fluxcd/infrastructure/iam/pocket-id/enc\.env$
    encrypted_regex: KEY
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Infrastructure monitoring/flux - encrypt env files
  - path_regex: ^fluxcd/infrastructure/monitoring/flux/.*\.env$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Infrastructure monitoring/kube-prometheus-stack - encrypt env files with admin pattern
  - path_regex: ^fluxcd/infrastructure/monitoring/kube-prometheus-stack/.*env$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  - path_regex: truenas-auto-update/.*/secrets/.*\.env
    encrypted_regex: API_KEY
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  - path_regex: mealie/secrets/.*\.env
    encrypted_regex: (API_KEY|CLIENT)
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Mealie MCP - encrypt the Mealie API token in the env file
  - path_regex: ^fluxcd/apps/ai/mcp/mealie-mcp/secrets/.*\.env$
    encrypted_regex: API_TOKEN
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Paperless MCP - encrypt the Paperless API token in the env file
  - path_regex: ^fluxcd/apps/ai/mcp/paperless-mcp/secrets/.*\.env$
    encrypted_regex: PAPERLESS_TOKEN
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Wger MCP - encrypt the wger.de API key and the shared MCP bearer token
  - path_regex: ^fluxcd/apps/ai/mcp/wger-mcp/secrets/.*\.env$
    encrypted_regex: ^(WGER_API_KEY|MCP_STATIC_TOKEN)$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # SearXNG - encrypt the Flask secret key in the env file
  - path_regex: ^fluxcd/apps/ai/searxng/secrets/.*\.env$
    encrypted_regex: SEARXNG_SECRET
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Whisper ASR - encrypt the API key in the env file
  - path_regex: ^fluxcd/apps/ai/whisper/secrets/.*\.env$
    encrypted_regex: API_KEY
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Hermes Agent - encrypt the API bearer key, the OIDC client credentials, the
  # Whisper ASR key the STT config references as ${WHISPER_API_KEY}, and one
  # client token per MCP server the managed config authenticates to
  # (${LINKEDIN_MCP_TOKEN}, ${ACTUAL_MCP_TOKEN}, ${PAPERLESS_MCP_TOKEN}). Every
  # key the app consumes must be listed here: an unlisted key is written to
  # disk in plaintext and committed as-is.
  - path_regex: ^fluxcd/apps/ai/hermes-agent/secrets/.*\.env$
    # Pocket-ID issues a public PKCE client, so there is no client secret.
    encrypted_regex: (API_SERVER_KEY|HERMES_DASHBOARD_OIDC_CLIENT_ID|WHISPER_API_KEY|LINKEDIN_MCP_TOKEN|ACTUAL_MCP_TOKEN|WGER_MCP_TOKEN|PAPERLESS_MCP_TOKEN)
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Comms - WAHA holds the sha512 hash of the WhatsApp API key in the env file.
  - path_regex: ^fluxcd/apps/comms/waha/secrets/.*\.env$
    encrypted_regex: WAHA_API_KEY
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # LinkedIn MCP - encrypt the HTTP bearer token in the env file
  - path_regex: ^fluxcd/apps/ai/mcp/linkedin-mcp/secrets/.*\.env$
    encrypted_regex: LINKEDIN_MCP_HTTP_TOKEN
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Gitea MCP - encrypt the Gitea access token in the env file
  - path_regex: ^fluxcd/apps/ai/mcp/gitea-mcp/secrets/.*\.env$
    encrypted_regex: GITEA_ACCESS_TOKEN
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Actual MCP - encrypt the Actual server password, the budget sync ID and the
  # HTTP bearer token in the env file
  - path_regex: ^fluxcd/apps/ai/mcp/actual-mcp/secrets/.*\.env$
    encrypted_regex: (ACTUAL_PASSWORD|ACTUAL_BUDGET_PASSWORD|ACTUAL_BUDGET_SYNC_ID|MCP_SSE_AUTHORIZATION)
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya
    mac_only_encrypted: true

  # Talos - encrypt the whole machine secrets file (no encrypted_regex: every
  # value in it is sensitive). Merged from talos/clusters/home/.sops.yaml.
  - path_regex: ^talos/clusters/home/secrets\.yml$
    age: age14g7x5d8jach0wpvjvc29dceu26zgr88wflnjg0qj43r0gf977ffq55dhya

stores:
  yaml:
    indent: 2
