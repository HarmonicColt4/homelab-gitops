---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-home
spec:
  entryPoints:
  - websecure
  routes:
  - match: HostRegexp(`(adguard-home|adh)\.teamg\.gg`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: tinyauth
      namespace: tinyauth
    services:
    - name: adguard-home
      port: 10232
