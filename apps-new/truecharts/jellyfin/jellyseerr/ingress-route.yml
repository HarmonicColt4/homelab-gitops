---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`jellyseerr.weirdrussiandomain.com`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: tinyauth-public
      namespace: tinyauth
    services:
    - name: jellyseerr
      port: 10241
  - match: Host(`jellyseerr.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: jellyseerr
      port: 10241
