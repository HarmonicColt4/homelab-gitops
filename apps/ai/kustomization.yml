---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - open-webui/
  - qdrant/
  - namespace.yml

transformers:
  - |
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-important-to-example
      namespace: ai
    setRoleBindingSubjects: none
    unsetOnly: true
    fieldSpecs:
      - kind: HelmRelease
        path: spec/targetNamespace
        create: true
