---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: flux-system
spec:
  timeout: 10m
  interval: 30m
  releaseName: qdrant
  chart:
    spec:
      chart: qdrant
      version: 1.19.0
      sourceRef:
        kind: HelmRepository
        name: qdrant
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: qdrant-values
