---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
  namespace: flux-system
spec:
  interval: 24h
  releaseName: searxng
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: searxng
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 11.7.7
  valuesFrom:
    - kind: ConfigMap
      name: global-values
