TZ: NZ

global:
  fallbackDefaults:
    pvcSize: 1Gi
    vctSize: 1Gi
    storageClass: longhorn-test

ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: false