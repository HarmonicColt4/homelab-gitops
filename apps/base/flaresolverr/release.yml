---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  releaseName: flaresolverr
  interval: 24h
  chart:
    spec:
      chart: flaresolverr
      version: 15.3.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: flaresolverr-common-values
      valuesKey: default-values
