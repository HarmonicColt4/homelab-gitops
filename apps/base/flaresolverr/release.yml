---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  interval: 10m
  url: oci://tccr.io/truecharts/flaresolverr
  ref:
    tag: "15.3.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  releaseName: flaresolverr
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: flaresolverr
  valuesFrom:
    - kind: ConfigMap
      name: flaresolverr-common-values
      valuesKey: default-values
