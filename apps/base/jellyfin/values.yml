---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: jellyfin.staging.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - jellyfin.staging.weirdrussiandomain.com
        secretName: jellyfin-cert
global:
  fallbackDefaults:
    pvcSize: 10Gi
    vctSize: 10Gi
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            JELLYFIN_PublishedServerUrl: jellyfin.staging.weirdrussiandomain.com