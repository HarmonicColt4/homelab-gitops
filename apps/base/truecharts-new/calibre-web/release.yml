---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
spec:
  releaseName: calibre-web
  targetNamespace: calibre-web
  storageNamespace: calibre-web
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: calibre-web
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
  values:
    TZ: Pacific/Auckland
