---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre
spec:
  releaseName: calibre
  targetNamespace: calibre
  storageNamespace: calibre
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: calibre
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
