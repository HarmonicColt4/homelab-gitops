---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
spec:
  releaseName: cloudflareddns
  targetNamespace: cloudflareddns
  storageNamespace: cloudflareddns
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: cloudflareddns
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
