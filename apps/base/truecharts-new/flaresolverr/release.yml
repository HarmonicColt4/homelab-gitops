---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  releaseName: flaresolverr
  targetNamespace: flaresolverr
  storageNamespace: flaresolverr
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: flaresolverr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
