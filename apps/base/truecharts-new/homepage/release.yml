---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  releaseName: homepage
  targetNamespace: homepage
  storageNamespace: homepage
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: homepage
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 24h
  valuesFrom: []
