---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
spec:
  releaseName: jellyseerr
  targetNamespace: jellyseerr
  storageNamespace: jellyseerr
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: jellyseerr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
