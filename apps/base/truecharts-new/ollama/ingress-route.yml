---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui
  namespace: ollama
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`open-webui.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: ollama
          port: 10686
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ollama-api
  namespace: ollama
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ollama.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: ollama-api
          port: 11434
