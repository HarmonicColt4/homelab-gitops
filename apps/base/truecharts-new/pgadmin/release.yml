---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
spec:
  releaseName: pgadmin
  targetNamespace: pgadmin
  storageNamespace: pgadmin
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: pgadmin
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
