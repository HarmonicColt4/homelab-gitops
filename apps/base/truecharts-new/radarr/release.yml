---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  releaseName: radarr
  targetNamespace: radarr
  storageNamespace: radarr
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
  values:
    metrics:
      main:
        enabled: false
