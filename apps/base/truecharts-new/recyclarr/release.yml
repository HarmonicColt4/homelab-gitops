---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  releaseName: recyclarr
  targetNamespace: recyclarr
  storageNamespace: recyclarr
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: recyclarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
