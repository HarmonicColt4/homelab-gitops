---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  releaseName: sabnzbd
  targetNamespace: sabnzbd
  storageNamespace: sabnzbd
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: sabnzbd
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
