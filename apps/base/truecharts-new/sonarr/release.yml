---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  releaseName: sonarr
  targetNamespace: sonarr
  storageNamespace: sonarr
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: sonarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
  values:
    metrics:
      main:
        enabled: false
