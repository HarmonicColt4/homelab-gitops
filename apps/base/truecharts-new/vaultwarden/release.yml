---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  releaseName: vaultwarden
  targetNamespace: vaultwarden
  storageNamespace: vaultwarden
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: vaultwarden
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
  valuesFrom: []
  values:
    ingress:
      main:
        enabled: true
        integrations:
          traefik:
            enabled: false
        hosts:
          - host: vaultwarden.test.com
            paths:
              - path: /
                pathType: Prefix
