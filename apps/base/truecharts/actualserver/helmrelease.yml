---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualserver
  namespace: flux-system
spec:
  releaseName: actualserver
  targetNamespace: actualserver
  interval: 30m
  driftDetection:
    mode: enabled
  uninstall:
    deletionPropagation: orphan
  chart:
    spec:
      chart: actualserver
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 13.6.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
