---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualserver
spec:
  releaseName: actualserver
  targetNamespace: actualserver
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: actualserver
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 13.4.0
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: global-values