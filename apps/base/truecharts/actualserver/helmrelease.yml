---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualserver
  namespace: flux-system
spec:
  releaseName: actualserver
  targetNamespace: actualserver
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: actualserver
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 14.4.2
  valuesFrom:
    - kind: ConfigMap
      name: global-values
