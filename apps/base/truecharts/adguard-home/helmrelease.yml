---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: flux-system
spec:
  releaseName: adguard-home
  targetNamespace: adguard-home
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: adguard-home
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 11.5.7
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: adguard-home-values
