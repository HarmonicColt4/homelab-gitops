---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
spec:
  releaseName: adguard-home
  targetNamespace: adguard-home
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: adguard-home
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 11.5.4
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: adguard-home-values
