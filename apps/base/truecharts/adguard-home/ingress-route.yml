---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard-home.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: adguard-home
          port: 10232
