---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
spec:
  releaseName: adguard-home
  targetNamespace: adguard-home
  storageNamespace: adguard-home
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: adguard-home
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
