apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
spec:
  releaseName: adguard-home
  targetNamespace: adguard-home
  storageNamespace: adguard-home
  interval: 24h
  chart:
    spec:
      chart: adguard-home
      version: 11.4.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m