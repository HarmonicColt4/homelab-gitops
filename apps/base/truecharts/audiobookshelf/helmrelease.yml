---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: flux-system
spec:
  releaseName: audiobookshelf
  targetNamespace: audiobookshelf
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: audiobookshelf
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 12.2.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: audiobookshelf-values
