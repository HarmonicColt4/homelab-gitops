---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`audiobookshelf.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: audiobookshelf
          port: 10223
