---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
  namespace: flux-system
spec:
  releaseName: calibre-web
  targetNamespace: calibre-web
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: calibre-web
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 21.1.2
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: calibre-web-values
  values:
    TZ: Pacific/Auckland