apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
spec:
  releaseName: calibre-web
  targetNamespace: calibre-web
  storageNamespace: calibre-web
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: calibre-web
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
