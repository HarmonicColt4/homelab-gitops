apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
spec:
  releaseName: calibre-web
  targetNamespace: calibre-web
  storageNamespace: calibre-web
  interval: 24h
  chart:
    spec:
      chart: calibre-web
      version: 20.4.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
