---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre
spec:
  releaseName: calibre
  targetNamespace: calibre
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: calibre
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 17.3.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: calibre-values
