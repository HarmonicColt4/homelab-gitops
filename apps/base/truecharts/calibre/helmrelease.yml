---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: calibre
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 18.13.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: calibre-values
