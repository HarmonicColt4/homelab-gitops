---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre
spec:
  releaseName: calibre
  targetNamespace: calibre
  storageNamespace: calibre
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: calibre
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
