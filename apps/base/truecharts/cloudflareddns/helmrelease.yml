---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cloudflareddns
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 12.11.3
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cloudflareddns-values
