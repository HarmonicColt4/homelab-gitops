---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
spec:
  releaseName: cloudflareddns
  targetNamespace: cloudflareddns
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cloudflareddns
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 11.5.5
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: cloudflareddns-values
