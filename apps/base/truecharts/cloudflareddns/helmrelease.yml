---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
  namespace: flux-system
spec:
  releaseName: cloudflareddns
  targetNamespace: cloudflareddns
  interval: 30m
  driftDetection:
    mode: enabled
  uninstall:
    deletionPropagation: orphan
  chart:
    spec:
      chart: cloudflareddns
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 11.5.11
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cloudflareddns-values
