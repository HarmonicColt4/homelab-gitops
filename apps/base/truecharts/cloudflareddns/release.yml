apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
spec:
  releaseName: cloudflareddns
  targetNamespace: cloudflareddns
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: cloudflareddns
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 24h
  valuesFrom: []