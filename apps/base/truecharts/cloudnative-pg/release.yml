---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  dependsOn:
    - name: prometheus-operator
  releaseName: cloudnative-pg
  targetNamespace: cloudnative-pg
  storageNamespace: cloudnative-pg
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
  valuesFrom: []
