---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefox
spec:
  releaseName: firefox
  targetNamespace: firefox
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: firefox
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 23.0.6
  valuesFrom:
    - kind: ConfigMap
      name: global-values
  values:
    persistence:
      config:
        size: 4Gi
