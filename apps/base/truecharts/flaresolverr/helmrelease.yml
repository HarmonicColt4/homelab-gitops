---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: flux-system
spec:
  releaseName: flaresolverr
  targetNamespace: flaresolverr
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: flaresolverr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 16.1.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
