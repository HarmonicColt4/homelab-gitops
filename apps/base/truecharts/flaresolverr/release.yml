apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  releaseName: flaresolverr
  targetNamespace: flaresolverr
  storageNamespace: flaresolverr
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: flaresolverr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
