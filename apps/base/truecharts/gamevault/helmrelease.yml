---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gamevault
spec:
  releaseName: gamevault
  targetNamespace: gamevault
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: gamevault
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 24h
      version: 10.1.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: gamevault-values
