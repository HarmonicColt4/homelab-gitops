---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  releaseName: home-assistant
  storageNamespace: flux-system
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: home-assistant
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 24h
      version: 28.5.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: home-assistant-values
