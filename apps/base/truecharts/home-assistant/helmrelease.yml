---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  releaseName: home-assistant
  storageNamespace: flux-system
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: home-assistant
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 24h
      version: 28.11.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: home-assistant-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  releaseName: mosquitto
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: mosquitto
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 24h
      version: 17.8.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  releaseName: zigbee2mqtt
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: zigbee2mqtt
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 24h
      version: 15.9.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: zigbee2mqtt-values
