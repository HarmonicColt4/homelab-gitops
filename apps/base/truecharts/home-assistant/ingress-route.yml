---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home-assistant.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: home-assistant
          port: 8123
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zigbee2mqtt
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`zigbee2mqtt.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: zigbee2mqtt
          port: 10103
