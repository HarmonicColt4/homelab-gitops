---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  releaseName: homepage
  targetNamespace: homepage
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: homepage
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 24h
      version: 10.1.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: homepage-values