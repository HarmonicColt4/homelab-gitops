---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  releaseName: immich
  targetNamespace: immich
  interval: 30m
  driftDetection:
    mode: enabled
    # ignore:
    #   - paths: ["/spec/template/spec/containers/0/resources/limits"]
    #     target:
    #       kind: Deployment
    #       name: immich-microservices
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 19.27.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: immich-values
