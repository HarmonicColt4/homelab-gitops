---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  releaseName: immich
  targetNamespace: immich
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
  valuesFrom: []
