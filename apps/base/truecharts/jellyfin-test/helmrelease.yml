---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-test
  namespace: flux-system
spec:
  releaseName: jellyfin-test
  targetNamespace: jellyfin-test
  interval: 30m
  driftDetection:
    mode: enabled
  uninstall:
    deletionPropagation: orphan
  chart:
    spec:
      chart: jellyfin
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 20.6.26
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: jellyfin-test-values
