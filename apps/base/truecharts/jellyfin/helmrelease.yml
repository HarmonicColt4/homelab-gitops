---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  releaseName: jellyfin
  targetNamespace: jellyfin
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellyfin
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 21.3.7
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: jellyfin-values
