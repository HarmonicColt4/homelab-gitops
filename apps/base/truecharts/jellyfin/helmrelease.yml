---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  releaseName: jellyfin
  targetNamespace: jellyfin
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellyfin
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 20.6.20
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: jellyfin-values
