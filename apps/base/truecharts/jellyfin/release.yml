---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  releaseName: jellyfin
  targetNamespace: jellyfin
  storageNamespace: jellyfin
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: jellyfin
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
