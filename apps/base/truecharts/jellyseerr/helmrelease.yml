---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
spec:
  releaseName: jellyseerr
  targetNamespace: jellyseerr
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellyseerr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 12.7.3
  valuesFrom:
    - kind: ConfigMap
      name: global-values
