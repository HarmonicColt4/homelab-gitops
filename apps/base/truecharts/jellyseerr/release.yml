---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
spec:
  releaseName: jellyseerr
  targetNamespace: jellyseerr
  storageNamespace: jellyseerr
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: jellyseerr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
