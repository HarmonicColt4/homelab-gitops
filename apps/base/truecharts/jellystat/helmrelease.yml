---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellystat
  namespace: flux-system
spec:
  releaseName: jellystat
  targetNamespace: jellyfin
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellystat
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 5.5.6
  valuesFrom:
    - kind: ConfigMap
      name: global-values
