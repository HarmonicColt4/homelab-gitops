---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellystat
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellystat
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 6.11.2
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: jellystat-values
