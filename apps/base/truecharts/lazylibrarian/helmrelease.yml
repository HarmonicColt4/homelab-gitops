---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lazylibrarian
spec:
  releaseName: lazylibrarian
  targetNamespace: lazylibrarian
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: lazylibrarian
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 20.5.27
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: lazylibrarian-values
