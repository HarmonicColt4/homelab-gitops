---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lazylibrarian
  namespace: lazylibrarian
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lazylibrarian.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: lazylibrarian
          port: 5299
