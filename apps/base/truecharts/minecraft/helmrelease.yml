---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: default
spec:
  releaseName: minecraft-java
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: minecraft-java
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 24h
      version: 22.34.11
  values:
    service:
      main:
        type: LoadBalancer
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: minecraft-values
