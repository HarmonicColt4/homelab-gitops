---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  releaseName: minecraft-java
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: minecraft-java
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 24h
  values:
  valuesFrom: []
