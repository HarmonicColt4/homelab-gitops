---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  releaseName: minecraft-java
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: minecraft-java
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 24h
  values:
    service:
      main:
        annotations:
          metallb.universe.tf/loadBalancerIPs: 10.19.53.9
        ports:
          main:
            enabled: true
            protocol: tcp
            port: 25565
          query:
            enabled: true
            protocol: udp
            port: 25565    
  valuesFrom: []
