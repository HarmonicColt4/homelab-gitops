---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  releaseName: nextcloud
  targetNamespace: nextcloud
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: nextcloud
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 36.3.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: nextcloud-values
