apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  releaseName: nextcloud
  targetNamespace: nextcloud
  storageNamespace: nextcloud
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: nextcloud
      version: 32.6.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
