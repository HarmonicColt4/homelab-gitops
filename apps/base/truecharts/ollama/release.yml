apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  releaseName: ollama
  targetNamespace: ollama
  storageNamespace: ollama
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: ollama
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
