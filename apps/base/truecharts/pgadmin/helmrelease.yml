---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: flux-system
spec:
  releaseName: pgadmin
  targetNamespace: pgadmin
  interval: 30m
  driftDetection:
    mode: enabled
  uninstall:
    deletionPropagation: orphan
  chart:
    spec:
      chart: pgadmin
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 18.3.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: pgadmin-values
