---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
spec:
  releaseName: pgadmin
  targetNamespace: pgadmin
  storageNamespace: pgadmin
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: pgadmin
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
