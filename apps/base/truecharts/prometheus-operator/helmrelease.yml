---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
  namespace: flux-system
spec:
  releaseName: prometheus-operator
  targetNamespace: prometheus-operator
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: prometheus-operator
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 11.5.1
