---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: prometheus-operator
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: prometheus-operator-grafana
          port: 80
