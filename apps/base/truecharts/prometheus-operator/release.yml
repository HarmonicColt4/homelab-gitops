apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
spec:
  releaseName: prometheus-operator
  targetNamespace: prometheus-operator
  storageNamespace: prometheus-operator
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: prometheus-operator
      version: '8.12.0'
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m