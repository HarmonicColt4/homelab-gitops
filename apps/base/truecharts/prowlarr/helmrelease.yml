---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  releaseName: prowlarr
  targetNamespace: prowlarr
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: prowlarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 18.20.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
