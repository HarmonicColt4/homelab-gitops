apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  releaseName: prowlarr
  targetNamespace: prowlarr
  storageNamespace: prowlarr
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: prowlarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []
