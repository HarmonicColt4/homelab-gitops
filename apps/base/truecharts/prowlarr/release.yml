---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  dependsOn:
    - name: cloudnative-pg
  releaseName: prowlarr
  targetNamespace: prowlarr
  storageNamespace: prowlarr  
  interval: 24h
  chart:
    spec:
      chart: prowlarr
      version: 18.12.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
