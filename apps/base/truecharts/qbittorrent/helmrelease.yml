---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  releaseName: qbittorrent
  targetNamespace: qbittorrent
  interval: 30m
  driftDetection:
    mode: enabled
  uninstall:
    deletionPropagation: orphan
  chart:
    spec:
      chart: qbittorrent
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 22.5.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: qbittorrent-values
