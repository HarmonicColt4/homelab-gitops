---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  releaseName: qbittorrent
  targetNamespace: qbittorrent
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: qbittorrent
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 23.2.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: qbittorrent-values
