---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  releaseName: qbittorrent
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: qbittorrent
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 23.3.4
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: qbittorrent-values
  uninstall:
    deletionPropagation: orphan
