---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: flux-system
spec:
  releaseName: radarr
  targetNamespace: radarr
  interval: 30m
  driftDetection:
    mode: enabled
  uninstall:
    deletionPropagation: orphan
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 23.27.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: radarr-values
  values:
    metrics:
      main:
        enabled: false