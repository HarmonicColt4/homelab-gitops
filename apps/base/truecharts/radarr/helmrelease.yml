---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  releaseName: radarr
  targetNamespace: radarr
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 23.23.1
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: global-values
  values:
    metrics:
      main:
        enabled: false