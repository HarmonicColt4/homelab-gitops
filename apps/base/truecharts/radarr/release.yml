apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  releaseName: radarr
  targetNamespace: radarr
  storageNamespace: radarr
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []