---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  releaseName: recyclarr
  targetNamespace: recyclarr
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: recyclarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 12.8.2
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: recyclarr-values