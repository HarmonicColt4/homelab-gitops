---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  releaseName: recyclarr
  targetNamespace: recyclarr
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: recyclarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: truecharts
      interval: 1h
      version: 12.8.2
  valuesFrom:
    - kind: ConfigMap
      name: global-values
  values:
    workload:
      main:
        podSpec:
          initContainers:
            initconfig:
              enabled: false
    persistence:
      config:
        enabled: false
      secrets:
        enabled: true
        type: secret
        objectName: recyclarr-secrets
        mountPath: /config/secrets.yml
        subPath: secrets.yml
      configs:
        enabled: true
        type: configmap
        objectName: recyclarr-configs
        mountPath: /config/configs