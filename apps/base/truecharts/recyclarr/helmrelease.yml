---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: flux-system
spec:
  releaseName: recyclarr
  targetNamespace: recyclarr
  interval: 30m
  driftDetection:
    mode: enabled
  uninstall:
    deletionPropagation: orphan
  chart:
    spec:
      chart: recyclarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 12.8.2
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: recyclarr-values