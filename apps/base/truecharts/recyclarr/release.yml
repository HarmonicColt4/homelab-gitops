apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  releaseName: recyclarr
  targetNamespace: recyclarr
  storageNamespace: recyclarr
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: recyclarr
      version: 12.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m
  valuesFrom: []