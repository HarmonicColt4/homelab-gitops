---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  releaseName: sonarr
  targetNamespace: sonarr
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: sonarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 23.7.0
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: global-values
  values:
    metrics:
      main:
        enabled: false