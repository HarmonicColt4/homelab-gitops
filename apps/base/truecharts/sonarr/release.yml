apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  releaseName: sonarr
  targetNamespace: sonarr
  storageNamespace: sonarr
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: sonarr
      version: 23.5.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m