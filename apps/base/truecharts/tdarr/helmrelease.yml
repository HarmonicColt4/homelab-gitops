---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
  namespace: flux-system
spec:
  releaseName: tdarr
  targetNamespace: tdarr
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tdarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 12.3.3
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: tdarr-values
