---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
  namespace: flux-system
spec:
  releaseName: unifi
  targetNamespace: unifi
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: unifi
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 24.4.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap 
      name: unifi-values