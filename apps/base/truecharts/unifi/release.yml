---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
spec:
  releaseName: unifi
  targetNamespace: unifi
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: unifi
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
  valuesFrom: []
