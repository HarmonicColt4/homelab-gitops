apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
spec:
  releaseName: unifi
  targetNamespace: unifi
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: unifi
      version: 22.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m