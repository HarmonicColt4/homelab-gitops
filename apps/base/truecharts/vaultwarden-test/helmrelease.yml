---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-test
  namespace: flux-system
spec:
  releaseName: vaultwarden-test
  targetNamespace: vaultwarden-test
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: vaultwarden-test
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 28.9.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: vaultwarden-test-values
  values:
    ingress:
      main:
        enabled: true
        integrations:
          traefik:
            enabled: false
        hosts:
          - host: vaultwarden-test.test.com
            paths:
              - path: /
                pathType: Prefix
