---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-test
  namespace: vaultwarden-test
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vaultwarden-test.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: vaultwarden-test
          port: 10102
