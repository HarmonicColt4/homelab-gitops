apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  releaseName: vaultwarden
  targetNamespace: vaultwarden
  storageNamespace: vaultwarden
  interval: 24h
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: vaultwarden
      version: 28.6.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 5m