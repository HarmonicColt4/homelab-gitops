---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: flux-system
spec:
  releaseName: tailscale
  targetNamespace: tailscale
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tailscale-operator
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 1h
      version: 1.84.3
  valuesFrom:
    - kind: Secret
      name: tailscale-values
