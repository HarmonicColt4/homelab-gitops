---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/adguard-home
patches:
  - target:
      kind: HelmRelease
      name: adguard-home
    patch: |
      - op: add
        path: /metadata/namespace
        value: default
configMapGenerator:
  - name: adguard-home-values
    namespace: default
    files:
      - values.yaml=values.yml
