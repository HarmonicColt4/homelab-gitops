---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/cloudnative-pg
patches:
  - target:
      kind: HelmRelease
      name: cloudnative-pg
    patch: |
      - op: add
        path: /metadata/namespace
        value: default
      - op: replace
        path: /spec/chart/spec/sourceRef/namespace
        value: default
      - op: remove
        path: /spec/dependsOn