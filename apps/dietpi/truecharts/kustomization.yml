---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - repository.yml
  - adguard-home
  - cloudflareddns
  - unifi
  - ../../base/truecharts/cloudnative-pg
  - ../../base/truecharts/prometheus-operator
  - ../../base/truecharts/uptime-kuma
configMapGenerator:
  - name: global-values
    namespace: flux-system
    files:
      - values.yaml=global-values.yml
configurations:
  - kustomizeconfig.yml
