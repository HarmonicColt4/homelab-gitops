---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - repository.yml
  - adguard-home
  - cloudnative-pg
  - cloudflareddns
  - prometheus-operator
  - unifi
configMapGenerator:
  - name: global-values
    namespace: default
    files:
      - values.yaml=global-values.yml
  - name: global-values
    namespace: flux-system
    files:
      - values.yaml=global-values.yml
configurations:
  - kustomizeconfig.yml
