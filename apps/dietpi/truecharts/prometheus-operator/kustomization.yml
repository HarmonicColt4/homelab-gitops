---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/prometheus-operator
patches:
  - target:
      kind: HelmRelease
      name: prometheus-operator
    patch: |
      - op: add
        path: /metadata/namespace
        value: default
      - op: replace
        path: /spec/chart/spec/sourceRef/namespace
        value: default
