---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minecraft
resources:
  - ../../../base/truecharts/minecraft
  - ../global-values
patches:
  - target:
      kind: HelmRelease
    patch: |
      - op: add
        path: /spec/chart/spec/version
        value: 22.x
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: values
configMapGenerator:
  - name: values
    files:
      - values.yaml=values.yml
configurations:
  - ../kustomizeconfig.yml
