---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: flux-system
spec:
  interval: 1h
  releaseName: open-webui
  chart:
    spec:
      chart: open-webui
      version: 10.2.1
      sourceRef:
        kind: HelmRepository
        name: open-webui
      interval: 1h
  valuesFrom:
  - kind: Secret
    name: open-webui-values
