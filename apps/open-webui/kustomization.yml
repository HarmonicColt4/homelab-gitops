---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - helmrelease.yml
  - ingress-route.yml
  - repository.yml

secretGenerator:
  - name: open-webui-values
    namespace: flux-system
    files:
      - values.yaml=values.enc.yml

transformers:
  - |
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-important-to-example
      namespace: open-webui
    setRoleBindingSubjects: none
    unsetOnly: true
    fieldSpecs:
      - kind: HelmRelease
        path: spec/targetNamespace
        create: true
