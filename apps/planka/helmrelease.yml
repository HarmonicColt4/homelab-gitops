---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: planka
  namespace: flux-system
spec:
  interval: 30m
  releaseName: planka
  chart:
    spec:
      chart: planka
      sourceRef:
        kind: HelmRepository
        name: planka
      version: 1.1.2
  valuesFrom:
    - kind: Secret
      name: planka-values
