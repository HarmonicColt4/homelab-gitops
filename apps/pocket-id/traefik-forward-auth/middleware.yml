---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tfa-public
spec:
  forwardAuth:
    address: http://tfa-public.pocket-id.svc.cluster.local:4181/portals/main
    authResponseHeaders: [ X-Forwarded-User, X-Forwarded-Displayname, X-Authenticated-User ]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tfa-local
spec:
  forwardAuth:
    address: http://tfa-local.pocket-id.svc.cluster.local:4181/portals/main
    authResponseHeaders: [ X-Forwarded-User, X-Forwarded-Displayname, X-Authenticated-User ]
