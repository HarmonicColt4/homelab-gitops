apiVersion: v1
kind: Service
metadata:
  labels:
    app: tfa-local
  name: tfa-local
spec:
  ports:
  - port: 4181
    protocol: TCP
    targetPort: 4181
  selector:
    app: tfa-local
  type: ClusterIP
