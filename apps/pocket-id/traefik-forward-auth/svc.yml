---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: tfa-public
  name: tfa-public
spec:
  ports:
  - port: 4181
    protocol: TCP
    targetPort: 4181
  selector:
    app: tfa-public
  type: ClusterIP
