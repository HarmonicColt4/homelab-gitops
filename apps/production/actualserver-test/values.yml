---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: actualserver-test.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - actualserver-test.weirdrussiandomain.com
        secretName: actualserver-test-cert
global:
  fallbackDefaults:
    pvcSize: 1Gi
    vctSize: 1Gi
persistence:
  server-files:
    enabled: false
    mountPath: /data/server-files
  user-files:
    enabled: false
    mountPath: /data/user-files
  files:
    enabled: true
    mountPath: /data