---
# Source: tc-helmrelease-chart/templates/release.yml
apiVersion: v1
kind: Namespace
metadata:
  name: actualserver
---
# Source: tc-helmrelease-chart/templates/release.yml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualserver
spec:
  releaseName: actualserver
  targetNamespace: actualserver
  interval: 24h
  chart:
    spec:
      chart: actualserver
      version: 12.*
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  values:
    ingress:
      main:
        integrations:
          traefik:
            enabled: false
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          cert-manager.io/cluster-issuer: letsencrypt
        enabled: true
        hosts:
          - host: actualserver.weirdrussiandomain.com
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
            - actualserver.weirdrussiandomain.com
            secretName: actualserver-cert
    global:
      fallbackDefaults:
        pvcSize: 1Gi
        vctSize: 1Gi
