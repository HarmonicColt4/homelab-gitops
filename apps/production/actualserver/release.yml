apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualserver
spec:
  releaseName: actualserver
  targetNamespace: actualserver
  interval: 24h
  chart:
    spec:
      chart: actualserver
      version: 13.*
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: values
