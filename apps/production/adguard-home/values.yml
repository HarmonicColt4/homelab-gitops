---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: adguard-home.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - adguard-home.weirdrussiandomain.com
        secretName: adguard-home-cert
global:
  fallbackDefaults:
    pvcSize: 1Gi
    vctSize: 1Gi
service:
  main:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: 10.13.25.3
      metallb.universe.tf/allow-shared-ip: dns
  dns-tcp:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/loadBalancerIPs: 10.13.25.3
      metallb.universe.tf/allow-shared-ip: dns
  dns-udp:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/loadBalancerIPs: 10.13.25.3
      metallb.universe.tf/allow-shared-ip: dns
  dns-https:
    type: LoadBalancer
    annotations:
