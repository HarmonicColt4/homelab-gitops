---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: immich.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - immich.weirdrussiandomain.com
        secretName: immich-cert
global:
  fallbackDefaults:
    pvcSize: 10Gi
    vctSize: 10Gi

persistence:
  library:
    type: nfs
    path: /mnt/storage/immich-clone/library
    server: 10.13.25.10
  uploads:
    type: nfs
    path: /mnt/storage/immich-clone/upload
    server: 10.13.25.10
  backups:
    type: nfs
    path: /mnt/storage/immich-clone/backups
    server: 10.13.25.10
  thumbs:
    type: nfs
    path: /mnt/storage/immich-clone/thumbs
    server: 10.13.25.10
  profile:
    type: nfs
    path: /mnt/storage/immich-clone/profile
    server: 10.13.25.10
  video:
    type: nfs
    path: /mnt/storage/immich-clone/encoded-video
    server: 10.13.25.10

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DB_SKIP_MIGRATIONS: "true"