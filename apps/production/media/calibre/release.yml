# Source: tc-helmrelease-chart/templates/release.yml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre
spec:
  releaseName: calibre
  targetNamespace: media
  interval: 24h
  chart:
    spec:
      chart: calibre
      version: 16.*
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: calibre-values
