---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: calibre.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - calibre.weirdrussiandomain.com
        secretName: calibre-cert
persistence:
  config:
    size: 1Gi
  media:
    enabled: true
    type: nfs
    path: /mnt/storage/media/books/library
    server: 10.13.25.10
    mountPath: /books/library