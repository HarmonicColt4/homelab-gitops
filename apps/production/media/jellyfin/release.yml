# Source: tc-helmrelease-chart/templates/release.yml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  releaseName: jellyfin
  targetNamespace: media
  interval: 24h
  chart:
    spec:
      chart: jellyfin
      version: 20.*
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: jellyfin-values
