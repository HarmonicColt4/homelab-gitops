---
# Source: tc-helmrelease-chart/templates/release.yml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  releaseName: sonarr
  targetNamespace: media
  interval: 24h
  chart:
    spec:
      chart: sonarr
      version: 23.*
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: sonarr-values
