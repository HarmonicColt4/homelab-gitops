apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  releaseName: nextcloud
  targetNamespace: nextcloud
  interval: 24h
  chart:
    spec:
      chart: nextcloud
      version: 32.6.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: values
