---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: pgadmin.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - pgadmin.weirdrussiandomain.com
        secretName: pgadmin-cert
global:
  fallbackDefaults:
    pvcSize: 1Gi
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PGADMIN_DEFAULT_EMAIL: "guyfrank@outlook.com"
            PGADMIN_DEFAULT_PASSWORD: "F19hters"