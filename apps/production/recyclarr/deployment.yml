apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: recyclarr
  name: recyclarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recyclarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: recyclarr
    spec:
      containers:
        - image: ghcr.io/recyclarr/recyclarr:7.4.1
          name: recyclarr
          resources:
            requests:
              cpu: 10m
              memory: 80Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /config/configs
              name: configs
            - mountPath: /config/secrets.yml
              subPath: secrets.yml
              name: secrets
          env:
            - name: TZ
              value: Pacific/Auckland
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: configs
          configMap:
            name: configs
        - name: secrets
          secret:
            secretName: secrets
