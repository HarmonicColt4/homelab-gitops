---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: searxng.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - searxng.weirdrussiandomain.com
        secretName: searxng-cert
global:
  fallbackDefaults:
    pvcSize: 1Gi
    vctSize: 1Gi