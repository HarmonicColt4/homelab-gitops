apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  releaseName: prowlarr
  targetNamespace: torrents
  interval: 24h
  chart:
    spec:
      chart: prowlarr
      version: 18.*
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: prowlarr-values
