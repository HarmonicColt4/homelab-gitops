---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: qbittorrent.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - qbittorrent.weirdrussiandomain.com
        secretName: qbittorrent-cert
global:
  fallbackDefaults:
    pvcSize: 1Gi
    vctSize: 1Gi
persistence:
  series:
    enabled: true
    type: nfs
    path: /mnt/storage/media/series/torrents
    server: 10.13.25.10
    mountPath: /series/torrents
  movies:
    enabled: true
    type: nfs
    path: /mnt/storage/media/movies/torrents
    server: 10.13.25.10
    mountPath: /movies/torrents
  anime:
    enabled: true
    type: nfs
    path: /mnt/storage/media/anime/torrents
    server: 10.13.25.10
    mountPath: /anime/torrents
  downloads:
    enabled: true
    type: nfs
    path: /mnt/storage/downloads
    server: 10.13.25.10
    mountPath: /downloads
workload:
  main:
    podSpec:
      nodeSelector:
        netspeed: fast