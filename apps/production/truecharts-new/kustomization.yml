---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - actualserver
  # - adguard-home
  # - cloudflareddns
  # - homepage
  # - immich
  # - media
  # - ollama
  # - pgadmin
  # - sabnzbd
  # - searxng
  # - torrents
  # - unifi
  # - vaultwarden
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/0
        value:
          kind: ConfigMap
          name: global-values
          namespace: truecharts
configMapGenerator:
  - name: global-values
    namespace: truecharts
    files:
      - values.yaml=global-values.yml
configurations:
  - kustomizeconfig.yml
