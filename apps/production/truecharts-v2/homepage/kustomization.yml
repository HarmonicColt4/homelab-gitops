---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - ../../../base/truecharts/homepage
  - ../global-values
configMapGenerator:
  - name: app-values
    files:
      - values.yaml=values.yml
  - name: config
    files:
      - services.yaml=config/services.yml
      - bookmarks.yaml=config/bookmarks.yml
configurations:
  - ../kustomizeconfig.yml
