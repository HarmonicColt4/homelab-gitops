---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - ../../../base/truecharts/homepage
  - ../global-values
configMapGenerator:
  - name: app-values
    files:
      - values.yaml=values.yml
    options:
      disableNameSuffixHash: true
configurations:
  - ../kustomizeconfig.yml
