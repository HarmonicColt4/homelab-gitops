configmap: {}

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            HOMEPAGE_ALLOWED_HOSTS: homepage.weirdrussiandomain.com

persistence:
  bookmarks-config:
    enabled: true
    mountPath: /app/config/bookmarks.yaml
    subPath: bookmarks.yaml
    readOnly: true
    type: "configmap"
    objectName: config
    expandObjectName: false
    targetSelector:
      main:
        main: {}