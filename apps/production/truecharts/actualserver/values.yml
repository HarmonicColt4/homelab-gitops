    mountPath: /series-4k/torrents
  movies-1080p:
    enabled: true
    type: nfs
    path: /mnt/media/movies-1080p/torrents
    server: 10.13.25.10
    mountPath: /movies-1080p/torrents
  movies-4k:
    enabled: true
    type: nfs
    path: /mnt/media/movies-4k/torrents
    server: 10.13.25.10
    mountPath: /movies-4k/torrents
  anime:
    enabled: true
    type: nfs
    path: /mnt/media/anime/downloads
    server: 10.13.25.10
