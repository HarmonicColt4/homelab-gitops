apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/truecharts/adguard-home

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: adguard-home-values
      - op: add
        path: /spec/chart/spec/version
        value: "11.x"          
configMapGenerator:
  - name: adguard-home-values
    files:
      - values.yaml=values.yml

configurations:
  - ../kustomizeconfig.yml  