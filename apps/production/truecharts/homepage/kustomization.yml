---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/homepage
configMapGenerator:
  - name: homepage-values
    files:
      - values.yaml=values.yml
  - name: config
    files:
      - services.yaml=config/services.yml
      - bookmarks.yaml=config/bookmarks.yml
      - settings.yaml=config/settings.yml
configurations:
  - ../kustomizeconfig.yml
  - kustomizeconfig.yml
