---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/homepage
patches:
  - target:
      kind: HelmRelease
    patch: |
      - op: add
        path: /spec/chart/spec/version
        value: "9.x"
configMapGenerator:
  - name: homepage-services
    files:
      - services.yaml=services.yml
  - name: homepage-settings
    files:
      - settings.yaml=settings.yml
configurations:
  - ../kustomizeconfig.yml
