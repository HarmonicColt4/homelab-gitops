workload:
  main:
    podSpec:
      containers:
        main:
          env:
            HOMEPAGE_ALLOWED_HOSTS: homepage.weirdrussiandomain.com
      initContainers:
        init-config:
          enabled: false

persistence:
  cnicni:
    type: hostPath
    hostPath: /opt/cni/bin
    mountPath: /host/opt/cni/bin
    enabled: true

addons:
  codeserver:
    enabled: true
    service:
      enabled: true
      type: LoadBalancer
