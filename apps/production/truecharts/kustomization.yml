---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yml
- repository.yml
- adguard-home
- actualserver
- ../../base/truecharts/cloudnative-pg
- homepage
- immich
- jellyfin
- prowlarr
- qbittorrent
- radarr
- recyclarr
- sonarr
- vaultwarden
configMapGenerator:
- name: global-values
  namespace: flux-system
  files:
  - values.yaml=global-values.yml
configurations:
- kustomizeconfig.yml
