---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yml
- repository.yml
- actualserver
- audiobookshelf
- calibre
- calibre-web
- cloudnative-pg
- flaresolverr
- homepage
- immich
- jellyfin
- jellyseerr
- pgadmin
- prowlarr
- qbittorrent
- radarr
- radarr-4k
- radarr-anime
- recyclarr
- sonarr
- sonarr-4k
- sonarr-anime
- vaultwarden
configMapGenerator:
- name: global-values
  files:
  - values.yaml=global-values.yml
configurations:
- kustomizeconfig.yml
transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: notImportantHere
    namespace: truecharts
  unsetOnly: true
