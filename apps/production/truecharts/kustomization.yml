---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- actualserver
- adguard-home
- cloudflareddns
- firefox
- homepage
- immich
- media
- media-new
- pgadmin
- torrents
- unifi
- vaultwarden
patches:
- target:
    kind: HelmRelease
  patch: |-
    - op: add
      path: /spec/valuesFrom/0
      value:
        kind: ConfigMap
        name: global-values
configMapGenerator:
- name: global-values
  files:
  - values.yaml=global-values.yml
configurations:
- kustomizeconfig.yml
transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: notImportantHere
    namespace: truecharts
  unsetOnly: true
