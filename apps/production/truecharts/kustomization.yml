---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- actualserver
- adguard-home
- calibre
- calibre-web
- cloudflareddns
- flaresolverr
- firefox
- homepage
- immich
- jellyfin
- jellyseerr
- pgadmin
- prowlarr
- qbittorrent
- radarr
- radarr-anime
- radarr-4k
- recyclarr
- sonarr
- unifi
- vaultwarden
configMapGenerator:
- name: global-values
  files:
  - values.yaml=global-values.yml
configurations:
- kustomizeconfig.yml
transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: notImportantHere
    namespace: truecharts
  unsetOnly: true
