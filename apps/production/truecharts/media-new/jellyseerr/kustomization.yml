---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/truecharts/jellyseerr
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: jellyseerr  
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/chart/spec/version
        value: "12.x"