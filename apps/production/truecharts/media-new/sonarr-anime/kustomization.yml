---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../sonarr
nameSuffix: -anime
configMapGenerator:
  - name: sonarr-values
    behavior: replace
    files:
      - values.yaml=values.yml
patches:
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`sonarr-anime.${domain}`) && PathPrefix(`/`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: sonarr-anime
  - target:
      kind: HelmRelease
    patch: |-
      - op: replace
        path: /spec/releaseName
        value: sonarr-anime