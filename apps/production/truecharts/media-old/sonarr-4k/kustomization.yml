---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/truecharts/sonarr
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: sonarr  
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: sonarr-values
      - op: add
        path: /spec/chart/spec/version
        value: "23.x"
configMapGenerator:
  - name: sonarr-values
    files:
      - values.yaml=values.yml
configurations:
  - ../../kustomizeconfig.yml
