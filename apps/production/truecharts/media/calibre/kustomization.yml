---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/truecharts/calibre
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: calibre-values
      - op: add
        path: /spec/chart/spec/version
        value: "16.x"
configMapGenerator:
  - name: calibre-values
    files:
      - values.yaml=values.yml
configurations:
  - ../../kustomizeconfig.yml
