---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/truecharts/jellyfin
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: jellyfin
configMapGenerator:
  - name: jellyfin-values
    files:
      - values.yaml=values.yml
configurations:
  - ../../kustomizeconfig.yml
