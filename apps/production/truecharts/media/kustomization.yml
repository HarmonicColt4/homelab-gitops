---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  # - calibre
  # - calibre-web
  - jellyfin
  - jellyseerr
  - radarr
  - radarr-4k
  - radarr-anime
  - recyclarr
  - sonarr
  - sonarr-4k
  - sonarr-anime
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/targetNamespace
        value: media
      - op: add
        path: /spec/storageNamespace
        value: media
  - target:
      kind: IngressRoute
    patch: |-
      - op: add
        path: /metadata/namespace
        value: media
