---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/truecharts/recyclarr
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: recyclarr  
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: recyclarr-values
      - op: add
        path: /spec/chart/spec/version
        value: "12.x"
configMapGenerator:
  - name: recyclarr-values
    files:
      - values.yaml=values.yml
  - name: recyclarr-configs
    namespace: media
    files:
      - sonarr.yml=configs/sonarr.yml
      - radarr.yml=configs/radarr.yml
      - sonarr-anime.yml=configs/sonarr-anime.yml
      - radarr-anime.yml=configs/radarr-anime.yml
      - sonarr-4k.yml=configs/sonarr-4k.yml
      - radarr-4k.yml=configs/radarr-4k.yml
    options:
      disableNameSuffixHash: true
configurations:
  - ../../kustomizeconfig.yml
