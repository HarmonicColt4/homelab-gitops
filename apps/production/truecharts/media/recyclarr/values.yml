---
workload:
  main:
    podSpec:
      initContainers:
        initconfig:
          enabled: false
configmap:
  sonarr-4k:
    enabled: true
    data:
      sonarr_4k.yml: |
        sonarr:
          sonarr-4k:
            include:
              - template: sonarr-quality-definition-series
              - template: sonarr-v4-quality-profile-web-2160p
              - template: sonarr-v4-custom-formats-web-2160p
            custom_formats:
              - trash_ids:
                  - 9b27ab6498ec0f31a3353992e19434ca # DV (WEBDL)
                  - 0dad0a507451acddd754fe6dc3a7f5e7 # HDR10+ Boost
                  - 385e9e8581d33133c3961bdcdeffb7b4 # DV HDR10+ Boost
                assign_scores_to:
                  - name: WEB-2160p
              - trash_ids:
                  - 83304f261cf516bb208c18c54c0adf97 # SDR (no WEBDL)
                assign_scores_to:
                  - name: WEB-2160p
secret:
  instance-secrets:
    enabled: true
    data:
      secrets.yml: |
        radarr_url: http://radarr:7878
        radarr_apikey: 7b600f7d43ef4d33857760f81f069820

        radarr_anime_url: http://radarr-anime:7878
        radarr_anime_apikey: c13648ff726d4680a7d20323ccd9626d

        sonarr_url: http://sonarr:8989
        sonarr_apikey: 63d7a3fedf474ed48f56dda7e237c82f

        sonarr_anime_url: http://sonarr-anime:8989
        sonarr_anime_apikey: 139546b93ce8443e8ea5a7e38b099619

        radarr_4k_base_url: http://radarr-4k:7878
        radarr_4k_api_key: 36e8c881092c4c3082771455cfeff0a0

        sonarr_4k_base_url: http://sonarr-4k:8989
        sonarr_4k_api_key: fd4d8f9eb1814318b318d1bff51e3037
persistence:
  secrets:
    enabled: true
    type: secret
    objectName: instance-secrets
    mountPath: /config/secrets.yml
    subPath: secrets.yml
  configs:
    enabled: true
    type: configmap
    objectName: sonarr-4k
    mountPath: /config/configs