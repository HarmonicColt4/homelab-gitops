---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -4k
resources:
  - ../../../../base/truecharts/sonarr
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: sonarr  
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: sonarr-values
      - op: replace
        path: /spec/releaseName
        value: sonarr-4k
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /spec/routes/0
        value:
          match: Host(`sonarr-4k.${domain}`) && PathPrefix(`/`)
          kind: Rule
          services:
            - name: sonarr-4k
              port: 8989
configMapGenerator:
  - name: sonarr-values
    files:
      - values.yaml=values.yml
configurations:
  - ../../kustomizeconfig.yml
