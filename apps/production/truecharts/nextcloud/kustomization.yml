---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/nextcloud
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: nextcloud-values
      - op: add
        path: /spec/chart/spec/version
        value: 32.x
configMapGenerator:
  - name: nextcloud-values
    files:
      - values.yaml=values.yml
configurations:
  - ../kustomizeconfig.yml
