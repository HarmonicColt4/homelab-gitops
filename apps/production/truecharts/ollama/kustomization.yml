---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/ollama
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: ollama-values
      - op: add
        path: /spec/chart/spec/version
        value: "7.x"
configMapGenerator:
  - name: ollama-values
    files:
      - values.yaml=values.yml
configurations:
  - ../kustomizeconfig.yml
