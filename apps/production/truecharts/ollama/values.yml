---
ollama:
  rag:
    model_device_type: "cuda"
resources:
  limits:
    nvidia.com/gpu: 1
workload:
  main:
    podSpec:
      runtimeClassName: "nvidia"
      containers:
        main:
          probes:
            liveness:
              port: 11434
            readiness:
              port: 11434
            startup:
              port: 11434
persistence:
  config:
    size: 40Gi
  data:
    size: 20Gi