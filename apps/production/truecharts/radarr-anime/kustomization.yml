---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/radarr
nameSuffix: -anime
configMapGenerator:
  - name: radarr-values
    files:
      - values.yaml=values.yml
configurations:
  - kustomizeconfig.yml
patches:
  - path: patch.yml
    target:
      kind: IngressRoute
