---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/radarr
nameSuffix: -anime
configMapGenerator:
  - name: radarr-values
    files:
      - values.yaml=values.yml
patches:
  - path: patch.yml
    target:
      kind: IngressRoute
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: radarr