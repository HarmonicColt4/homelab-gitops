---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base/truecharts/recyclarr
- ../global-values
- secrets.yml
namespace: recyclarr
configMapGenerator:
- name: recyclarr-values
  files:
  - values.yaml=values.yml
- name: instance-configs
  options:
    disableNameSuffixHash: true
  files:
  - sonarr.yml=configs/sonarr.yml
  - radarr.yml=configs/radarr.yml
