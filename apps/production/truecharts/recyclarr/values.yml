---
workload:
  main:
    podSpec:
      initContainers:
        initconfig:
          enabled: false
persistence:
  secrets:
    enabled: true
    type: secret
    objectName: instance-secrets
    expandObjectName: false
    mountPath: /config/secrets.yml
    subPath: secrets.yml
  configs:
    enabled: true
    type: configmap
    objectName: instance-configs
    expandObjectName: false
    optional: true
    mountPath: /config/configs