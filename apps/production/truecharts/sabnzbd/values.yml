  movies-1080p:
    enabled: true
    type: nfs
    path: /mnt/storage/media/movies-1080p/torrents
    server: 10.13.25.10
    mountPath: /movies-1080p/torrents
  movies-4k:
    enabled: true
    type: nfs
    path: /mnt/storage/media/movies-4k/torrents
    server: 10.13.25.10
    mountPath: /movies-4k/torrents
  books:
    enabled: true
    type: nfs
    path: /mnt/storage/media/books/torrents
    server: 10.13.25.10
    mountPath: /books/torrents
  downloads:
    enabled: true
    type: nfs
    path: /mnt/storage/downloads
    server: 10.13.25.10
    mountPath: /downloads
