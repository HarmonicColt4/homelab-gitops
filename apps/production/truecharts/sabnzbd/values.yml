workload:
  main:
    podSpec:
      containers:
        main:
          env:
            SABNZBD__HOST_WHITELIST_ENTRIES: "sabnzbd.weirdrussiandomain.com"
persistence:
  series-1080p:
    enabled: true
    type: nfs
    path: /mnt/storage/media/series-1080p/torrents
