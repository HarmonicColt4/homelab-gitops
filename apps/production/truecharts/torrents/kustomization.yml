---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  # - flaresolverr
  - prowlarr
  - qbittorrent
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/targetNamespace
        value: torrents
      - op: add
        path: /spec/storageNamespace
        value: torrents
  - target:
      kind: IngressRoute
    patch: "- op: add\n  path: /metadata/namespace\n  value: torrents        "
