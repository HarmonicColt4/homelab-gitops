apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/truecharts/prowlarr
  - ingress-route.yml

patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: prowlarr
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/chart/spec/version
        value: "18.x"