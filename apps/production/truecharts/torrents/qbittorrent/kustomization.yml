apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/truecharts/qbittorrent
  - ingress-route.yml

patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: qbittorrent
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: qbittorrent-values
      - op: add
        path: /spec/chart/spec/version
        value: "22.x"
configMapGenerator:
  - name: qbittorrent-values
    files:
      - values.yaml=values.yml

configurations:
  - ../../kustomizeconfig.yml