---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/unifi
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: unifi-values
      - op: add
        path: /spec/chart/spec/version
        value: "22.x"
  - target:
      kind: IngressRoute
    patch: |-
      - op: add
        path: /spec/routes/0/services/0/serversTransport
        value: insecure
configMapGenerator:
  - name: unifi-values
    files:
      - values.yaml=values.yml
configurations:
  - ../kustomizeconfig.yml
