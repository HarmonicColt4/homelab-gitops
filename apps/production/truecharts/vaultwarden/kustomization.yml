---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/truecharts/vaultwarden
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/chart/spec/version
        value: "28.x"
      - op: add
        path: /spec/values
        value:
          ingress:
            main:
              enabled: true
