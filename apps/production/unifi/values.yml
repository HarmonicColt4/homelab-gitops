---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: unifi.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - unifi.weirdrussiandomain.com
        secretName: unifi-cert
global:
  fallbackDefaults:
    pvcSize: 10Gi
    vctSize: 10Gi
