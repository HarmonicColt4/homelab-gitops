---
# Source: tc-helmrelease-chart/templates/values.yml
service:
  main:
    annotations:
      traefik.ingress.kubernetes.io/service.serverstransport: traefik-insecure@kubernetescrd
  comm:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: 10.13.25.2

ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: unifi.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - unifi.weirdrussiandomain.com
        secretName: unifi-cert
workload:
  main:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
global:
  fallbackDefaults:
    pvcSize: 10Gi
    vctSize: 10Gi
