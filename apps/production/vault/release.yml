---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
spec:
  releaseName: vault
  interval: 30m
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: vault
      sourceRef:
        kind: HelmRepository
        name: hashicorp
      interval: 1h
  valuesFrom: []
