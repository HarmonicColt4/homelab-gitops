---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: flux-system
spec:
  interval: 30m
  releaseName: qdrant
  targetNamespace: qdrant
  chart:
    spec:
      chart: qdrant
      version: 1.18.1
      sourceRef:
        kind: HelmRepository
        name: qdrant
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: qdrant-values
