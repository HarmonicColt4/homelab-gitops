  targetNamespace: adguard-home
  interval: 24h
  chart:
    spec:
      chart: adguard-home
      version: 11.*
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: values
