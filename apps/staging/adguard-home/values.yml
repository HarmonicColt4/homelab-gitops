---
# Source: tc-helmrelease-chart/templates/values.yml
ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: adguard-home.staging.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - adguard-home.staging.weirdrussiandomain.com
        secretName: adguard-home-cert
persistence:
  config:
    size: 1Gi
  data:
    size: 1Gi
service:
  main:
    type: LoadBalancer
  dns-https:
    type: LoadBalancer
  dns-https-udp:
    type: LoadBalancer
  dns-crypt:
    type: LoadBalancer
  dns-crypt-udp:
    type: LoadBalancer
  dns-quic-udp-1:
    type: LoadBalancer
