---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-prometheus-stack
namespace: monitoring
patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/targetNamespace
        value: monitoring
      - op: add
        path: /spec/storageNamespace
        value: monitoring