apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flaresolverr

resources:
  - flaresolverr

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/targetNamespace
        value: torrents
      - op: add
        path: /spec/storageNamespace
        value: torrents