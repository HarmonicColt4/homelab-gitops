apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/prowlarr

patches:
  - target:
      kind: HelmRelease
      name: prowlarr
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: prowlarr-env-values

configMapGenerator:
  - name: prowlarr-env-values
    files:
      - values.yaml=values.yml