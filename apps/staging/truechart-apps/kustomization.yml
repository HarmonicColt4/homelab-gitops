---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - torrents

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: default-values

configMapGenerator:
  - name: default-values
    files:
      - values.yaml=default-values.yml
      
configurations:
  - kustomizeconfig.yml
