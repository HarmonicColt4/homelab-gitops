apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/truecharts/actualserver

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: actualserver-values    

configMapGenerator:
  - name: actualserver-values
    files:
      - values.yaml=values.yml