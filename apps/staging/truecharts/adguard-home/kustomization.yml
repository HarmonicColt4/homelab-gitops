apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/truecharts/adguard-home

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: adguard-home-values    

configMapGenerator:
  - name: adguard-home-values
    files:
      - values.yaml=values.yml