ingress:
  main:
    enabled: true
    hosts:
      - host: adguard-home.weirdrussiandomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - adguard-home.weirdrussiandomain.com
        secretName: adguard-home-cert
service:
  dns-tcp:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/loadBalancerIPs: 10.13.13.3
      metallb.universe.tf/allow-shared-ip: dns
  dns-udp:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
