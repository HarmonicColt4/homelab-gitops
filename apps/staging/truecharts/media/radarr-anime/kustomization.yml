---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../radarr
nameSuffix: -anime
configMapGenerator:
  - name: radarr-values
    behavior: replace
    files:
      - values.yaml=values.yml
patches:
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`radarr-anime.${domain}`) && PathPrefix(`/`)
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/releaseName
        value: radarr-anime        