---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: prometheus-operator
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`grafana.staging.weirdrussiandomain.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: prometheus-operator-grafana
          port: 80
