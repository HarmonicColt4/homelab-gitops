---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/truecharts/prometheus-operator
  - ingress-route.yml

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: kps-values

configMapGenerator:
  - name: kps-values
    files:
      - values.yaml=values.yml

configurations:
  - ../../kustomizeconfig.yml