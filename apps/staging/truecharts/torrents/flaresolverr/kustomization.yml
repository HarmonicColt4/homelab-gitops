apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/truecharts/flaresolverr

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: flaresolverr-values

configMapGenerator:
  - name: flaresolverr-values
    files:
      - values.yaml=values.yml