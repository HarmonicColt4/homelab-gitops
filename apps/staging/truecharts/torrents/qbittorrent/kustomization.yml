apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/truecharts/qbittorrent

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: qbittorrent-values

configMapGenerator:
  - name: qbittorrent-values
    files:
      - values.yaml=values.yml