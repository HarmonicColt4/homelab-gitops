---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualserver
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: actualserver
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 14.16.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
