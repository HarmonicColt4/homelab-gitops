---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualserver
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: actualserver
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: actualserver
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 16.14.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
