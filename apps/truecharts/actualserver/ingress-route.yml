---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actualserver
  namespace: actualserver
spec:
  entryPoints:
  - websecure
  routes:
  - match: HostRegexp(`^(actualserver|budget)\.teamg\.gg$`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: authentik
      namespace: traefik
    services:
    - name: actualserver
      port: 10293
