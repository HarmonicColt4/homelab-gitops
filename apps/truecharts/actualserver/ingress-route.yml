---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actualserver
  namespace: actualserver
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`budget.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: tinyauth
      namespace: tinyauth
    services:
    - name: actualserver
      port: 10293
