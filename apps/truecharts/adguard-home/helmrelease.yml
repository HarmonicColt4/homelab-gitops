---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: flux-system
spec:
  interval: 24h
  releaseName: adguard-home
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: adguard-home
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 13.3.3
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: adguard-home-values
