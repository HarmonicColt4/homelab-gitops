---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: adguard-home
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 12.13.4
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: adguard-home-values
