---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: adguard-home
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: adguard-home
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 13.9.0
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 1
                        preference:
                          matchExpressions:
                            - key: criticality
                              operator: In
                              values:
                                - high
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: adguard-home-values
