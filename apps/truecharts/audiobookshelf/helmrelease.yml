---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: flux-system
spec:
  interval: 1h
  releaseName: audiobookshelf
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: audiobookshelf
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 13.12.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: audiobookshelf-values
