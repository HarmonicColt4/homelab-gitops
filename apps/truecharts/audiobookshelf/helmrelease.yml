---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: audiobookshelf
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 12.20.2
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: audiobookshelf-values
