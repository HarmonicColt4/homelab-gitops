---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: calibre-web
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 21.14.6
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: calibre-web-values
  values:
    TZ: Pacific/Auckland
