---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
spec:
  interval: 24h
  upgrade:
    remediation:
      strategy: rollback
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cloudflareddns
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 12.14.6
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: Secret
    name: cloudflareddns-values
