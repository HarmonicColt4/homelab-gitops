---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
  namespace: flux-system
spec:
  interval: 24h
  releaseName: cloudflareddns
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cloudflareddns
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 14.4.2
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cloudflareddns-values
