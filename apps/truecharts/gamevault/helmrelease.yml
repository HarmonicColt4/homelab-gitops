---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gamevault-backend
  namespace: flux-system
spec:
  timeout: 10m
  releaseName: gamevault-backend
  interval: 1h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: gamevault-backend
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 15.1.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cnpg-values
    - kind: Secret
      name: gamevault-backend-values
