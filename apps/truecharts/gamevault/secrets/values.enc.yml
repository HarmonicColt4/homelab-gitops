gamevault:
  server:
    admin_username: ENC[AES256_GCM,data:ucanqqcs,iv:YSUsMjtmvS3LX1v2w+cPeJY/po1yMdb87LB6mXtS5lc=,tag:9C59eMwYoDhYlQGfHUR+xw==,type:str]
    admin_password: ENC[AES256_GCM,data:nTXOjC1ZG4w=,iv:Q3aysjHZQVZ68kMvxmo0UjTT90zQ3fhl1ZYKeTSMvFg=,tag:CID6p/Of+catGqa+5gl8Gg==,type:str]
    registration_disabled: true
    account_activation_disabled: false
    allowed_origins:
      - '*'
    log_level: info
  games:
    index_use_polling: true
    index_interval_in_minutes: 5
    search_recursive: true
    file_formats:
      - .7z
      - .rar
      - .zip
  images:
    gc_keep_days: 30
    gc_interval_minutes: 60
  rawg:
    api_url: https://api.rawg.io/api
    api_cache_days: 7
    api_key: ENC[AES256_GCM,data:skCMbbExC3lG/ZfkILTrSPysQDlKwHNcH8u/4dVrtCo=,iv:y7FcQXEaXwOl2KWHznO+bmlgpmVAOrN2ohps7kFchIc=,tag:al6iefypxRPTSUelh/wgyQ==,type:str]
  metadata:
    enabled: true
    client_id: ENC[AES256_GCM,data:EZ8ZtFEnWFRO0xV3W+G60yhvQztWTNisw/3FPjWl,iv:KdwoxKZpzp8Sh+y7ucBd+MRqxJInIeIqHP9lFvvlizA=,tag:u0n08qlvhNLV2V8w4xslVw==,type:str]
    client_secret: ENC[AES256_GCM,data:8Rll/KsDOxpARv5FTY+uRHVLhC7osRYDTA1jN2wV,iv:6YTl0EnzxSi6wzxbdDfv9u/p2WI3emwTOz8u7CQACwY=,tag:0y+DoniKiqsVijm0hSzjsQ==,type:str]
persistence:
  logs:
    enabled: true
    mountPath: /logs
  images:
    enabled: true
    mountPath: /media
  games:
    enabled: true
    type: nfs
    path: /mnt/media/games
    server: truenas.home.arpa
    mountPath: /games
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            # GAMES            
            GAMES_INDEX_USE_POLLING: '{{ .Values.gamevault.games.index_use_polling }}'
            # METADATA
            METADATA_IGDB_ENABLED: '{{ .Values.gamevault.metadata.enabled }}'
            METADATA_IGDB_CLIENT_ID: '{{ .Values.gamevault.metadata.client_id }}'
            METADATA_IGDB_CLIENT_SECRET: '{{ .Values.gamevault.metadata.client_secret }}'
credentials:
  garage:
    type: s3
    url: http://truenas.home.arpa:30188
    bucket: gamevault-backend
cnpg:
  main:
    backups:
      enabled: true
      credentials: garage
      destinationPath: s3://gamevault-backend
    recovery:
      credentials: garage
      destinationPath: s3://gamevault-backend
