gamevault:
  server:
    admin_username: ENC[AES256_GCM,data:dkAFu+G8,iv:xqU/zprg4qzH4YjeI8Qg7xVva1lwwN6sRAP2DsGEon4=,tag:BoK/WC8lb5lU6WiXprNh4w==,type:str]
