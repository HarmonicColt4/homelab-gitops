gamevault:
  server:
    admin_username: ENC[AES256_GCM,data:lmKkfzsk,iv:tfsNzzxARrxXgmB0ci2A/ID4AnEmdnRCkzI4OlrzT24=,tag:j1bYQnoSfDt3Yz3HlyIDeQ==,type:str]
    admin_password: ENC[AES256_GCM,data:1zDyvMfo9jQ=,iv:BAHbdMTnCIdv9tbfU2Jeq3xiy+M+pgV2X1FJ01YWT90=,tag:pWp6BLtX1zY1kCwfnkZC9g==,type:str]
    registration_disabled: true
    account_activation_disabled: false
    allowed_origins:
      - '*'
    log_level: info
  games:
    index_use_polling: true
    index_interval_in_minutes: 5
    search_recursive: true
    file_formats:
      - .7z
  images:
    gc_keep_days: 30
    gc_interval_minutes: 60
  rawg:
    api_url: https://api.rawg.io/api
    api_cache_days: 7
    api_key: ENC[AES256_GCM,data:ejtP1x0oxadzvmyI7hS58jeIIT7KIjEGJqPHyXdW1PA=,iv:9JEOy5fwfHnFniri7jg1dKFI35VPLhQSJ4ceiWsmLLg=,tag:Syt8wxmPdc3pGX3RBUYb6g==,type:str]
  metadata:
    enabled: true
    client_id: ENC[AES256_GCM,data:KzFahQmt4JVk+U8YhQJgUll3mtVnK+3OqS+gBp9a,iv:1Y5LfxWQ+LOWA0Ncu8u5E4odByJvGtWQE5RO/BFa4Co=,tag:A5UqiIqezxfaIrFdZTomGg==,type:str]
    client_secret: ENC[AES256_GCM,data:ZdsCOKO6LmSRXIdrKiCyo0lTy8zWl0biqQQDnzs3,iv:WuESyM5vtS5W9P6U5qreGeI0b1wpThzvNJH2feFaveg=,tag:WbGvWVpZPFXuvVz6Ko950g==,type:str]
persistence:
  logs:
    enabled: true
    mountPath: /logs
    size: 10Gi
  images:
    enabled: true
    mountPath: /media
  games:
    enabled: true
    type: nfs
    path: /mnt/media/games
    server: truenas.home.arpa
    mountPath: /games
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            # GAMES            
            GAMES_INDEX_USE_POLLING: '{{ .Values.gamevault.games.index_use_polling }}'
            # METADATA
            METADATA_IGDB_ENABLED: '{{ .Values.gamevault.metadata.enabled }}'
            METADATA_IGDB_CLIENT_ID: '{{ .Values.gamevault.metadata.client_id }}'
            METADATA_IGDB_CLIENT_SECRET: '{{ .Values.gamevault.metadata.client_secret }}'
credentials:
  garage:
    type: s3
    url: http://truenas.home.arpa:30188
    bucket: gamevault-backend
cnpg:
  main:
    backups:
      enabled: true
      credentials: garage
      destinationPath: s3://gamevault-backend
    recovery:
      credentials: garage
      destinationPath: s3://gamevault-backend
