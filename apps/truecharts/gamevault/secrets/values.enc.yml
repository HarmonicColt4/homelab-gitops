    registration_disabled: true
    account_activation_disabled: false
    allowed_origins:
      - '*'
    log_level: info
  games:
    index_interval_in_minutes: 5
    search_recursive: true
    file_formats:
      - .7z
      - .rar
      - .zip
  images:
    gc_keep_days: 30
    gc_interval_minutes: 60
  rawg:
    api_url: https://api.rawg.io/api
    api_cache_days: 7
    api_key: ENC[AES256_GCM,data:TJvyzvmMhEAGe9n6TE+plAaH1TA1ELecSxow0M2Q3XY=,iv:/bwyG6wiXSLCBymudE2ZvnuvZAh6jjzhjE0UbUbZmt0=,tag:+YEPb4LaK54Ub929nsTdcg==,type:str]
  metadata:
    enabled: true
    client_id: ENC[AES256_GCM,data:1/XeJZB36uD8aVfUv40UEaK0cFe1V38wtuPrNTwi,iv:b00J5qCGF9CfixMeZEBPeM4b/Nk0YauF7CwYYu5BtmU=,tag:FsO0/hopcLj7Eou0Vu40Zw==,type:str]
