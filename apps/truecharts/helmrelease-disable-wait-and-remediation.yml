---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: not-important
spec:
  install:
    disableWait: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    disableWait: true
    strategy:
      name: RemediateOnFailure
    remediation:
      strategy: rollback
      retries: 3
      remediateLastFailure: true
