---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: home-assistant
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 24h
      version: 28.15.1
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: home-assistant-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: mosquitto
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 24h
      version: 17.11.3
  valuesFrom:
  - kind: ConfigMap
    name: global-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: zigbee2mqtt
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 24h
      version: 15.12.3
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: zigbee2mqtt-values
