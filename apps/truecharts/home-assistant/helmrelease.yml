---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  timeout: 10m
  releaseName: home-assistant
  interval: 1h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: home-assistant
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 31.6.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: home-assistant-values
    - kind: Secret
      name: cnpg-values
