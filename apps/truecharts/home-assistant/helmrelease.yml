---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: home-assistant
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 28.17.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: home-assistant-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: mosquitto
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 17.12.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: zigbee2mqtt
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 15.13.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: zigbee2mqtt-values
