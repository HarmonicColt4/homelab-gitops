---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: flux-system
spec:
  releaseName: mosquitto
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: mosquitto
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 18.4.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values