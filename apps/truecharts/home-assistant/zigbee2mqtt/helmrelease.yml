apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
  namespace: flux-system
spec:
  timeout: 10m
  releaseName: zigbee2mqtt
  interval: 1h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: zigbee2mqtt
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 17.0.3
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: zigbee2mqtt-values
