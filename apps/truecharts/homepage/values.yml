---
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            HOMEPAGE_ALLOWED_HOSTS: teamg.app
            LOG_TARGETS: stdout
      initContainers:
        init-config:
          enabled: false

persistence:
  config:
    enabled: false
  kubernetes-config:
    enabled: false
  bookmarks-config:
    enabled: false
  settings-config:
    enabled: false
  services-config:
    enabled: false
  widgets-config:
    enabled: false
  custom-css-config:
    enabled: false
  custom-js-config:
    enabled: false
  
  conf:
    enabled: true
    type: configmap
    objectName: config
    mountPath: /app/config

configmap:
  config:
    enabled: true
    data:
      kubernetes.yaml: |
        ---
        # For configuration options and examples, please see:
        # https://gethomepage.dev/configs/kubernetes/

        mode: cluster
      settings.yaml: |
        ---
        # For configuration options and examples, please see:
        # https://gethomepage.dev/configs/

        providers:
          openweathermap: openweathermapapikey
          weatherapi: weatherapiapikey
      widgets.yaml: |
        ---
        # For configuration options and examples, please see:
        # https://gethomepage.dev/widgets/

        - resources:
            cpu: true
            memory: true
            disk: /

        - search:
            provider: duckduckgo
            target: _blank

      services.yaml: |
        ---
        # For configuration options and examples, please see:
        # https://gethomepage.dev/configs/services/

        - Arr:
            - My First Service:
                href: http://localhost/
                description: Homepage is awesome

        - Media:
            - My Second Service:
                href: http://localhost/
                description: Homepage is the best

        - Infra:
            - My Third Service:
                href: http://localhost/
                description: Homepage is 😎
      bookmarks.yaml: |
        ---
        # For configuration options and examples, please see:
        # https://gethomepage.dev/configs/bookmarks/

        - Developer:
            - Github:
                - abbr: GH
                  href: https://github.com/

        - Social:
            - Reddit:
                - abbr: RE
                  href: https://reddit.com/

        - Entertainment:
            - YouTube:
                - abbr: YT
                  href: https://youtube.com/

        - TrueCharts:
            - TrueCharts:
              - abbr: TC
                icon: https://trueforge.org/svg/favicon.svg
                href: https://truecharts.org
                description: "TrueCharts Website"
            - Github:
              - abbr: GH
                icon: https://github.com/fluidicon.png
                href: https://github.com/truecharts
                description: "TrueCharts GitHub"
            - Open Collective:
              - abbr: TC
                icon: https://opencollective.com/favicon.ico
                href: https://opencollective.com/truecharts
                description: "TrueCharts Open Collective"
            - Discord:
              - abbr: DC
                icon: https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://discord.com&size=32
                href: https://trueforge.org/s/discord
                description: "TrueCharts Discord"