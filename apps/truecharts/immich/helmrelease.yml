---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  releaseName: immich
  targetNamespace: immich
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 25.11.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: Secret
    name: cnpg-values
  - kind: ConfigMap
    name: immich-values
