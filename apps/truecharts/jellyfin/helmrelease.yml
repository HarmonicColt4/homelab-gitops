---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellyfin
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 22.2.9
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: jellyfin-values
