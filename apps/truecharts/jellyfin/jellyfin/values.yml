---
persistence:
  data:
    size: 10Gi
  config:
    size: 20Mi
  movies:
    enabled: true
    type: nfs
    path: /mnt/media/movies
    server: truenas.home.arpa
    mountPath: /movies
  shows:
    enabled: true
    type: nfs
    path: /mnt/media/shows
    server: truenas.home.arpa
    mountPath: /shows

workload:
  main:
    replicas: 1
    podSpec:
      containers:
        main:
          env:
            JELLYFIN_PublishedServerUrl: jellyfin.teamg.app

resources:
  limits:
    gpu.intel.com/i915: 1

service:
  autodiscovery:
    enabled: false
