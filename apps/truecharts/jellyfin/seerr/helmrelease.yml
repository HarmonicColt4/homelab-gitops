---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: flux-system
spec:
  interval: 24h
  releaseName: seerr
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: seerr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 16.4.2
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cnpg-values
    - kind: ConfigMap
      name: seerr-values
