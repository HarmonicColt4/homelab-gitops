migrateImage:
  repository: ghcr.io/ralgar/pgloader
  pullPolicy: IfNotPresent
  tag: pr-1531@sha256:e5ae0b8149058828938d0f14ccc1f793171db8c4c8b69b7b6b45dfd998f0149f

workload:
  main:
    podSpec:
      containers:
        main:
          enabled: false
        migrate:
          enabled: true
          imageSelector: migrateImage
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          args:
            - pgloader
            - --with
            - "quote identifiers"
            - --with
            - "data only"
            - /app/config/db.sqlite3
            - "{{ .Values.cnpg.main.creds.std }}"

persistence:
  config:
    enabled: true
    targetSelectAll: true

credentials:
  garage:
    type: s3
    url: http://truenas.home.arpa:30188
    bucket: seerr
cnpg:
  main:
    backups:
      enabled: true
      credentials: garage
      destinationPath: s3://seerr
    recovery:
      credentials: garage
      destinationPath: s3://seerr
