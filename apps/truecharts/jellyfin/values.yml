---
persistence:
  data:
    volumeName: jellyfin-data
    storageClass: longhorn
    size: 20Gi
  config:
    volumeName: jellyfin-config
    storageClass: longhorn
  movies:
    enabled: true
    type: nfs
    path: /mnt/media/movies
    server: truenas.home.arpa
    mountPath: /movies
  shows:
    enabled: true
    type: nfs
    path: /mnt/media/shows
    server: truenas.home.arpa
    mountPath: /shows

workload:
  main:
    podSpec:
      containers:
        main:
          resources:
            limits:
              cpu: "4"
              gpu.intel.com/i915: 1
          env:
            JELLYFIN_PublishedServerUrl: jellyfin-nuc.teamg.app
  broadcastproxy:
    enabled: true

autodiscovery:
  enabled: true
