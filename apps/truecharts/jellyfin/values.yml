---
persistence:
  config:
    size: 10Gi
  anime:
    enabled: true
    type: nfs
    path: /mnt/media/anime
    server: truenas.home.auckland
    mountPath: /anime
  movies-1080p:
    enabled: true
    type: nfs
    path: /mnt/media/movies-1080p
    server: truenas.home.auckland
    mountPath: /movies-1080p
  movies-4k:
    enabled: true
    type: nfs
    path: /mnt/media/movies-4k
    server: truenas.home.auckland
    mountPath: /movies-4k
  series-1080p:
    enabled: true
    type: nfs
    path: /mnt/media/series-1080p
    server: truenas.home.auckland
    mountPath: /series-1080p
  series-4k:
    enabled: true
    type: nfs
    path: /mnt/media/series-4k
    server: truenas.home.auckland
    mountPath: /series-4k
service:
  autodiscovery:
    enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          resources:
            limits:
              gpu.intel.com/i915: 1
          env:
            JELLYFIN_PublishedServerUrl: jellyfin.weirdrussiandomain.com
resources:
  limits:
    cpu: 7000m
