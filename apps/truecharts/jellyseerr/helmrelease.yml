---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellyseerr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 13.12.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
