---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yml
- repository.yml
- adguard-home
- actualserver
- cloudnative-pg
- cloudflareddns
- cnpg
- homepage
- immich
- jellyfin
- prowlarr
- profilarr
- qbittorrent
- radarr
- sonarr
- vaultwarden
- unifi
- uptime-kuma

configMapGenerator:
- name: global-values
  namespace: flux-system
  files:
  - values.yaml=global-values.yml

configurations:
- kustomizeconfig.yml
