---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - repository.yml
  - actualserver
  - adguard-home
  - cloudflareddns
  - homepage
  - immich
  - jellyfin
  - prowlarr
  - profilarr
  - qbittorrent
  - radarr
  # - searxng
  - sonarr
  # - stirling-pdf
  - tandoor
  - vaultwarden
  - unifi
  - uptime-kuma

configMapGenerator:
  - name: global-values
    namespace: flux-system
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml=global-values.yml

secretGenerator:
  - name: cnpg-values
    namespace: flux-system
    files:
      - values.yaml=cnpg-values.enc.yml
