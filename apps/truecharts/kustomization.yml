---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - repository.yml
  - actualserver
  - adguard-home
  - audiobookshelf
  - cloudflareddns
  - homepage
  - home-assistant
  - immich
  - seerr
  - prowlarr
  - profilarr
  - qbittorrent
  - radarr
  - sabnzbd
  - sonarr
  - tandoor
  - vaultwarden
  - uptime-kuma

configMapGenerator:
  - name: global-values
    namespace: flux-system
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml=global-values.yml

secretGenerator:
  - name: cnpg-values
    namespace: flux-system
    files:
      - values.yaml=cnpg-values.enc.yml

configurations:
  - ../../kustomizeconfig.yml
