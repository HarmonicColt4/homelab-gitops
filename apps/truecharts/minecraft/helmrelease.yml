---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: minecraft-java
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 23.46.0
  values:
    service:
      main:
        type: LoadBalancer
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: minecraft-values
