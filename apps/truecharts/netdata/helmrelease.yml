---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: netdata
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 13.16.3
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: netdata-values
