---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: flux-system
spec:
  interval: 24h
  releaseName: profilarr
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: profilarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 3.3.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
  values:
    TZ: Pacific/Auckland
