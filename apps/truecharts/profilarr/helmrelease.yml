---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: profilarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 21.0.0
  uninstall:
    deletionPropagation: orphan
  valuesFrom:
  - kind: ConfigMap
    name: global-values
