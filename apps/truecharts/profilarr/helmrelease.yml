---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: profilarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 2.13.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  values:
    TZ: Pacific/Auckland
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr-anime
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: profilarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 2.13.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  values:
    TZ: Pacific/Auckland
