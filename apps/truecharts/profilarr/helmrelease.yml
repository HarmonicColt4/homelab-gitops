---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: flux-system
spec:
  interval: 24h
  releaseName: profilarr
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: profilarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 2.14.17
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  values:
    TZ: Pacific/Auckland
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr-anime
  namespace: flux-system
spec:
  interval: 24h
  releaseName: profilarr-anime
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: profilarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 2.14.17
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  values:
    TZ: Pacific/Auckland
