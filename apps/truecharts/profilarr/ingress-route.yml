---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: profilarr
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`profilarr.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: profilarr
      port: 6868
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: profilarr-anime
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`profilarr-anime.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: profilarr-anime
      port: 6868
