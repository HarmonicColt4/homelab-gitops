---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: flaresolverr
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: flaresolverr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 18.0.3
  valuesFrom:
    - kind: ConfigMap
      name: global-values
