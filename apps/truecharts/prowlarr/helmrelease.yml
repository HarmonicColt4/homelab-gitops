---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  releaseName: prowlarr
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: prowlarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 21.3.3
  uninstall:
    deletionPropagation: orphan
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  values:
    metrics:
      main:
        enabled: false
    configmap:
      dashboard:
        enabled: false
