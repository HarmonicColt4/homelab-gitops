---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: flux-system
spec:
  releaseName: prowlarr
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: prowlarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 22.7.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
  values:
    metrics:
      main:
        enabled: false
    configmap:
      dashboard:
        enabled: false
