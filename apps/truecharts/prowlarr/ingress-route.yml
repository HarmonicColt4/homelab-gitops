---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`prowlarr.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: authentik
      namespace: traefik
    services:
    - name: prowlarr
      port: 9696
