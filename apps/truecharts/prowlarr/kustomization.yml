---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - helmrelease.yml
  - ingress-route.yml
  - flaresolverr

transformers:
  - |
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-important-to-example
      namespace: prowlarr
    setRoleBindingSubjects: none
    unsetOnly: true
    fieldSpecs:
      - kind: HelmRelease
        path: spec/targetNamespace
        create: true
