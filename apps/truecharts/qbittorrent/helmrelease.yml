---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: qbittorrent
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 24.1.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: qbittorrent-values
  uninstall:
    deletionPropagation: orphan
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
