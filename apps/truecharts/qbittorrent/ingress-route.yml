---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  entryPoints:
  - websecure
  routes:
  - match: HostRegexp(`^(qbit|qbittorrent)\.teamg\.gg$`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: tinyauth
      namespace: tinyauth
    services:
    - name: qbittorrent
      port: 10095
