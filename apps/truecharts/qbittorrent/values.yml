---
service:
  torrent:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.30
    ports:
      torrent:
        port: 23507

persistence:
  config:
    targetSelectAll: true
  shows:
    enabled: true
    type: nfs
    path: /mnt/media/shows/torrents
    server: truenas.home.arpa
    mountPath: /shows/torrents
  movies:
    enabled: true
    type: nfs
    path: /mnt/media/movies/torrents
    server: truenas.home.arpa
    mountPath: /movies/torrents
  books:
    enabled: true
    type: nfs
    path: /mnt/media/books/torrents
    server: truenas.home.arpa
    mountPath: /books/torrents
  games:
    enabled: true
    type: nfs
    path: /mnt/media/games
    server: truenas.home.arpa
    mountPath: /games
  downloads:
    enabled: true
    type: nfs
    path: /mnt/media/downloads
    server: truenas.home.arpa
    mountPath: /downloads

workload:
  main:
    podSpec:
      initContainers:
        vuetorrent-setup:
          enabled: true
          imageSelector: gitImage
          type: install
          args:
            - clone
            - --single-branch
            - --branch
            - latest-release
            - https://github.com/VueTorrent/VueTorrent.git
            - /config/vuetorrent
        vuetorrent-update:
          enabled: true
          imageSelector: gitImage
          type: upgrade
          args:
            - -C
            - /config/vuetorrent
            - pull

gitImage:
  repository: alpine/git
  pullPolicy: IfNotPresent
  tag: v2.54.0
