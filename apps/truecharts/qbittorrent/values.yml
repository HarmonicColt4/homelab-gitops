---
service:
  torrent:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.30
    ports:
      torrent:
        port: 23507
persistence:
  shows:
    enabled: true
    type: nfs
    path: /mnt/media/shows/torrents
    server: truenas.home.arpa
    mountPath: /shows/torrents
  movies:
    enabled: true
    type: nfs
    path: /mnt/media/movies/torrents
    server: truenas.home.arpa
    mountPath: /movies/torrents
  books:
    enabled: true
    type: nfs
    path: /mnt/media/books/torrents
    server: truenas.home.arpa
    mountPath: /books/torrents
  games:
    enabled: true
    type: nfs
    path: /mnt/media/games
    server: truenas.home.arpa
    mountPath: /games
  downloads:
    enabled: true
    type: nfs
    path: /mnt/media/downloads
    server: truenas.home.arpa
    mountPath: /downloads
  vuetorrent:
    enabled: true
    type: pvc
    mountPath: /vuetorrent
    accessModes: ReadWriteMany
    size: 200Mi
