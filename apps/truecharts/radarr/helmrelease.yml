---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 26.3.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: radarr-values
  values:
    metrics:
      main:
        enabled: false
