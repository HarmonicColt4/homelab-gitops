---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: radarr
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 27.12.0
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 1
                        preference:
                          matchExpressions:
                            - key: criticality
                              operator: In
                              values:
                                - high
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: radarr-values
  values:
    metrics:
      main:
        enabled: false
