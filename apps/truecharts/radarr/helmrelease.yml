---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: flux-system
spec:
  interval: 24h
  releaseName: radarr
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 27.8.3
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: radarr-values
  values:
    metrics:
      main:
        enabled: false
