---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`radarr.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: tinyauth
      namespace: tinyauth
    - name: auth
    services:
    - name: radarr
      port: 7878
