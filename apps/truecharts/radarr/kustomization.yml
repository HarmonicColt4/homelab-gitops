---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yml
- helmrelease.yml
- ingress-route.yml
- middleware.yml
- secret.enc.yml
- ../global-values
- ../../../observability

namespace: radarr

configMapGenerator:
- name: radarr-values
  files:
  - values.yaml=values.yml
