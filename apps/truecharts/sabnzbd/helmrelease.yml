---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: flux-system
spec:
  interval: 24h
  releaseName: sabnzbd
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: sabnzbd
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 25.1.2
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: sabnzbd-values
