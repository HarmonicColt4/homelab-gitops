---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: sabnzbd
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: sabnzbd
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 25.9.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: sabnzbd-values
