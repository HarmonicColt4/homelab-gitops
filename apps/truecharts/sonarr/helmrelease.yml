---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: sonarr
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: sonarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 26.7.6
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: sonarr-values
  values:
    metrics:
      main:
        enabled: false
