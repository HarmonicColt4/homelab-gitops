---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: flux-system
spec:
  interval: 24h
  releaseName: sonarr
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: sonarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 25.2.20
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: sonarr-values
  values:
    metrics:
      main:
        enabled: false
