---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`sonarr.teamg.app`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: tinyauth
      namespace: tinyauth
    services:
    - name: sonarr
      port: 8989
