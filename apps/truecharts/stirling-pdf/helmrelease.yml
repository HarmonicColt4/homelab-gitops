---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: flux-system
spec:
  interval: 24h
  releaseName: stirling-pdf
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: stirling-pdf
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 9.22.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
