---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: stirling-pdf
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 8.4.3
  valuesFrom:
  - kind: ConfigMap
    name: global-values
