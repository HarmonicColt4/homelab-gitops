---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stirling-pdf
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`pdf.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
    - name: authentik
      namespace: traefik
    services:
    - name: stirling-pdf
      port: 18080
