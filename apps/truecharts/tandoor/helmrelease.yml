---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor
  namespace: flux-system
spec:
  releaseName: tandoor
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tandoor-recipes
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 21.7.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cnpg-values
    - kind: ConfigMap
      name: tandoor-values
