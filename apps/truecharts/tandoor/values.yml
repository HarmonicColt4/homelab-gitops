credentials:
  garage:
    type: s3
    url: http://truenas.home.arpa:30188
    bucket: tandoor
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            GUNICORN_TIMEOUT: 300
cnpg:
  main:
    mode: recovery
    backups:
      enabled: true
      credentials: garage
      destinationPath: s3://tandoor
      revision: "1"
    recovery:
      credentials: garage
      destinationPath: s3://tandoor
