apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Values.releaseName }}
spec:
  releaseName: {{ .Values.releaseName }}
  targetNamespace: {{ .Values.targetNamespace }}
  interval: 24h
  chart:
    spec:
      chart: {{ .Values.chart }}
      version: {{ .Values.version }}
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: default
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: values
    # - kind: Secret
    #   name: values