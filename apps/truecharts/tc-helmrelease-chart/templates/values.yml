ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt
    enabled: true
    hosts:
      - host: {{ .Values.releaseName }}.{{ .Values.domain }}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - {{ .Values.releaseName }}.{{ .Values.domain }}
        secretName: {{ .Values.releaseName }}-cert
workload:
  main:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
global:
  fallbackDefaults:
    pvcSize: 10Gi
    vctSize: 10Gi