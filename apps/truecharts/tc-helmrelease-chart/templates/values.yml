ingress:
  main:
    integrations:
      traefik:
        enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      cert-manager.io/cluster-issuer: letsencrypt-staging
    enabled: true
    hosts:
      - host: {{ .Values.releaseName }}.{{ .Values.domain }}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - {{ .Values.releaseName }}.{{ .Values.domain }}
        secretName: {{ .Values.releaseName }}-cert
securityContext:
    container:
        PUID: 568
        runAsUser: 568
        runAsGroup: 568