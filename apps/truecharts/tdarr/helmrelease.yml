---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
spec:
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tdarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 12.21.0
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: tdarr-values
