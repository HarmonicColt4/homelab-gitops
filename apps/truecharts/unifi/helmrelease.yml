---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: unifi
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: unifi
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 26.14.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: unifi-values
