---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: unifi
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 24.14.3
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: ConfigMap
    name: unifi-values
