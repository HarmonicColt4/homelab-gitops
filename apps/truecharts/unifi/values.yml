---
service:
  comm:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.2
      metallb.io/allow-shared-ip: unifi
  l2:
    enabled: true
    ports:
      l2:
        port: 10001
        enabled: true
        protocol: udp
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.2
      metallb.io/allow-shared-ip: unifi
persistence:
  config:
    enabled: false
workload:
  main:
    podSpec:
      initContainers:
        migrate:
          enabled: false
      containers:
        main:
          env:
            RUN_CHOWN: false
          probes:
            startup:
              spec:
                initialDelaySeconds: 100
securityContext:
  container:
    PUID: 999
  pod:
    fsGroup: 999
    supplementalGroups:
      - 999
