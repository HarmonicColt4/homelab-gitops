---
image:
  repository: ghcr.io/goofball222/unifi
  tag: 10.0.162-mongo8
  pullPolicy: IfNotPresent
service:
  comm:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.2
persistence:
  config:
    enabled: false
workload:
  main:
    replicas: 0
    podSpec:
      initContainers:
        migrate:
          enabled: false
      containers:
        main:
          env:
            RUN_CHOWN: true
          probes:
            startup:
              spec:
                initialDelaySeconds: 100
