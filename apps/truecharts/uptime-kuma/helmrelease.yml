---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: uptime-kuma
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: uptime-kuma
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 14.7.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
