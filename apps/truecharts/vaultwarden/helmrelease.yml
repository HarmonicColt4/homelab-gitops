---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  releaseName: vaultwarden
  targetNamespace: vaultwarden
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: vaultwarden
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 29.13.3
  valuesFrom:
  - kind: ConfigMap
    name: global-values
  - kind: Secret
    name: cnpg-values
  - kind: ConfigMap
    name: vaultwarden-values
  values:
    ingress:
      main:
        enabled: true
        integrations:
          traefik:
            enabled: false
        hosts:
        - host: vaultwarden.test.com
          paths:
          - path: /
            pathType: Prefix
