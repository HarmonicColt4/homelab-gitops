---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  releaseName: vaultwarden
  interval: 24h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: vaultwarden
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 30.9.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cnpg-values
    - kind: Secret
      name: vaultwarden-values
  values:
    ingress:
      main:
        required: false
        enabled: false
