---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  timeout: 10m
  releaseName: vaultwarden
  interval: 1h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: vaultwarden
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 30.9.2
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 1
                        preference:
                          matchExpressions:
                            - key: criticality
                              operator: In
                              values:
                                - high
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cnpg-values
    - kind: Secret
      name: vaultwarden-values
  values:
    ingress:
      main:
        required: false
        enabled: false
