---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  entryPoints:
  - websecure
  routes:
  - match: HostRegexp(`vaultwarden\.(teamg\.gg|weirdrussiandomain\.com)`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: vaultwarden
      port: 10102
