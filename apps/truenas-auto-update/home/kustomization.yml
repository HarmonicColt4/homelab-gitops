apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

nameSuffix: -home

secretGenerator:
  - name: config
    envs:
      - secrets/enc.env

patches:
  - target:
      kind: CronJob
    patch: |
      - op: add
        path: /spec/timeZone
        value: Pacific/Auckland
