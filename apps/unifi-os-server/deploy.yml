apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-os-server
  labels:
    app: unifi-os-server
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi-os-server
  template:
    metadata:
      labels:
        app: unifi-os-server
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: criticality
                    operator: In
                    values:
                      - high
      containers:
        - name: unifi-os-server
          image: ghcr.io/lemker/unifi-os-server:v1.7.0
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: UOS_SYSTEM_IP
              value: 10.25.25.4
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - "echo $HOST_IP host.docker.internal >> /etc/hosts"
          volumeMounts:
            - name: unifi-os-server-data
              mountPath: /persistent
              subPath: persistent
            - name: unifi-os-server-data
              mountPath: /var/log
              subPath: log
            - name: unifi-os-server-data
              mountPath: /data
              subPath: data
            - name: unifi-os-server-data
              mountPath: /srv
              subPath: srv
            - name: unifi-os-server-data
              mountPath: /var/lib/unifi
              subPath: unifi
            - name: unifi-os-server-data
              mountPath: /var/lib/mongodb
              subPath: mongodb
            - name: unifi-os-server-data
              mountPath: /etc/rabbitmq/ssl
              subPath: rabbitmq
          ports:
            - name: webui
              containerPort: 443
              protocol: TCP
            - name: rtp
              containerPort: 5005
              protocol: TCP
            - name: id-hub
              containerPort: 9543
              protocol: TCP
            - name: mobile-sp
              containerPort: 6789
              protocol: TCP
            - name: communication
              containerPort: 8080
              protocol: TCP
            - name: hotspot-sec
              containerPort: 8444
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: syslog
              containerPort: 5514
              protocol: UDP
            - name: discovery
              containerPort: 10003
              protocol: UDP
            - name: support-files
              containerPort: 28082
              protocol: TCP
            - name: aqmps
              containerPort: 5671
              protocol: TCP
            - name: hs-redirect-0
              containerPort: 8880
              protocol: TCP
            - name: hs-redirect-1
              containerPort: 8881
              protocol: TCP
            - name: hs-redirect-2
              containerPort: 8882
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: unifi-os-server-data
          persistentVolumeClaim:
            claimName: unifi-os-server-pvc
