---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-configs
  interval: 24h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
  prune: false
  wait: true
  suspend: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-new
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-configs
  interval: 24h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps-new
  prune: false
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
