---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/dietpi
  prune: true
  wait: true
  postBuild:
    substitute:
      domain: "weirdrussiandomain.com"
      infisical_envSlug: dietpi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs/dietpi
  prune: true
  wait: true
  postBuild:
    substitute:
      domain: "weirdrussiandomain.com"
      infisical_envSlug: dietpi
      cluster_name: dietpi
