apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tc-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/dietpi/truecharts
  prune: true
  wait: true
  postBuild:
    substitute:
      domain: 'weirdrussiandomain.com'
