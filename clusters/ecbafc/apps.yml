---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tc-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/ecbafc/truecharts
  prune: false
  wait: true
  postBuild:
    substitute:
      domain: "ecbafc.weirdrussiandomain.com"
