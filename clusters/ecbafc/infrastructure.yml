---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/ecbafc
  prune: true
  wait: true
  postBuild:
    substitute:
      domain: "ecbafc.weirdrussiandomain.com"
      infisical_envSlug: ecbafc
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  wait: true
  patches:
    - patch: |
        - op: replace
          path: /spec/addresses
          value:
            - 10.19.53.2-10.19.53.9
            - 10.19.53.11/32
      target:
        kind: IPAddressPool
        name: ip-pool
        namespace: metallb-system
    - patch: |
        - op: replace
          path: /spec/acme/server
          value: https://acme-v02.api.letsencrypt.org/directory
      target:
        kind: ClusterIssuer
        name: letsencrypt
    - patch: |
        - op: replace
          path: /metadata/annotations
          value:
            metallb.io/loadBalancerIPs: 10.19.53.8
      target:
        kind: Service
        name: receiver
  postBuild:
    substitute:
      domain: "ecbafc.weirdrussiandomain.com"
      infisical_envSlug: ecbafc
      cluster_name: ecbafc
