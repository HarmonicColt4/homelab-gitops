---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-configs
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production
  prune: false
  wait: true
  suspend: true
  postBuild:
    substitute:
      domain: "weirdrussiandomain.com"
      infisical_envSlug: prod
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-new
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-configs
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
  prune: true
  wait: true
  suspend: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
