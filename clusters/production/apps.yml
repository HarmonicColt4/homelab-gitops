apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system-temp
spec:
  # dependsOn:
  #   - name: infra-configs
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production
  prune: true
  wait: false
  postBuild:
    substitute:
      domain: "weirdrussiandomain.com"
      infisical_envSlug: prod
