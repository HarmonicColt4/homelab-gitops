---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  wait: true
  patches:
    - target:
        kind: HelmRelease
        name: traefik
        namespace: default
      patch: |-
        - op: add
          path: /spec/values/service/annotations
          value:  
            metallb.universe.tf/loadBalancerIPs: 10.13.25.21
        - op: replace
          path: /spec/values/ingressRoute/dashboard/matchRule
          value: Host(`traefik.weirdrussiandomain.com`) && PathPrefix(`/dashboard`)
    - target:
        kind: HelmRelease
        name: longhorn
        namespace: default
      patch: |-
        - op: add
          path: /spec/values/defaultSettings/backupTarget
          value:
            nfs://10.13.25.10:/mnt/storage/longhorn/production      
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  wait: true
  patches:
    - patch: |
        - op: replace
          path: /spec/addresses
          value:
            - 10.13.25.2/32
            - 10.13.25.3/32
            - 10.13.25.21/32
            - 10.13.25.25-10.13.25.29
      target:
        kind: IPAddressPool
        name: ip-pool
        namespace: metallb-system
    - patch: |
        - op: replace
          path: /spec/rules/0/host
          value:
            longhorn.weirdrussiandomain.com
        - op: replace
          path: /spec/tls/0/hosts
          value:
            - longhorn.weirdrussiandomain.com
      target:
        kind: Ingress
        name: longhorn-ingress
        namespace: longhorn-system
    - patch: |
        - op: replace
          path: /spec/acme/server
          value: https://acme-v02.api.letsencrypt.org/directory
      target:
        kind: ClusterIssuer
        name: letsencrypt