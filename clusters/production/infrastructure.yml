---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/production
  prune: false
  wait: true
  postBuild:
    substitute:
      domain: 'weirdrussiandomain.com'
      infisical_envSlug: prod
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-monitoring
  namespace: flux-system
spec:
  # dependsOn:
  #   - name: infra-controllers
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/monitoring
  prune: true
  wait: true
  postBuild:
    substitute:
      domain: 'weirdrussiandomain.com'
      infisical_envSlug: prod
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  # dependsOn:
  #   - name: infra-controllers
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  wait: true
  patches:
    - patch: |
        - op: replace
          path: /spec/addresses
          value:
            - 10.13.25.2/32
            - 10.13.25.3/32
            - 10.13.25.21/32
            - 10.13.25.26-10.13.25.90
      target:
        kind: IPAddressPool
        name: ip-pool
        namespace: metallb-system
    - patch: |
        - op: replace
          path: /spec/acme/server
          value: https://acme-v02.api.letsencrypt.org/directory
      target:
        kind: ClusterIssuer
        name: letsencrypt
  postBuild:
    substitute:
      domain: 'weirdrussiandomain.com'
      infisical_envSlug: prod
