---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tc-apps-v2
  namespace: flux-system
spec:
  dependsOn:
    - name: tc-setup
    - name: infra-configs
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/truecharts-v2
  prune: true
  # wait: true
  postBuild:
    substitute:
      domain: 'weirdrussiandomain.com'
