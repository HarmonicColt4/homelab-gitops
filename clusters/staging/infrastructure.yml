---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  wait: true
  patches:
    - target:
        kind: HelmRelease
        name: traefik
        namespace: default
      patch: |
        - op: add
          path: /spec/values/service/annotations
          value:  
            metallb.universe.tf/loadBalancerIPs: 10.13.13.11
    - target:
        kind: Secret
        name: discord-webhook
        namespace: default
      patch: |
        - op: replace
          path: /stringData
          value:  
            address: "https://discord.com/api/webhooks/1330790654380343296/4rV4xI-5VDoaOhl266nleVdxFGBc2acCVvUyhKfVlWrUSfUi4dhWqzEVGavE8siWY4NA"

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  wait: true
  patches:
    - patch: |
        - op: replace
          path: /spec/addresses
          value:
            - 10.13.13.2/32
            - 10.13.13.3/32
            - 10.13.13.11/32
      target:
        kind: IPAddressPool
        name: ip-pool
        namespace: metallb-system