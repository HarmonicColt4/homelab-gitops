---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/staging
  prune: true
  wait: true
  postBuild:
    substitute:
      domain: "staging.weirdrussiandomain.com"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  wait: true
  patches:
    - target:
        kind: IPAddressPool
        name: ip-pool
      patch: |
        - op: replace
          path: /spec/addresses
          value:
            - 10.13.13.2/32
            - 10.13.13.3/32
            - 10.13.13.11/32
    - target:
        kind: Secret
        name: discord-webhook
      patch: |
        - op: replace
          path: /stringData/address
          value: "https://discord.com/api/webhooks/1330790654380343296/4rV4xI-5VDoaOhl266nleVdxFGBc2acCVvUyhKfVlWrUSfUi4dhWqzEVGavE8siWY4NA"
    - patch: |-
        $patch: delete
        apiVersion: longhorn.io/v1beta1
        kind: RecurringJob
        metadata:
          name: backup
          namespace: longhorn-system
  postBuild:
    substitute:
      domain: "staging.weirdrussiandomain.com"