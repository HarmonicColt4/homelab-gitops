model:
  # Hosted default. The local llama.cpp preset (gemma4-12b-q6, provider: custom,
  # base_url http://llama-cpp.ai.svc.cluster.local:8080/v1) stays available by
  # overriding model.default/provider in the session, but is no longer the default.
  default: deepseek/deepseek-v4.1-flash-1017
  provider: openrouter
  # No context_length and no api_key here on purpose. Hermes reads the window from
  # the OpenRouter catalog for this model (currently 1048576) and the key from
  # OPENROUTER_API_KEY in /opt/data/.env on the PVC, so neither can drift from Git.

terminal:
  backend: local

dashboard:
  public_url: https://hermes.teamg.app
  trusted_proxies:
    - 10.244.0.0/16

database:
  journal_mode: wal

# Speech-to-text. The gateway relays audio to the in-cluster Whisper service
# (see docs/whisper.md). The api_key must be set explicitly: Hermes' credential
# ladder is config api_key > keyless placeholder for private/loopback base_urls
# > env key, and a private base_url with no api_key resolves to the literal
# placeholder "not-needed", which a keyed Speaches rejects with 401.
# ${WHISPER_API_KEY} is expanded from the process environment at config load.
stt:
  provider: openai
  language: "" # auto-detect: English, French, Russian
  prompt: "Hermes, Nous Research, Talos, Flux, kustomization, Traefik, Longhorn, kubectl, Gitea, Renovate, Kubernetes"
  openai:
    base_url: http://whisper.ai.svc.cluster.local:8000/v1
    model: Systran/faster-whisper-large-v3
    api_key: ${WHISPER_API_KEY}
    timeout: 120

voice:
  client_direct: false # the gateway relays, so mobile clients work too

# MCP servers that live on this cluster. URLs point at the in-cluster Service
# rather than the Traefik host: the gateway runs inside the cluster, so the
# extra DNS + TLS hop buys nothing and an IngressRoute change cannot take a
# toolset offline. Hosted SaaS servers (microsoft-learn) and the locally-run
# stdio server (gitea) intentionally stay in /opt/data/config.yaml on the PVC.
mcp_servers:
  kubernetes:
    # Read-only cluster access through the kubernetes-mcp ServiceAccount
    # (ClusterRole view). auth is the pod's ServiceAccount, so no header.
    url: http://kubernetes-mcp.ai.svc.cluster.local:8080/mcp
    enabled: true
  mealie:
    # ClusterIP only by design: the server holds a full-access Mealie token.
    url: http://mealie-mcp.ai.svc.cluster.local:8000/mcp
    enabled: true
  linkedin:
    url: http://linkedin-mcp.ai.svc.cluster.local:8080/mcp
    enabled: true
    headers:
      # FastMCP exits at startup without a client token. The value is sealed in
      # secrets/enc.env (SOPS) as LINKEDIN_MCP_TOKEN and reaches the gateway as an env var
      # from the hermes-agent-secret Secret; the managed overlay expands
      # ${LINKEDIN_MCP_TOKEN} from the process env, so no secret is stored in Git.
      Authorization: Bearer ${LINKEDIN_MCP_TOKEN}
