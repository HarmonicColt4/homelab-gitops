terminal:
  backend: local

dashboard:
  public_url: https://hermes.teamg.app
  trusted_proxies:
    - 10.244.0.0/16

database:
  journal_mode: wal

stt:
  provider: openai
  language: ""
  prompt: "Hermes, Nous Research, Talos, Flux, kustomization, Traefik, Longhorn, kubectl, Gitea, Renovate, Kubernetes"
  openai:
    base_url: http://whisper.ai.svc.cluster.local:8000/v1
    model: Systran/faster-whisper-large-v3
    api_key: ${WHISPER_API_KEY}
    timeout: 120

voice:
  client_direct: false

mcp_servers:
  gitea:
    url: http://gitea-mcp.ai.svc.cluster.local:8080/mcp
    enabled: true
  kubernetes:
    url: http://kubernetes-mcp.ai.svc.cluster.local:8080/mcp
    enabled: true
  mealie:
    url: http://mealie-mcp.ai.svc.cluster.local:8000/mcp
    enabled: true
  linkedin:
    url: http://linkedin-mcp.ai.svc.cluster.local:8080/mcp
    enabled: true
    headers:
      Authorization: Bearer ${LINKEDIN_MCP_TOKEN}
  actual:
    url: http://actual-mcp.ai.svc.cluster.local:3600/http
    enabled: true
    headers:
      Authorization: Bearer ${ACTUAL_MCP_TOKEN}
  wger:
    url: http://wger-mcp.ai.svc.cluster.local:8765/mcp
    enabled: true
    headers:
      Authorization: Bearer ${WGER_MCP_TOKEN}
  paperless:
    url: http://paperless-mcp.ai.svc.cluster.local:3001/mcp
    enabled: true
    headers:
      Authorization: Bearer ${PAPERLESS_MCP_TOKEN}
  tandoor:
    url: http://tandoor-mcp.ai.svc.cluster.local:3737/mcp
    enabled: true
    headers:
      Authorization: Bearer ${TANDOOR_MCP_TOKEN}
