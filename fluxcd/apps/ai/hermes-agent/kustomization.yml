apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai

resources:
  - pvc.yml
  - deploy.yml
  - svc.yml
  - ingress-route.yml

# The managed config. The key must be literally "config.yaml": Hermes looks
# for that filename under HERMES_MANAGED_DIR. The source file keeps the repo's
# .yml extension rule and is remapped on the way in.
configMapGenerator:
  - name: hermes-agent-config
    files:
      - config.yaml=config.yml

# Secrets: the API bearer key, the OIDC client ID, the Whisper ASR key and one
# client token per MCP server that authenticates its callers. Pocket-ID issues a
# public PKCE client, so there is no client secret to store.
# The model endpoint, public URL, trusted proxies and every MCP URL are in Git.
#
# One file, not one per token: two sops env files cannot share a generator,
# because both carry the same sops_* metadata keys and kustomize fails the
# render with "illegally repeats the key sops_age__list_0__map_enc". The age
# key lives in the flux-system/sops-age Secret, so `sops -e -i` on this file
# works from anywhere that can read it.
secretGenerator:
  - name: hermes-agent-secret
    envs:
      - secrets/enc.env
