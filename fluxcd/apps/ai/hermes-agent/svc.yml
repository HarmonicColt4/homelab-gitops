---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
spec:
  type: ClusterIP
  selector:
    app: hermes-agent
  ports:
    # The gateway HTTP API, used by in-cluster clients.
    - name: api
      port: 8642
      targetPort: api
      protocol: TCP
    # The web dashboard, published through Traefik.
    - name: dashboard
      port: 9119
      targetPort: dashboard
      protocol: TCP
