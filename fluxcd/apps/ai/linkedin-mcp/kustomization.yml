apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai

resources:
  - pvc.yml
  - deploy.yml
  - svc.yml
  - ingress-route.yml

# No secretGenerator: the LinkedIn session is not a Git value. It is created
# once by bootstrap/login-job.yml and lives on the PVC. bootstrap/ is
# deliberately not listed here, so Flux never applies it.
