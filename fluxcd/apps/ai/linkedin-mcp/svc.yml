---
# Cluster-internal. The MCP endpoint has no authentication of its own, so the
# only ways in are the Traefik route (see ingress-route.yml) or another pod:
#   http://linkedin-mcp.ai.svc.cluster.local:8080/mcp
apiVersion: v1
kind: Service
metadata:
  name: linkedin-mcp
spec:
  type: ClusterIP
  selector:
    app: linkedin-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
