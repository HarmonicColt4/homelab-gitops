---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama.cpp
  labels:
    app: llama.cpp
spec:
  replicas: 1
  # Single GPU + ReadWriteOnce PVC: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama.cpp
  template:
    metadata:
      labels:
        app: llama.cpp
    spec:
      # Pin to the node that owns the RTX 4080 (16 GiB).
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4080
      terminationGracePeriodSeconds: 30
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:07735071942842eb24ccc4b09db2721a2d124cdf3c591878a62c7561edd38bbe
          args:
            # Let llama-server pull the GGUF straight from Hugging Face into
            # LLAMA_CACHE on the PVC. Pin the exact file: IQ3_S is one of
            # several tiers (IQ2_XS, IQ2_S, IQ3_XXS, IQ3_S) plus optional
            # -mtp variants, so name the full filename to avoid ambiguity.
            - -hf
            - ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF
            - --hf-file
            - Swift-1.5-Qwen3.8-27B-GSQ-RCO-IQ3_S.gguf
            - --alias
            - swift
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --jinja
            # Flash attention is required for quantized V cache.
            - --flash-attn
            - "on"
            # Offload every layer to the GPU.
            - --n-gpu-layers
            - "99"
            # 96K context. Only the 16 full-attention layers grow a KV cache
            # (4 KV heads x 256 head_dim), so Q8_0 KV costs ~34 KiB/token.
            # 98304 tokens ~= 3.2 GiB, which fits the ~4 GiB left after the
            # 11.77 GB IQ3_S weights + compute buffers on the 16 GiB card.
            # - --ctx-size
            # - "98304"
            # Q8_0 KV cache is the near-lossless option (min accuracy loss).
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q4_0
            - --batch-size
            - "1024"
            - --ubatch-size
            - "256"
            # Sampling defaults recommended by the model card.
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "0.0"
            - --repeat-penalty
            - "1.0"
          env:
            # llama.cpp caches GGUFs pulled via -hf under this directory;
            # point it at the PVC so the model persists across pod restarts.
            - name: LLAMA_CACHE
              value: /models
            # Token for authenticated/rate-limited Hugging Face downloads.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llama-cpp-hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 12Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
          # First start downloads ~11.8 GB via -hf then loads it; allow 20 min.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
