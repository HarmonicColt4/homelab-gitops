---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama.cpp
  labels:
    app: llama.cpp
spec:
  replicas: 1
  # Single GPU + ReadWriteOnce PVC: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama.cpp
  template:
    metadata:
      labels:
        app: llama.cpp
    spec:
      # Pin to the node that owns the RTX 4080 (16 GiB).
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4080
      terminationGracePeriodSeconds: 30
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:83faadeff67447144770f9b91b4c6694ce2ea2a218efa82f77092ebc29b0c31f
          args:
            # Qwen3.8-27B, ByteShape ShapeLearn GPU-4 (labelled IQ3_S, 3.23 bpw,
            # 11.0 GB). Hybrid attention: 48 Gated DeltaNet + 16 full-attention
            # layers, so only 16 layers carry a KV cache (64 KiB/token at f16).
            # GPU-4 over GPU-5: ~1.9 GiB more room for context, ~15% faster on
            # a 4080, at 98.72% vs 99.63% of the BF16 baseline.
            - -hf
            - byteshape/Qwen3.8-27B-GGUF:Qwen3.8-27B-IQ3_S-3.23bpw
            - --alias
            - qwen3.8-27b
            # Vision-capable model: -hf pulls the mmproj by default. Text-only
            # here, so skip it and keep ~0.5-1 GB of VRAM for the KV cache.
            - --no-mmproj
            # No speculative decoding: the embedded MTP head is left unloaded,
            # which keeps its ~250 MB out of VRAM for the KV cache.
            # --host/--port are omitted: the image bakes in LLAMA_ARG_HOST=0.0.0.0
            # and LLAMA_ARG_PORT=8080.
            - --jinja
            # Required for a quantized V cache.
            - --flash-attn
            - "on"
            # q8_0 KV roughly halves the cache cost vs f16 for negligible loss.
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            # No --ctx-size on purpose: --fit (on by default) sizes the context
            # to whatever fits in the remaining VRAM. --fit-target is the margin
            # left free per device; 100 MiB squeezes out the largest context.
            - --fit-target
            - "100"
            # One slot, so a single conversation owns the whole KV pool instead
            # of sharing it with three idle siblings.
            - --parallel
            - "1"
            # Offload every layer and let --fit shrink context instead.
            - --n-gpu-layers
            - "99"
            - --batch-size
            - "1024"
            - --ubatch-size
            - "256"
            # Sampling defaults (Qwen3.8 thinking mode).
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "0.0"
            - --repeat-penalty
            - "1.0"
          env:
            # llama.cpp caches GGUFs pulled via -hf under this directory;
            # point it at the PVC so the model persists across pod restarts.
            - name: LLAMA_CACHE
              value: /models
            # Token for authenticated/rate-limited Hugging Face downloads.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llama-cpp-hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 12Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
          # First start downloads ~11.0 GB (single GGUF, MTP head included) then
          # loads it; allow 40 min.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
