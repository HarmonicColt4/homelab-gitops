---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama.cpp
  labels:
    app: llama.cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama.cpp
  template:
    metadata:
      labels:
        app: llama.cpp
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: llama-server
          image: ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.4.9@sha256:f33775ab75d2906a94e819802be54c1c30474fa4fc14dfc2e595f294b3af4470
          args:
            - --models-preset
            - /config/models-preset.ini
            - --models-max
            - "1"
            - --port
            - "8080"
          env:
            - name: LLAMA_CACHE
              value: /models
            # KVarN flash-attn stages KV in a scratch buffer sized
            # chunk * n_kv_heads * 512 * 2 bytes. The 65536 default needs
            # ~256 MiB and OOMs during long prefill; 16384 needs ~64 MiB.
            - name: GGML_KVARN_WINDOW_CHUNK
              value: "16384"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llama-cpp-hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The limit must exceed model size + working set, otherwise the
          # cgroup reclaims the mmap'd GGUF pages and every model switch
          # re-reads 11-13 GB from the PVC (~60 s at 200 MB/s).
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: config
              mountPath: /config
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            # Local NVMe on beast (~1.6 GB/s) instead of the Longhorn
            # volume (~277 MB/s). See pv-nvme.yml.
            claimName: llama-cpp-models-nvme
        - name: config
          configMap:
            name: llama-cpp-models-preset
