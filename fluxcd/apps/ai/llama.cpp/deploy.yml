---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama.cpp
  labels:
    app: llama.cpp
spec:
  replicas: 1
  # Single GPU + ReadWriteOnce PVC: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama.cpp
  template:
    metadata:
      labels:
        app: llama.cpp
    spec:
      # Pin to the node that owns the RTX 4080 (16 GiB).
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4080
      terminationGracePeriodSeconds: 30
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:07735071942842eb24ccc4b09db2721a2d124cdf3c591878a62c7561edd38bbe
          args:
            # Text-only model; no multimodal projector.
            - -hf
            - nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB
            - --hf-file
            - Nemotron-3.5-Bolt-E4B-Q4_K_M.gguf
            - --alias
            - nemotron-bolt
            # DFlash drafter from its own HF repo. --spec-draft-model pins the
            # filename when used together with --spec-draft-hf.
            - --spec-draft-hf
            - nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB-DFlash
            - --spec-draft-model
            - Nemotron-3.5-Bolt-E4B-DFlash-BF16.gguf
            - --spec-type
            - draft-dflash
            - --spec-draft-n-max
            - "7"
            - --spec-draft-ngl
            - "99"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --jinja
            # Flash attention is recommended for DFlash speculative decoding.
            - --flash-attn
            - "on"
            # Offload every layer to the GPU.
            - --n-gpu-layers
            - "99"
            - --batch-size
            - "1024"
            - --ubatch-size
            - "256"
            # Sampling defaults.
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "0.0"
            - --repeat-penalty
            - "1.0"
          env:
            # llama.cpp caches GGUFs pulled via -hf under this directory;
            # point it at the PVC so the model persists across pod restarts.
            - name: LLAMA_CACHE
              value: /models
            # Token for authenticated/rate-limited Hugging Face downloads.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llama-cpp-hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 12Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
          # First start downloads ~6.9 GB (6.2 GB model + 0.7 GB drafter) then
          # loads it; allow 20 min.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
