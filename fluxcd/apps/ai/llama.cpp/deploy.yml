---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama.cpp
  labels:
    app: llama.cpp
spec:
  replicas: 1
  # Single GPU + ReadWriteOnce PVC: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama.cpp
  template:
    metadata:
      labels:
        app: llama.cpp
    spec:
      # Pin to the node that owns the RTX 4080 (16 GiB).
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4080
      terminationGracePeriodSeconds: 30
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:07735071942842eb24ccc4b09db2721a2d124cdf3c591878a62c7561edd38bbe
          args:
            # Let llama-server pull the GGUF straight from Hugging Face.
            # Pin the exact file: the `:Q2_0` quant suffix substring-matches
            # the fork-only `PQ2_0` packing, which stock llama.cpp rejects
            # (invalid ggml type 142). Q2_0 is the packing that runs on
            # mainline llama.cpp; PTQ1_0/PQ2_0 need the PrismML fork kernels.
            - -hf
            - prism-ml/Ternary-Bonsai-2-27B-gguf
            - --hf-file
            - Ternary-Bonsai-2-27B-Q2_0.gguf
            - --alias
            - bonsai
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --jinja
            # Flash attention is required for the quantized V cache.
            - --flash-attn
            - "on"
            # Offload every layer to the GPU.
            - --n-gpu-layers
            - "99"
            # - --cache-type-k
            # - q8_0
            # - --cache-type-v
            # - q4_0
            - --batch-size
            - "1024"
            - --ubatch-size
            - "256"
            - --parallel
            - "1"
            # Sampling defaults recommended by the model card for thinking mode.
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.05"
            - --presence-penalty
            - "0.0"
            - --repeat-penalty
            - "1.0"
          env:
            # llama.cpp caches downloaded GGUFs under this directory; point it
            # at the PVC so the model persists across pod restarts.
            - name: LLAMA_CACHE
              value: /models
            # Token for authenticated/rate-limited Hugging Face downloads.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llama-cpp-hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 12Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
          # First start downloads the model and loads it; allow up to 10 minutes.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
