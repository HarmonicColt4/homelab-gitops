---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama.cpp
  labels:
    app: llama.cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama.cpp
  template:
    metadata:
      labels:
        app: llama.cpp
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: llama-server
          image: ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.4.9@sha256:f33775ab75d2906a94e819802be54c1c30474fa4fc14dfc2e595f294b3af4470
          args:
            - -hf
            - byteshape/Qwen3.8-27B-GGUF
            - -hff
            - Qwen3.8-27B-IQ3_S-3.23bpw.gguf
            - --alias
            - qwen3.8-27b
            - --ctx-size
            - "212992"
            - --jinja
            - --flash-attn
            - "on"
            - --cache-type-k
            - kvarn5
            - --cache-type-v
            - kvarn4
            - --parallel
            - "1"
            - --n-gpu-layers
            - "99"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "512"
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "0.0"
            - --repeat-penalty
            - "1.0"
            - --port
            - "8080"
          env:
            - name: LLAMA_CACHE
              value: /models
            # KVarN flash-attn stages KV in a scratch buffer sized
            # chunk * n_kv_heads * 512 * 2 bytes. The 65536 default needs
            # ~256 MiB and OOMs during long prefill; 16384 needs ~64 MiB.
            - name: GGML_KVARN_WINDOW_CHUNK
              value: "16384"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llama-cpp-hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
