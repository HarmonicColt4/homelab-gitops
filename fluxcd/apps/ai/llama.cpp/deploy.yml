---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama.cpp
  labels:
    app: llama.cpp
spec:
  replicas: 1
  # Single GPU + ReadWriteOnce PVC: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama.cpp
  template:
    metadata:
      labels:
        app: llama.cpp
    spec:
      # Pin to the node that owns the RTX 4080 (16 GiB).
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4080
      terminationGracePeriodSeconds: 30
      containers:
        - name: llama-server
          # PrismML-fork llama.cpp with the Bonsai 2 PTQ1_0 + MTP kernels.
          # The entrypoint downloads the GGUF, installs the calibrated KV bias,
          # then execs llama-server. Configure ONLY via LLAMA_ARG_* env vars:
          # there is no args block, because the wrapper forwards "$@" to
          # llama-server and CLI flags would fight its model handling.
          image: ghcr.io/snailium/bonsai2-8gb/llama-bonsai2:stable
          env:
            # Listen on 8080 to match the Service and probes below.
            - name: LLAMA_ARG_PORT
              value: "8080"
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            # 16 GiB card: raise context above the image's 8 GiB default (40960).
            - name: LLAMA_ARG_CTX_SIZE
              value: "131072"
            # --kv-mean-center requires a q4_0 K cache; do not change K.
            - name: LLAMA_ARG_CACHE_TYPE_K
              value: "q4_0"
            - name: LLAMA_ARG_CACHE_TYPE_V
              value: "q4_0"
            - name: LLAMA_ARG_FLASH_ATTN
              value: "on"
            - name: LLAMA_ARG_N_GPU_LAYERS
              value: "99"
            - name: LLAMA_ARG_JINJA
              value: "1"
            - name: LLAMA_ARG_ALIAS
              value: "bonsai"
            - name: LLAMA_ARG_BATCH
              value: "1024"
            - name: LLAMA_ARG_UBATCH
              value: "256"
            - name: LLAMA_ARG_N_PARALLEL
              value: "1"
            # Sampling defaults recommended by the model card (thinking mode).
            - name: LLAMA_ARG_TEMPERATURE
              value: "1.0"
            - name: LLAMA_ARG_TOP_P
              value: "0.95"
            - name: LLAMA_ARG_TOP_K
              value: "20"
            - name: LLAMA_ARG_MIN_P
              value: "0.05"
            - name: LLAMA_ARG_PRESENCE_PENALTY
              value: "0.0"
            - name: LLAMA_ARG_REPEAT_PENALTY
              value: "1.0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 12Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
          # First start downloads ~5.85 GiB into the PVC, then loads it.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
