apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai

resources:
  - pvc.yml
  - deploy.yml
  - svc.yml
  - ingress-route.yml

secretGenerator:
  - name: llama-cpp-hf-token
    envs:
      - secrets/enc.env

configMapGenerator:
  - name: llama-cpp-models-preset
    files:
      - models-preset.ini
