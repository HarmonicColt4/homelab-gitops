apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai

resources:
  - pv-nvme.yml
  - pvc-nvme.yml
  - deploy.yml
  - svc.yml
  - ingress-route.yml

configMapGenerator:
  - name: llama-cpp-models-preset
    files:
      - models-preset.ini=models-preset.ini

secretGenerator:
  - name: llama-cpp-hf-token
    envs:
      - secrets/enc.env
