version = 1

[*]
jinja            = 1
flash-attn       = on
parallel         = 1
n-gpu-layers     = 99
batch-size       = 4096
ubatch-size      = 1024

; Gemma 4 12B Q4_K_M + MTP speculative decoding.
;
; Q6_K was the largest quant that reached the model's full native context
; (262144) when llama.cpp had the RTX 4080 to itself: it loaded at 13903 MiB
; and peaked at 15713 MiB on a 259255-token prompt, leaving 663 MiB free.
; That leaves no room for a co-tenant, so the preset is downshifted to Q4_K_M
; at ctx 131072 to make room for Whisper large-v3 (int8_float16, ~2.9 GB) and
; the bge-m3 embedding model on the same card. Time-slicing gives both pods the
; whole 16 GB; it does not partition memory, so this budget is the only thing
; keeping them apart.
;
; VRAM arithmetic (16376 MiB total; weights are the GGUF file sizes):
;   Q6_K weights 9333 MiB -> Q4_K_M weights 6792 MiB      -2541 MiB
;   KV cache 262144 -> 131072 at ~0.00685 MiB/token       -897 MiB
;   non-KV overhead (drafter 444 MiB, vision, compute)    ~2775 MiB
;   expected load                                         ~10465 MiB
;   expected peak (load + 1810 MiB prefill working set)   ~12275 MiB
;   free after llama.cpp                                  ~4101 MiB
;   Whisper large-v3 int8_float16                         ~2970 MiB
;   remaining margin before bge-m3                        ~1131 MiB
;
; TODO: replace the expected load/peak above with re-measured nvidia-smi
; figures once the Whisper co-tenant is deployed. The KV-per-token figure is
; derived from the Q6_K@262144 and Q8_0@98304 measurements, not measured
; directly at 131072.
;
; ctx-size 131072 is a deliberate reduction from the model's 262144 native
; ceiling. Requesting more than 262144 logs "n_ctx_seq (N) > n_ctx_train
; (262144)" and the server clamps; no RoPE scaling is applied.
;
; ubatch-size 2048 is required for the full 1120-token vision budget. At
; ubatch 512 llama.cpp caps image_max_tokens to n_ubatch, so a 2.56 MP image
; yields 486 image tokens instead of 1091 (1056x1056 instead of 1584x1584).
;
; batch-size 4096, not 8192: at 8192 the batch propagates into the draft
; context (draft context: n_batch=8192) and grows generation-phase buffers.
;
; No kv-tail-tokens: Gemma's 1024-token SWA window means any tail >= 1024
; promotes the whole SWA group to exact storage, costing ~22% prefill
; throughput for no measurable KLD gain over a wider body. KVarN keeps its
; intrinsic 128-token exact suffix.
; No cache-type-*-swa: both groups run kvarn8, so the override is a no-op.
;
; Drafter is Q8_0 (444 MiB) and is not a quantized copy of the target -- it is
; a separate 4-layer query-only transformer that shares the target's KV cache
; and allocates none of its own. Measured 75.0% draft acceptance against the
; Q6_K target, same as against Q8_0.
;
; n-gpu-layers=99 disables llama.cpp's auto-fit, so there is no safety net.
; The section name is the model id clients must send; it is not the Q6_K name
; from older configs. The weights are Q4_K_M.
[gemma4-12b-mtp]
hf               = unsloth/gemma-4-12b-it-GGUF
hff              = gemma-4-12b-it-Q4_K_M.gguf
spec-draft-model = /models/gguf/gemma/mtp-gemma-4-12b-it-Q8_0.gguf
ctx-size         = 131072
cache-type-k     = kvarn8
cache-type-v     = kvarn8
batch-size       = 4096
ubatch-size      = 2048
spec-type        = draft-mtp
spec-draft-n-max = 2
spec-draft-ngl   = 99
temp             = 1.0
top-p            = 0.95
top-k            = 64
load-on-startup = 1

; bge-m3 embedding model, loaded alongside Gemma by the router
; (--models-max 2). Paperless-ngx uses it for its LLM index, similar-document
; retrieval and document chat.
;
; Q8_0 is deliberate. Q5_K_M would save only ~166 MiB and this workload does
; not hit Gemma's worst-case prefill peak; Q8_0 keeps a mean cosine of ~0.9995
; against F16, versus ~0.992 for Q5_K_M.
;
; Full GPU offload costs ~605 MiB of weights plus the process' ~328 MiB CUDA
; context, measured from a CPU-only bge-m3 test instance. That leaves ~200 MiB
; on the conservative budget and ~0.6 GiB with the measured Whisper footprint;
; the worst case can approach zero once driver and compute overheads are
; counted. Do not add a third model and check nvidia-smi after rollout.
;
; pooling=cls matches bge-m3's dense CLS output; the llama.cpp default (none)
; makes /v1/embeddings return one vector per token and breaks OpenAI clients.
; ubatch-size 2048 accepts Paperless' 1024-token chunks plus special tokens;
; the [*] ubatch of 1024 would reject them. flash-attn stays off because this
; is an encoder, not a chat model.
[bge-m3]
hf               = smarttasks/bge-m3-GGUF
hff              = bge-m3-Q8_0.gguf
embeddings       = true
pooling          = cls
ctx-size         = 8192
batch-size       = 2048
ubatch-size      = 2048
flash-attn       = off
n-gpu-layers     = 99
load-on-startup  = 1
