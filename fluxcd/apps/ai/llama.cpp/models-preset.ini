version = 1

[*]
jinja            = 1
flash-attn       = on
parallel         = 1
n-gpu-layers     = 99
batch-size       = 4096
ubatch-size      = 1024

[qwen3.5-9b]
hf              = bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF
hff             = MiMo-V2.6-Distill-Qwen-9B-Q8_0.gguf
alias           = qwen3.5-9b
ctx-size        = 262144
cache-type-k    = kvarn8
cache-type-v    = kvarn8
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
presence-penalty = 0.0
repeat-penalty   = 1.0
kv-tail-tokens   = 1024

; Gemma 4 12B Q6_K + MTP speculative decoding.
;
; Q6_K is the largest quant that reaches the model's full native context.
; Measured on the RTX 4080 (16376 MiB): Q6_K at ctx 262144 loads at 13903 MiB
; and peaks at 15713 MiB on a 259255-token prompt (663 MiB free). Q8_0 cannot
; reach 262144 at all -- it loads at 15531 MiB at ctx 98304 and OOMs at
; 114688. UD-Q6_K_XL is 857 MiB heavier and would peak past the card.
;
; ctx-size 262144 is a hard cap, not a VRAM limit: requesting 327680 logs
; "n_ctx_seq (327680) > n_ctx_train (262144)" and the server clamps. No RoPE
; scaling is applied, so this is the model's true ceiling.
;
; ubatch-size 2048 is required for the full 1120-token vision budget. At
; ubatch 512 llama.cpp caps image_max_tokens to n_ubatch, so a 2.56 MP image
; yields 486 image tokens instead of 1091 (1056x1056 instead of 1584x1584).
;
; batch-size 4096, not 8192: at 8192 the batch propagates into the draft
; context (draft context: n_batch=8192) and grows generation-phase buffers.
; Both fit at Q6_K/262144, but 4096 keeps the larger margin.
;
; No kv-tail-tokens: Gemma's 1024-token SWA window means any tail >= 1024
; promotes the whole SWA group to exact storage, costing ~22% prefill
; throughput for no measurable KLD gain over a wider body. KVarN keeps its
; intrinsic 128-token exact suffix.
; No cache-type-*-swa: both groups run kvarn8, so the override is a no-op.
;
; Drafter is Q8_0 (444 MiB) and is not a quantized copy of the target -- it is
; a separate 4-layer query-only transformer that shares the target's KV cache
; and allocates none of its own. Measured 75.0% draft acceptance against the
; Q6_K target, same as against Q8_0. BF16 would add 378 MiB and leave only
; ~285 MiB of headroom, inside the band where this deployment has OOM'd.
;
; n-gpu-layers=99 disables llama.cpp's auto-fit, so there is no safety net.
; Not autoloaded: --models-max is 1 and qwen3.5-9b holds the startup slot.
[gemma4-12b-q6-mtp]
hf               = unsloth/gemma-4-12b-it-GGUF
hff              = gemma-4-12b-it-Q6_K.gguf
spec-draft-model = /models/gguf/gemma/mtp-gemma-4-12b-it-Q8_0.gguf
alias            = gemma4-12b-q6
ctx-size         = 262144
cache-type-k     = kvarn8
cache-type-v     = kvarn8
batch-size       = 4096
ubatch-size      = 2048
spec-type        = draft-mtp
spec-draft-n-max = 2
spec-draft-ngl   = 99
temp             = 1.0
top-p            = 0.95
top-k            = 64
load-on-startup = 1
