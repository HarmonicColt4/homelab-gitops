version = 1

[*]
jinja            = 1
flash-attn       = on
parallel         = 1
n-gpu-layers     = 99
batch-size       = 4096
ubatch-size      = 1024

[qwen3.5-9b]
hf              = bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF
hff             = MiMo-V2.6-Distill-Qwen-9B-Q8_0.gguf
alias           = qwen3.5-9b
ctx-size        = 262144
cache-type-k    = kvarn8
cache-type-v    = kvarn8
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
presence-penalty = 0.0
repeat-penalty   = 1.0
load-on-startup = 1
kv-tail-tokens   = 1024

; Gemma 4 12B Q8_0 + MTP speculative decoding.
; No kv-tail-tokens: Gemma's 1024-token SWA window means any tail >= 1024
; promotes the whole SWA group to exact storage, costing ~22% prefill
; throughput for no measurable KLD gain over a wider body. KVarN keeps its
; intrinsic 128-token exact suffix.
; No cache-type-*-swa: both groups run kvarn8, so the override is a no-op.
; Drafter is pre-staged on the models PVC (443 MiB, sha256 145db909...).
; Not autoloaded: --models-max is 1 and qwen3.5-9b holds the startup slot.
;
; Sizing is measured, not estimated. At ctx-size 196608 this config loaded at
; 15915/16376 MiB (461 MiB free) and the child was OOM-killed during a ~10k
; token prefill (exit status 1, GPU dropped to 24 MiB). Note that
; n-gpu-layers=99 disables llama.cpp's auto-fit, so there is no safety net.
; 131072 frees ~272 MiB of global-layer KV; ubatch 512 halves the prefill
; transient that actually caused the crash. Cost: image_max_tokens caps at
; 512 instead of 1024, so vision inputs get a smaller token budget.
[gemma4-12b-q8-mtp]
hf               = unsloth/gemma-4-12b-it-GGUF
hff              = gemma-4-12b-it-Q8_0.gguf
spec-draft-model = /models/gguf/gemma/mtp-gemma-4-12b-it-Q8_0.gguf
alias            = gemma4-12b-q8
ctx-size         = 131072
cache-type-k     = kvarn8
cache-type-v     = kvarn8
ubatch-size      = 512
spec-type        = draft-mtp
spec-draft-n-max = 2
spec-draft-ngl   = 99
temp             = 1.0
top-p            = 0.95
top-k            = 64
