# llama.cpp router server model presets
# Served by: llama-server --models-preset /config/models-preset.ini --models-max 1
# Section name = model id used in the "model" field of OpenAI-compatible requests.
# Keys are llama-server CLI flags without leading dashes; values in [*] are
# inherited by every model unless overridden in its own section.
#
# Section names use the exact cache-discovered model IDs (as reported by
# GET /models, derived from the on-disk filenames), so each entry dedupes
# against the auto-discovered cache models and the Web UI lists one entry
# per model, addressable via the alias. If a new file lands in one of the
# cached repos, add a section for its ID here to keep the list curated.
version = 1

[*]
jinja            = 1
flash-attn       = on
fit              = off
cache-type-k     = kvarn5
cache-type-v     = kvarn4
parallel         = 1
n-gpu-layers     = 99
batch-size       = 4096
ubatch-size      = 512

[byteshape/Qwen3.8-27B-GGUF:23BPW]
hf              = byteshape/Qwen3.8-27B-GGUF:IQ3_S
alias           = qwen3.8-27b
load-on-startup = 1
no-mmproj        = 1
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
presence-penalty = 0.0
repeat-penalty   = 1.0

[ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S]
hf              = ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
alias           = swift-1.5
no-mmproj        = 1
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
presence-penalty = 0.0
repeat-penalty   = 1.0

[webAI-Official/Air-26B-A4B-gguf:A4B]
hf              = webAI-Official/Air-26B-A4B-gguf
alias           = air-26b
