# llama.cpp router server model presets
# Served by: llama-server --models-preset /config/models-preset.ini --models-max 1
# Section name = model id used in the "model" field of OpenAI-compatible requests.
# Keys are llama-server CLI flags without leading dashes; values in [*] are
# inherited by every model unless overridden in its own section.
version = 1

[*]
jinja            = 1
flash-attn       = on
cache-type-k     = kvarn5
cache-type-v     = kvarn4
parallel         = 1
n-gpu-layers     = 99
batch-size       = 8192
ubatch-size      = 1024

[qwen3.8-27b]
hf              = byteshape/Qwen3.8-27B-GGUF
hff             = Qwen3.8-27B-IQ3_S-3.23bpw.gguf
alias           = qwen3.8-27b
ctx-size        = 212992
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
presence-penalty = 0.0
repeat-penalty   = 1.0

[air]
hf              = webAI-Official/Air-26B-A4B-gguf
hff             = Air-26B-A4B.gguf
alias           = air-26b
ctx-size        = 131072
temp             = 1.0
top-p            = 0.95
top-k            = 64

[gemma-12b]
hf              = google/gemma-4-12B-it-qat-q4_0-gguf
hff             = gemma-4-12b-it-qat-q4_0.gguf
alias           = gemma-12b
ctx-size        = 262144
temp             = 1.0
top-p            = 0.95
top-k            = 64
load-on-startup = 1