apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai

# Cluster-internal only: the server holds the Actual server password, which can
# read and change every budget on it, so there is deliberately no IngressRoute.
# Consumers inside the cluster use:
#   http://actual-mcp.ai.svc.cluster.local:3600/http
resources:
  - deploy.yml
  - svc.yml
  - pvc.yml

# Bearer token every client must send (the server refuses to bind a
# non-loopback address without one), plus the Actual credentials.
secretGenerator:
  - name: actual-mcp-secret
    envs:
      - secrets/enc.env
