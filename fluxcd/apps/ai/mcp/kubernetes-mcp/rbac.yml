---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
---
# Full cluster-admin access, granted explicitly so the MCP can exec into pods,
# delete resources, read Secrets and node logs. The server is reachable only on
# the private LoadBalancer range (k8s-mcp.teamg.app resolves to 10.25.25.11),
# but any host on that network can drive the API with these credentials.
# Restrict the IngressRoute or add authentication before exposing it beyond the
# LAN.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: ai
