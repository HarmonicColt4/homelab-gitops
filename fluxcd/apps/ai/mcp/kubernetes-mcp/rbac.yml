---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
---
# Read-only cluster access. The built-in `view` ClusterRole covers pods, pod
# logs, events, and most resources, but excludes Secrets and pods/exec, so the
# server cannot read credentials or open shells even though its default
# toolset registers write tools. RBAC, not the toolset list, is the boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: ai
