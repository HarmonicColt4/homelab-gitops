apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai

# Cluster-internal only, to be wired to hermes-agent. The wger backend is
# the free hosted instance (wger.de); MCP_AUTH=static_token makes the SOPS
# secrets in secrets/enc.env the only credentials involved.
resources:
  - deploy.yml
  - svc.yml

secretGenerator:
  - name: wger-mcp-config
    envs:
      - secrets/enc.env
