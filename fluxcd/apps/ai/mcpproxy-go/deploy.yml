---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpproxy-go
  labels:
    app: mcpproxy-go
spec:
  replicas: 1
  # ReadWriteOnce data volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mcpproxy-go
  template:
    metadata:
      labels:
        app: mcpproxy-go
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # MCPProxy refuses to start unless its data directory is owned by
        # its own UID. A Longhorn RWO volume mounts root-owned, and fsGroup
        # only changes the group, so hand /data to 65532 before the app starts.
        - name: fix-data-permissions
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - chown -R 65532:65532 /data && chmod 0700 /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        # Server edition image: headless proxy with the web UI embedded.
        # The image entrypoint is already
        # `mcpproxy serve --listen 0.0.0.0:8080`; args below are appended.
        - name: mcpproxy
          image: ghcr.io/smart-mcp-proxy/mcpproxy-server:v0.73.0
          args:
            # State (mcp_config.json, config.db, Bleve index, certs, logs)
            # lives on the PVC.
            - --data-dir=/data
            # Headless install: no tray client exists, and socket
            # connections bypass API-key auth.
            - --enable-socket=false
            # Protect /mcp as well as /api/v1. Clients must send
            # `Authorization: Bearer <key>` or `X-API-Key: <key>`.
            - --require-mcp-auth=true
          env:
            - name: MCPPROXY_DATA_DIR
              value: /data
            # mcpproxy resolves ~/.mcpproxy from $HOME; in distroless
            # HOME is unset, so point it at the writable PVC.
            - name: HOME
              value: /data
            - name: MCPPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcpproxy-api-key
                  key: MCPPROXY_API_KEY
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcpproxy-go-data
