---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: flux-system
spec:
  timeout: 10m
  targetNamespace: ai
  releaseName: open-webui
  interval: 1h
  driftDetection:
    mode: enabled
  upgrade:
    # Object storage/download of the image on first rollout can be slow.
    timeout: 15m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: open-webui
      version: 18.1.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
      interval: 1h
  values:
    # Predictable resource names: the IngressRoute targets Service
    # "open-webui" and the chart renders the PVC with the same fullname.
    fullnameOverride: open-webui

    # Single replica path: SQLite + local vector store on one RWO volume.
    replicaCount: 1
    workload:
      kind: Deployment
    # The data volume is ReadWriteOnce; a rolling update would deadlock on
    # a multi-attach, so the old pod must stop before the new one starts.
    strategy:
      type: Recreate

    image:
      repository: ghcr.io/open-webui/open-webui
      # tag intentionally empty: chart appVersion (v0.13.0) is used, so the
      # image only changes when the chart version changes and Renovate has a
      # single thing to track.
      pullPolicy: IfNotPresent

    # No bundled model servers or content extractors. Provider connections
    # are configured in the Admin UI and persisted in the SQLite database,
    # never in Git.
    ollama:
      enabled: false
    pipelines:
      enabled: false
    terminals:
      enabled: false
    tika:
      enabled: false

    # One replica means the in-memory websocket manager is enough, so the
    # bundled Redis is not deployed.
    websocket:
      enabled: true
      manager: ""
      redis:
        enabled: false

    service:
      type: ClusterIP
      port: 80

    # Chart-managed claim (rendered only when provider is "local" and no
    # existingClaim is set), named "open-webui" in the ai namespace.
    persistence:
      enabled: true
      provider: local
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      annotations:
        # Retain SQLite/chats/uploads if the release is uninstalled
        # (including Flux pruning this HelmRelease).
        helm.sh/resource-policy: keep

    # Edge routing is handled by the Traefik IngressRoute in this folder.
    ingress:
      enabled: false
    route:
      enabled: false

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    readinessProbe:
      httpGet:
        path: /ready
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

    # List form, not map form: the chart default for this key is a list, and
    # Helm coalesces a map into it poorly ("skipped value ... Not a table"),
    # which risks the whole env block being dropped on upgrade.
    extraEnvVars:
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: open-webui-secrets
            key: WEBUI_SECRET_KEY
      # ConfigVar: must be correct before any OAuth/SSO is enabled, since
      # after first boot the database value wins over the environment.
      - name: WEBUI_URL
        value: https://ai.teamg.app
      # Exactly one migration-capable worker on the single-replica profile.
      - name: UVICORN_WORKERS
        value: "1"
      - name: ENABLE_DB_MIGRATIONS
        value: "true"
      # llama.cpp runs --models-max 1, so switching models reloads an
      # 11-13 GB GGUF. The 300s default would abort the first message of a
      # cold model.
      - name: AIOHTTP_CLIENT_TIMEOUT
        value: "900"
