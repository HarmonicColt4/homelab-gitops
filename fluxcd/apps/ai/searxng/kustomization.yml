apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai

resources:
  - deploy.yml
  - svc.yml
  - ingress-route.yml
  - middleware.yml

configMapGenerator:
  - name: searxng-config
    files:
      - settings.yml=settings.yml
      - limiter.toml=limiter.toml

secretGenerator:
  - name: searxng-secret
    envs:
      - secrets/enc.env
