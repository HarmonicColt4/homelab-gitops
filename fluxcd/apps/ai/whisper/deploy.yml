---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  labels:
    app: whisper
spec:
  replicas: 1
  # The model cache is a ReadWriteOnce volume. A rolling update would try to
  # attach the same claim to two pods at once and deadlock on a multi-attach,
  # so the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      # The CUDA image is amd64 only. The nvidia.com/gpu request already pins
      # the pod to beast (the only node advertising the resource), but the arch
      # selector keeps it off the arm64 control plane if that ever changes.
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      # The image runs as the "ubuntu" user (uid/gid 1000). fsGroup makes the
      # Longhorn model cache group-writable so the container can populate it;
      # without it the mount is root-owned and the download fails with EACCES.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The model is installed here, before Speaches starts, instead of from a
      # postStart hook. postStart runs concurrently with the entrypoint and
      # cannot fail the pod, so a broken download only surfaced as an HTTP 500
      # on the first transcription. An initContainer blocks the server until
      # the cache is complete and exits non-zero if it is not.
      #
      # snapshot_download() is called with no allow_patterns, so it fetches
      # every file in the repo including README.md. That model card is what
      # Speaches reads at inference time to discover the model's languages and
      # task; downloading only the CTranslate2 weights leaves it absent and
      # every transcription fails. When the cache is already complete this
      # container is a no-op.
      initContainers:
        - name: fetch-model
          # Same tag and pull policy as the server below: the interpreter is
          # inside this image's venv, and a floating tag must not let the two
          # containers resolve to different digests.
          image: ghcr.io/speaches-ai/speaches:latest-cuda
          imagePullPolicy: Always
          command:
            - /home/ubuntu/speaches/.venv/bin/python
            - -c
            - |
              import os
              import shutil
              import sys

              from huggingface_hub import snapshot_download

              REPO_ID = "Systran/faster-whisper-large-v3"
              CARD = "README.md"


              def fetch():
                  # No allow_patterns: the model card must be downloaded too.
                  return snapshot_download(repo_id=REPO_ID)


              snapshot = fetch()
              card = os.path.join(snapshot, CARD)

              # A cache populated by the old warm-up holds the weights but no
              # model card, and a re-check of that cache can succeed without
              # the card. Delete the repo's cache directory once and fetch
              # again. The single retry is the loop guard: if the card is still
              # absent after a clean download this container fails loudly.
              if not os.path.isfile(card):
                  repo_cache = os.path.dirname(os.path.dirname(snapshot))
                  print(
                      f"{CARD} missing in {snapshot}: cache was populated "
                      f"without it. Deleting {repo_cache} and re-downloading "
                      "once.",
                      flush=True,
                  )
                  shutil.rmtree(repo_cache, ignore_errors=True)
                  snapshot = fetch()
                  card = os.path.join(snapshot, CARD)

              if not os.path.isfile(card):
                  print(
                      f"ERROR: {CARD} still missing in {snapshot}; refusing to "
                      "start",
                      file=sys.stderr,
                      flush=True,
                  )
                  sys.exit(1)

              print(f"model ready: {snapshot} ({CARD} present)", flush=True)
          volumeMounts:
            # Same path as the server: another mountPath would download into a
            # location the main container cannot see.
            - name: models
              mountPath: /home/ubuntu/.cache/huggingface/hub
          resources:
            # Download only; it does no inference, so it requests no GPU.
            requests:
              cpu: "1"
              memory: 1Gi
          # No securityContext override: this inherits the pod-level
          # runAsUser/runAsGroup/fsGroup 1000, so the files it writes remain
          # readable by the server.
          #
          # No activeDeadlineSeconds either: a cold pull of ~3 GB over the
          # network legitimately takes minutes, and a deadline would turn a
          # slow first start into a crash loop.
      containers:
        - name: whisper
          # Floating tag: upstream publishes latest-cuda as a moving pointer.
          # Renovate cannot pin a floating tag, so Always re-pulls on restart.
          image: ghcr.io/speaches-ai/speaches:0.8.1-cuda
          imagePullPolicy: Always
          env:
            # faster-whisper/CTranslate2 on the shared RTX 4080.
            - name: WHISPER__INFERENCE_DEVICE
              value: cuda
            # int8 weights with fp16 compute: ~2.9 GB resident for large-v3,
            # versus ~4.5 GB for fp16. The VRAM budget in
            # fluxcd/apps/ai/llama.cpp/models-preset.ini assumes this figure.
            - name: WHISPER__COMPUTE_TYPE
              value: int8_float16
            # Keep large-v3 resident. Reloading it costs seconds and a VRAM
            # spike that can collide with llama.cpp's prefill working set.
            # The field is whisper.ttl, so the nested delimiter is required:
            # STT_MODEL_TTL is silently ignored and leaves the 300s default.
            - name: WHISPER__TTL
              value: "-1"
            - name: ENABLE_UI
              value: "false"
            # large-v3, not turbo: Russian WER is 3.8% vs 6.0% for turbo, and
            # the target languages are English, French and Russian. The model
            # is installed into the shared cache by the fetch-model init
            # container above, which also fetches the card Speaches reads.
          # API_KEY is the only secret. Speaches requires it on every endpoint
          # except /health, /docs and /openapi.json, so the IngressRoute is
          # keyed even though it is published.
          envFrom:
            - secretRef:
                name: whisper-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
              # Time-sliced: the device plugin advertises two of these for the
              # one physical card. This is not a memory reservation.
              nvidia.com/gpu: "1"
          volumeMounts:
            # HuggingFace Hub cache. The CTranslate2 model.bin is ~3 GB on
            # disk (int8 is applied at load time, not in the cache); the claim
            # is larger to leave room for future models.
            - name: models
              mountPath: /home/ubuntu/.cache/huggingface/hub
          # Speaches registers the API key as an app-level FastAPI dependency,
          # so /health is keyed too: an unauthenticated httpGet gets 403 and
          # the pod never becomes ready. The probes send the key from the env
          # var injected by envFrom. curl -f fails on 4xx/5xx, so a wrong key
          # still fails the probe instead of masking it.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -fsS -H "Authorization: Bearer $API_KEY" http://127.0.0.1:8000/health'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -fsS -H "Authorization: Bearer $API_KEY" http://127.0.0.1:8000/health'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -fsS -H "Authorization: Bearer $API_KEY" http://127.0.0.1:8000/health'
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-models
