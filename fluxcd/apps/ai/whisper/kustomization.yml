apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai

resources:
  - pvc.yml
  - deploy.yml
  - svc.yml
  - ingress-route.yml

# API_KEY is the only secret. The Deployment consumes it with envFrom, so the
# generated Secret must expose the key under exactly that name.
secretGenerator:
  - name: whisper-secret
    envs:
      - secrets/enc.env
