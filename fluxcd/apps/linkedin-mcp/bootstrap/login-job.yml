---
# One-shot LinkedIn sign-in.
#
# NOT part of kustomization.yml, and it must stay that way: Flux would race the
# Deployment for the ReadWriteOnce session volume, and the job needs a human at
# a browser. Apply it by hand, following docs/linkedin-mcp.md:
#
#   kubectl -n linkedin-mcp scale deploy/linkedin-mcp --replicas=0
#   kubectl apply -f fluxcd/apps/linkedin-mcp/bootstrap/login-job.yml
#   kubectl -n linkedin-mcp wait --for=condition=Ready pod -l job-name=linkedin-mcp-login
#   kubectl -n linkedin-mcp logs -f job/linkedin-mcp-login   # prints the token URL
#   kubectl -n linkedin-mcp port-forward job/linkedin-mcp-login 6080:6080
#   # open the token URL, sign in, let the job exit on its own
#   kubectl -n linkedin-mcp delete job linkedin-mcp-login
#   kubectl -n linkedin-mcp scale deploy/linkedin-mcp --replicas=1
#
# The session is written to the same PVC the Deployment mounts, so the server
# picks it up on its next start.
apiVersion: batch/v1
kind: Job
metadata:
  name: linkedin-mcp-login
  namespace: linkedin-mcp
spec:
  backoffLimit: 0
  # The viewer gives up after 30 minutes; leave room for the browser to close.
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: linkedin-mcp-login
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: beast
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: login
          image: stickerdaniel/linkedin-mcp-server:4.30.0
          # `--login-viewer` serves the login browser at a token-protected URL
          # on 6080. Plain `--login` has no visible window in a container.
          args:
            - --login
            - --login-viewer
          ports:
            - name: viewer
              containerPort: 6080
              protocol: TCP
          # No readOnlyRootFilesystem: the Patchright installer takes a cache
          # lock under /opt/patchright and needs a writable /tmp. See the same
          # note in deploy.yml.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: session
              mountPath: /home/pwuser/.linkedin-mcp
            # /tmp stays the image's own 1777 directory; an emptyDir is 0777
            # without the sticky bit and the installer refuses it.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: session
          persistentVolumeClaim:
            claimName: linkedin-mcp-session
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
