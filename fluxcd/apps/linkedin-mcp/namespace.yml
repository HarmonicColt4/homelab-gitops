apiVersion: v1
kind: Namespace
metadata:
  name: linkedin-mcp
  labels:
    # baseline, not restricted: the fix-volume-ownership init container runs as
    # root with CAP_CHOWN to take ownership of the Longhorn volume, which the
    # server needs before it can chmod its profile root. The application
    # container itself still runs non-root with all capabilities dropped.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
