---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-data
  annotations:
    # Longhorn reclaims with Retain; keep the volume when Flux prunes the app.
    # This also makes Flux create-only for this object, so changing `storage`
    # below does NOT resize it: patch the live PVC by hand (see README.md).
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
