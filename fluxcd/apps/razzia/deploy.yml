---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: razzia
  name: razzia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: razzia
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: razzia
    spec:
      containers:
        - image: ralex91/razzia:4.1.0
          name: razzia
          envFrom:
            - secretRef:
                name: razzia-config
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: quiz
              mountPath: /app/config/quizz
          ports:
            - containerPort: 3000
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: razzia-config
        - name: quiz
          configMap:
            name: quiz
