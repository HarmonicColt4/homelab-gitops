---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: adguard-home
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: adguard-home
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 1h
      version: 14.1.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: adguard-home-values
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: NotIn
                              values:
                                - rpi5
