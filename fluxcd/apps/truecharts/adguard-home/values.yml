---
service:
  dns-tcp:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.3
      metallb.io/allow-shared-ip: dns
  dns-udp:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.3
      metallb.io/allow-shared-ip: dns
  dns-https:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.3
      metallb.io/allow-shared-ip: dns
  dns-https-udp:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.3
      metallb.io/allow-shared-ip: dns
  dns-crypt:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.3
      metallb.io/allow-shared-ip: dns
  dns-crypt-udp:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.3
      metallb.io/allow-shared-ip: dns
  dns-quic-udp-1:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.io/loadBalancerIPs: 10.25.25.3
      metallb.io/allow-shared-ip: dns
persistence:
  data:
    size: 5Gi
podOptions:
  tolerations:
    - key: dedicated
      operator: Equal
      value: rpi5
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - rpi5
