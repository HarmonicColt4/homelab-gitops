---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: cloudflareddns
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: cloudflareddns
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 15.1.7
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cloudflareddns-values
  values:
    podOptions:
      tolerations:
        - key: dedicated
          operator: Equal
          value: rpi5
          effect: NoSchedule
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: NotIn
                              values:
                                - rpi5
