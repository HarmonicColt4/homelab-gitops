---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - helmrelease.yml
  - ingress-route.yml
  - net-attach-def.yml
  - secrets/home-assistant-db.enc.yml
  - mosquitto
  - zigbee2mqtt

configMapGenerator:
  - name: home-assistant-values
    namespace: flux-system
    files:
      - values.yaml=values.yml

transformers:
  - |
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-important-to-example
      namespace: home-assistant
    setRoleBindingSubjects: none
    unsetOnly: true
    fieldSpecs:
      - kind: HelmRelease
        path: spec/targetNamespace
        create: true
