---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: flux-system
spec:
  timeout: 10m
  releaseName: mosquitto
  interval: 1h
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: mosquitto
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 20.1.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
