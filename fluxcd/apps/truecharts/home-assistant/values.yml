homeassistant:
  trusted_proxies:
    - 10.244.0.0/16
credentials:
  garage:
    type: s3
    url: http://truenas.home.arpa:30188
    bucket: home-assistant
# common-2026: cnpg.main moved to dependencies.postgresql. pgVersion is pinned to
# 16 so the cluster stays on its current major; drop it later to move to 18.
dependencies:
  postgresql:
    enabled: true
    operator:
      pgVersion: 16
      backups:
        enabled: true
        credentials: garage
        destinationPath: s3://home-assistant
workload:
  main:
    podSpec:
      annotations:
        k8s.v1.cni.cncf.io/networks: macvlan-conf-iot, macvlan-conf-home