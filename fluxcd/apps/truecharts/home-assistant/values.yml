homeassistant:
  trusted_proxies:
    - 10.244.0.0/16
dependencies:
  postgresql:
    enabled: false
workload:
  main:
    podSpec:
      annotations:
        k8s.v1.cni.cncf.io/networks: macvlan-conf-iot, macvlan-conf-home
      initContainers:
        init:
          env:
            HA_DB_URL:
              secretKeyRef:
                expandObjectName: false
                name: home-assistant-db
                key: url
