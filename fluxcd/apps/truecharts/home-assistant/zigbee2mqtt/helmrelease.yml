apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
  namespace: flux-system
spec:
  timeout: 10m
  releaseName: zigbee2mqtt
  interval: 1h
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: zigbee2mqtt
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 17.1.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: zigbee2mqtt-values
