---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: paperless-ngx
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: paperless-ngx
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 18.5.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: paperless-ngx-values
