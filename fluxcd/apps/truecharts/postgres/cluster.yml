---
# Shared PostgreSQL cluster for the small TrueCharts apps (home-assistant,
# seerr, vaultwarden, paperless-ngx). immich keeps its own cluster because it
# needs the vectorchord image and has a much higher WAL churn.
#
# Roles and databases are declared separately (roles.yml / databases.yml) so
# they survive a rebuild of this cluster. See README.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-db
  namespace: postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00

  # Needed for the pg_dump/pg_restore migration and for manual recovery.
  enableSuperuserAccess: true
  enablePDB: true
  primaryUpdateStrategy: unsupervised

  # One instance per worker node. `required` is deliberate: the per-app
  # clusters used `preferred`, which silently put both replicas on hedy.
  affinity:
    podAntiAffinityType: required
    tolerations:
      - key: dedicated
        operator: Equal
        value: rpi5
        effect: NoSchedule
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - rpi5

  resources:
    requests:
      cpu: 10m
      memory: 200Mi
    limits:
      cpu: 1000m
      memory: 2400Mi

  storage:
    size: 2Gi
    storageClass: longhorn
  walStorage:
    size: 1Gi
    storageClass: longhorn

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: shared-db-backup
        serverName: shared-db
