---
# Application roles. Each password comes from a `kubernetes.io/basic-auth`
# Secret in secrets/db-roles.enc.yml, so no plaintext secret lives in git.
# Reclaim policy is `retain`: removing a manifest must never drop a role that
# owns a database.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: shared-db-seerr
  namespace: postgres
spec:
  cluster:
    name: shared-db
  name: seerr
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: shared-db-seerr
