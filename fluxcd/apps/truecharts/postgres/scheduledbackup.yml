---
# Daily base backup at 00:00 local time, on top of continuous WAL archiving.
# `immediate: true` takes one as soon as this object is created.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shared-db-daily-backup
  namespace: postgres
spec:
  cluster:
    name: shared-db
  schedule: "0 0 0 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
