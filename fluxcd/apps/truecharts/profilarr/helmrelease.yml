---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: profilarr
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: profilarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 5.2.0
  valuesFrom:
    - kind: ConfigMap
      name: global-values
  values:
    TZ: Pacific/Auckland
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                AUTH: off
                ORIGIN: https://profilarr.teamg.app
