---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: radarr
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 29.1.9
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: ConfigMap
      name: radarr-values
  values:
    metrics:
      main:
        enabled: false
