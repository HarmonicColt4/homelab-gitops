---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: seerr
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: seerr
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 18.0.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cnpg-values
    - kind: ConfigMap
      name: seerr-values
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: NotIn
                              values:
                                - rpi5
                                - beast
