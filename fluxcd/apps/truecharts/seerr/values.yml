dependencies:
  postgresql:
    enabled: false
    depconfig:
      postgresqlUsername: seerr
      postgresqlDatabase: seerr
podOptions:
  tolerations:
    - key: dedicated
      operator: Equal
      value: rpi5
      effect: NoSchedule
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: seerr-db
                key: host
            DB_PASS:
              secretKeyRef:
                expandObjectName: false
                name: seerr-db
                key: password
