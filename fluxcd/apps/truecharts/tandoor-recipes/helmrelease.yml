---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor-recipes
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: tandoor-recipes
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: tandoor-recipes
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 23.0.1
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cnpg-values
    - kind: Secret
      name: tandoor-recipes-values
