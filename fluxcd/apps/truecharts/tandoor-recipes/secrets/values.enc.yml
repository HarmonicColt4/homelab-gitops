# Chart values for tandoor-recipes. The Django secret key is SOPS encrypted;
# the chart renders it into the tandoor-recipes-recipes-secrets Secret itself.
dependencies:
  postgresql:
    enabled: false
    depconfig:
      postgresqlUsername: tandoor-recipes
      postgresqlDatabase: tandoor-recipes
tandoor:
  secretKey: ENC[AES256_GCM,data:bdTlDo0j1SF/w1qr4Mi34ymeKKtSlo0tUCy+Qd3Yi2dyjMtqKTptp/njKRLUxFKPtC0=,iv:YxDTtX54wL6s489FsMh4ta9tUUKXN0jQwFlhf7gHvTk=,tag:tRQs02u8OTy9r7MoOFjJ9A==,type:str]
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            POSTGRES_HOST:
              secretKeyRef:
                expandObjectName: false
                name: tandoor-recipes-db
                key: host
            POSTGRES_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: tandoor-recipes-db
                key: password
