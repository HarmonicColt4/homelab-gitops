# Chart values for tandoor-recipes. The Django secret key and the OIDC client
# credentials are SOPS encrypted; the chart renders them into the pod env.
#
# First-time login is Pocket ID OIDC (SOCIALACCOUNT_ONLY=1); local password
# login remains as break-glass at /accounts/login/?form=1. The superuser
# gpenda carries the Pocket ID email so the first OIDC login auto-links.
dependencies:
  postgresql:
    enabled: false
    depconfig:
      postgresqlUsername: tandoor-recipes
      postgresqlDatabase: tandoor-recipes
tandoor:
  secretKey: ENC[AES256_GCM,data:XMg+0fCTaUN1BtKpuQet+3f3S2CJEkYZsO6sk5/CNya6rrEdfoITMFPminFI3gV8Xds=,iv:hZ7Ns3S97p2PXA0z+h3UVZJ5WQx06txriGhxFg59Iio=,tag:B4Jn4YTZiy+1l7hCdC2nzg==,type:str]
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            POSTGRES_HOST:
              secretKeyRef:
                expandObjectName: false
                name: tandoor-recipes-db
                key: host
            POSTGRES_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: tandoor-recipes-db
                key: password
            SOCIAL_PROVIDERS: allauth.socialaccount.providers.openid_connect
            SOCIALACCOUNT_ONLY: "1"
            SOCIALACCOUNT_EMAIL_AUTHENTICATION: "1"
            SOCIALACCOUNT_EMAIL_AUTHENTICATION_AUTO_CONNECT: "1"
            SOCIAL_DEFAULT_ACCESS: "1"
            SOCIAL_DEFAULT_GROUP: admin
            SOCIALACCOUNT_PROVIDERS: ENC[AES256_GCM,data:,iv:4A0fNJWSPXrUDlG9HIWP0pKd8fW3bSmB8Ghu3nucwT4=,tag:wGfuylG2ETdIWkPsorMRIg==,type:str]
