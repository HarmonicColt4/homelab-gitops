---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  timeout: 10m
  releaseName: vaultwarden
  interval: 1h
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: vaultwarden
      sourceRef:
        kind: HelmRepository
        name: truecharts
      interval: 1h
      version: 31.0.4
  valuesFrom:
    - kind: ConfigMap
      name: global-values
    - kind: Secret
      name: cnpg-values
    - kind: Secret
      name: vaultwarden-values
  values:
    ingress:
      main:
        required: false
        enabled: false
