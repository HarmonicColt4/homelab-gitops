            SSO_CLIENT_ID: ENC[AES256_GCM,data:vJkWetxSVUy6ccxIv37ZvSUt80/SCtBHPw6Xv7F03A763zz2,iv:rVVeq2Mm2onxLg5fCH+aBetEFIdZ4eqn0r6LfydQDyQ=,tag:upa8cWUHFczYIu2Z+94SUw==,type:str]
