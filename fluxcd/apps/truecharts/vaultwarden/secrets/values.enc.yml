---
workload:
  main:
    replicas: 1
    podSpec:
      containers:
        main:
          probes:
            readiness:
              enabled: false
            liveness:
              enabled: false
            startup:
              enabled: false
          env:
            DOMAIN: https://pw.teamg.app
            SSO_ENABLED: ENC[AES256_GCM,data:sf+7xg==,iv:sZt6SDCciNvA+JnYPZw2LF6i1GIUxpPHT+h19ezz4B4=,tag:nd6F+owGwroErhIsb1Wbhg==,type:bool]
