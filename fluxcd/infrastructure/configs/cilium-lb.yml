---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: ip-pool
spec:
  blocks:
    - start: 10.25.25.2
      stop: 10.25.25.4
    - start: 10.25.25.11
      stop: 10.25.25.30
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-announcement
spec:
  loadBalancerIPs: true
  interfaces:
    # Match any VLAN-25 interface regardless of the parent NIC name, so the
    # announcer works on every node (beast: net0.25, hedy: netr.25,
    # rpi5: end0.25) instead of only the nodes whose NIC name was hardcoded.
    - ^.*\.25$
    # Untagged LAN interface (legacy nodes).
    - ^ens18$
