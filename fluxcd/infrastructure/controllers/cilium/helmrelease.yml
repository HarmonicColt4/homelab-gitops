---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  timeout: 10m
  interval: 24h
  releaseName: cilium
  driftDetection:
    mode: enabled
  upgrade:
    timeout: 5m
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      strategy: rollback
  maxHistory: 3
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 24h
      version: 1.20.4
  values:
    ipam:
      mode: kubernetes
    kubeProxyReplacement: false
    defaultLBServiceIPAM: none
    l2announcements:
      enabled: false
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    bpf:
      autoMount:
        enabled: false
