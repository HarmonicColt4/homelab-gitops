---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  timeout: 10m
  targetNamespace: cilium
  releaseName: cilium
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: 1.20.5
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1h
  upgrade:
    crds: CreateReplace
  values:
    # Talos prerequisites:
    # https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
    ipam:
      mode: kubernetes
    # Run Cilium as a kube-proxy replacement. Requires KubePrism on :7445
    # (enabled by default on Talos v1.14+).
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    # Announce LoadBalancer IPs over L2 (ARP) from the nodes, replacing MetalLB.
    l2announcements:
      enabled: true
    # Raise the client-side rate limit so Cilium can keep up with the API server
    # while reconciling the additional LB IPAM / L2 resources.
    k8sClientRateLimit:
      qps: 20
      burst: 40
    # Talos already provides the cgroupv2 and bpffs mounts; do not let Cilium
    # attempt to mount them itself.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # Talos does not allow Kubernetes workloads to load kernel modules, so the
    # SYS_MODULE capability must be dropped from Cilium's default set.
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    # The CNI must run on every node, including the tainted control plane
    # (rpi5 carries dedicated=rpi5:NoSchedule).
    tolerations:
      - operator: Exists
    operator:
      tolerations:
        - operator: Exists
