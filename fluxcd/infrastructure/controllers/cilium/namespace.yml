---
apiVersion: v1
kind: Namespace
metadata:
  name: cilium
  labels:
    # Cilium requires privileged pods (hostNetwork, hostPath, NET_ADMIN, etc.).
    # The cluster enforces Pod Security Admission at baseline by default, so the
    # namespace must opt in to the privileged level.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
