---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: plugin-barman-cloud
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: plugin-barman-cloud
      sourceRef:
        kind: HelmRepository
        name: cnpg
      interval: 1h
      version: 0.9.0
  values:
    # Keep the plugin on the same node as the operator: the control plane is
    # tainted and beast is reserved for other workloads.
    tolerations:
      - key: dedicated
        operator: Equal
        value: rpi5
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - rpi5
                    - beast
