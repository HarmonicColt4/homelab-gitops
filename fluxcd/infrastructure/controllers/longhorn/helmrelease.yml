---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  timeout: 10m
  releaseName: longhorn
  targetNamespace: longhorn-system
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  driftDetection:
    mode: enabled
  values:
    persistence:
      defaultDataLocality: best-effort
      defaultClassReplicaCount: 2
      recurringJobSelector:
        enable: true
        jobList:
          - '{ "name": "default", "isGroup": true }'
      reclaimPolicy: "Retain"
    defaultSettings:
      createDefaultDiskLabeledNodes: true
      defaultReplicaCount: "2"
      concurrentAutomaticEngineUpgradePerNodeLimit: "3"
      removeSnapshotsDuringFilesystemTrim: true
      replicaAutoBalance: best-effort
      nodeDrainPolicy: allow-if-replica-is-stopped
      taintToleration: dedicated=rpi5:NoSchedule
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    longhornUI:
      replicas: 1
      tolerations:
        - key: dedicated
          operator: Equal
          value: rpi5
          effect: NoSchedule
    defaultBackupStore:
      backupTarget: s3://longhorn@garage/
      backupTargetCredentialSecret: garage
    longhornManager:
      tolerations:
        - key: dedicated
          operator: Equal
          value: rpi5
          effect: NoSchedule
    longhornDriver:
      tolerations:
        - key: dedicated
          operator: Equal
          value: rpi5
          effect: NoSchedule
    longhornGlobalManager:
      tolerations:
        - key: dedicated
          operator: Equal
          value: rpi5
          effect: NoSchedule
    global:
      tolerations:
        - key: dedicated
          operator: Equal
          value: rpi5
          effect: NoSchedule
