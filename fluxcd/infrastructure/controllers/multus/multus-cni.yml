---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: multus-cni
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deployments
  prune: true
  sourceRef:
    kind: GitRepository
    name: multus-cni
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: not-used
        spec:
          template:
            spec:
              initContainers:
              - command:
                - /install-cni.sh
                image: ghcr.io/siderolabs/install-cni:v1.9.0
                name: install-cni
                securityContext:
                  privileged: true
                volumeMounts:
                - mountPath: /host/opt/cni/bin
                  mountPropagation: Bidirectional
                  name: cnibin
              volumes:
              - name: host-run-netns
                hostPath:
                  path: /var/run/netns/
              containers:
              - name: kube-multus
                resources:
                  limits:
                    cpu: "300m"
                    memory: "150Mi"
                  requests:
                    cpu: "200m"
                    memory: "100Mi"
              initContainers:
              - name: install-multus-binary
                command:
                - "/usr/src/multus-cni/bin/install_multus"
                - "-d"
                - "/host/opt/cni/bin"
                - "-t"
                - "thick"
      target:
        kind: DaemonSet
        name: kube-multus-ds
    - patch: |-
        - op: remove
          path: /spec/template/spec/containers/0/resources/limits
      target:
        kind: DaemonSet
        name: kube-multus-ds
