---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gpu-operator
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  url: oci://nvcr.io/nvidia/cloud-native-charts/gpu-operator
  ref:
    tag: v26.7.3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: gpu-operator
  chartRef:
    kind: OCIRepository
    name: gpu-operator
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Talos ships the NVIDIA OSS kernel modules and container toolkit as
    # system extensions, so the operator must not manage them.
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    # Advertise two nvidia.com/gpu resources for the single RTX 4080 so
    # llama.cpp and Whisper can both schedule. This is time-slicing, not
    # memory partitioning: both pods see the whole 16 GB card and the first
    # over-allocator wins. See time-slicing.yml for the full warning.
    devicePlugin:
      config:
        name: time-slicing-config
        default: any
