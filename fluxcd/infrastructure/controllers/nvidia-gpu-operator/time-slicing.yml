---
# GPU time-slicing for the single RTX 4080.
#
# Time-slicing is time-multiplexing, NOT memory partitioning: the device
# plugin advertises `replicas` copies of nvidia.com/gpu, the scheduler can
# place that many pods, and every pod sees the whole 16 GB card. There is no
# memory isolation and no per-pod cap. The first pod to over-allocate wins and
# the other one gets a CUDA OOM. The VRAM budget in
# fluxcd/apps/ai/llama.cpp/models-preset.ini and docs/whisper.md is what keeps
# the two co-tenants inside the card; the scheduler will not do it for you.
#
# The ConfigMap must live in the operator namespace (gpu-operator), not
# flux-system: the device plugin DaemonSet reads it from its own namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: gpu-operator
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 2
