---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 24
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: renovate
              image: renovate/renovate:44.255.0
              env:
                - name: LOG_LEVEL
                  value: info
              envFrom:
                - secretRef:
                    name: renovate-env
                - configMapRef:
                    name: renovate-env
          restartPolicy: Never
