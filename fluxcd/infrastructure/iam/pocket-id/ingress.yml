---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: pocket-id
  name: pocket-id
spec:
  ports:
    - port: 1411
      protocol: TCP
      targetPort: 1411
  selector:
    app: pocket-id
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocket-id
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`id.teamg.app`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: pocket-id
          port: 1411
