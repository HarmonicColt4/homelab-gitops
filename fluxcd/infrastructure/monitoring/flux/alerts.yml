---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: info
  namespace: flux-system
spec:
  providerRef:
    name: discord-info
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: HelmChart
      name: "*"
  eventMetadata:
    cluster: cluster
  exclusionList:
    - Dependencies do not meet ready condition
    - HelmRelease.* configured
    - Service.*truenas-penda.*configured
    - dependency.*is not ready
    - Health check passed
    - CronJob/renovate/renovate configured
    - (ConfigMap|Secret).*(created|deleted)
    - (Alert|Provider).*configured
    - Reconciliation finished in .*
    - stored artifact for commit
    - Cluster state of release .* has drifted from the desired state
    - Cluster state of release .* has been corrected
    - stored fetched index of size
    - pulled '.*' chart with version
