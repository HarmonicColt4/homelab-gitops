---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kps-grafana
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.teamg.app`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: kps-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kps-alertmanager
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`alertmanager.teamg.app`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: kps-alertmanager
          port: 9093
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kps-prometheus
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prometheus.teamg.app`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: kps-prometheus
          port: 9090
