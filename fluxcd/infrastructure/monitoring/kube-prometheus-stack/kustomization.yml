---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - repository.yml
  - helmrelease.yml
  - ingress-route.yml
  - alertmanager-config.yml

configMapGenerator:
  - name: kube-prometheus-stack-values
    namespace: flux-system
    files:
      - values.yaml=values.yml
  - name: windows-exporter-dashboard
    namespace: kube-prometheus-stack
    files:
      - windows-exporter.json=dashboards/windows-exporter.json
    options:
      labels:
        grafana_dashboard: "1"

secretGenerator:
  - name: grafana-admin-user
    envs:
      - secrets/grafana-admin-user.enc.env
    options:
      disableNameSuffixHash: true

  - name: alertmanager-discord-webhook
    envs:
      - secrets/alertmanager-discord-webhook.enc.env

transformers:
  - |
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-important-to-example
      namespace: kube-prometheus-stack
    setRoleBindingSubjects: none
    unsetOnly: true
    fieldSpecs:
      - kind: HelmRelease
        path: spec/targetNamespace
        create: true

configurations:
  - kustomizeconfig.yml
