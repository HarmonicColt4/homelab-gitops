---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: teamg.gg
spec:
  sources:
  - useDefaultCAs: true

  - secret:
      name: root-secret
      key: ca.crt

  target:
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: renovate
