---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: teamg-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: TeamG CA
  secretName: root-secret
  duration: 87600h
  renewBefore: 1h
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
