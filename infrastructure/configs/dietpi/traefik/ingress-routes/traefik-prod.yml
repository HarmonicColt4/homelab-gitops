apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-prod
  namespace: traefik

spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: HostRegexp(`^.+\.weirdrussiandomain\.com$`) && PathPrefix(`/`)
      services:
        - name: traefik-prod
          port: 443
      priority: 1
