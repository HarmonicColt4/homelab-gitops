---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`flux-webhook.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: webhook-receiver
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: receiver
  namespace: flux-system
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.13.25.26
spec:
  type: LoadBalancer
  selector:
    app: notification-controller
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 9292
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: flux-system
  namespace: flux-system
spec:
  type: github
  events:
    - "ping"
    - "push"
  secretRef:
    name: webhook-token
  resources:
    - kind: GitRepository
      name: flux-system