---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalPushSecret
metadata:
  name: home-arpa-infisical-push-secret
spec:
  resyncInterval: 1m
  updatePolicy: Replace
  deletionPolicy: Delete

  destination:
    projectSlug: homelab-deoo
    environmentSlug: production
    secretsPath: /certificates

  push:
    secret:
      secretName: home-tls
      secretNamespace: traefik

      template:
        includeAllSecrets: false
        data:
          home-arpa.crt: '{{ (index . "tls.crt").Value }}'
          home-arpa-combined.pem: '{{ (index . "tls-combined.pem").Value }}'

  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: secrets-operator
