---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`truenas.${domain}`)
    kind: Rule
    services:
    - name: truenas
      port: 443
      serversTransport: insecure
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`pve.${domain}`)
    kind: Rule
    services:
    - name: proxmox
      port: 8006
      serversTransport: insecure
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`gitea.${domain}`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: gitea
      port: 30008
---
apiVersion: traefik.io/v1alpha1
