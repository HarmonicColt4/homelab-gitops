---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`truenas.${domain}`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: truenas@file
      port: 443
      serversTransport: insecure
      kind: TraefikService
