---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: errors
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: error
  eventSources:
  - kind: Kustomization
    name: '*'
  - kind: HelmRelease
    name: '*'
  - kind: GitRepository
    name: '*'
  eventMetadata:
    cluster: weird-russian-cluster
  exclusionList:
  - "Dependencies do not meet ready condition"
  - "HelmRelease.* configured"
  - "Service/truecommand/truenas-penda configured"
  - "dependency.*is not ready"
