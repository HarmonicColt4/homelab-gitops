---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: kustomization-error
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: error
  eventSources:
  - kind: Kustomization
    name: '*'
    namespace: flux-system
  eventMetadata:
    cluster: ${weirdrussiandomain.com:=placeholder}
  exclusionList:
  - "Dependencies do not meet ready condition"
  - "HelmRelease.* configured"
  - "Service/truecommand/truenas-penda configured"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: helmrelease-error
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: error
  eventSources:
  - kind: HelmRelease
    name: '*'
    namespace: default
  - kind: HelmRelease
    name: '*'
    namespace: truecharts
  - kind: HelmRelease
    name: '*'
    namespace: flux-system
  eventMetadata:
    cluster: ${weirdrussiandomain.com:=placeholder}
  exclusionList:
  - "dependency.*is not ready"
