---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: kustomization-info
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: '*'
      namespace: flux-system
  eventMetadata:
    cluster: ${cluster_name:=placeholder}
  exclusionList:
    - "Dependencies do not meet ready condition"
    - "HelmRelease.* configured"
    - "Service/truecommand/truenas-penda configured"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: helmrelease-info
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
    - kind: HelmRelease
      name: '*'
      namespace: default
    - kind: HelmRelease
      name: '*'
      namespace: truecharts
    - kind: HelmRelease
      name: '*'
      namespace: flux-system
  eventMetadata:
    cluster: ${cluster_name:=placeholder}      
  exclusionList:
    - "dependency.*is not ready"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: discord-webhook
  namespace: flux-system
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 10
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-deoo
        envSlug: ${infisical_envSlug}
        secretsPath: '/flux'
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: secrets-operator
  managedKubeSecretReferences:
    - secretName: discord-webhook
      secretNamespace: flux-system
      creationPolicy: 'Orphan'
      template:
        includeAllSecrets: false
        data:
          address: "{{ .discord_webhook.Value }}"