resources:
  - ../base
patches:
  - patch: |-
      - op: replace
        path: /spec/addresses
        value:
          - 10.25.25.21/32
          - 10.25.25.26-10.25.25.90
    target:
      kind: IPAddressPool
      name: ip-pool
      namespace: metallb-system
  - patch: |-
      - op: replace
        path: /spec/acme/server
        value: https://acme-v02.api.letsencrypt.org/directory
    target:
      kind: ClusterIssuer
      name: letsencrypt
