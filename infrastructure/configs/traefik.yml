---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert
  namespace: traefik
spec:
  secretName: cert
  dnsNames:
    - "${domain}"
    - "*.${domain}"
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: insecureSkipVerify
  namespace: traefik
spec:
  serverName: example.org
  insecureSkipVerify: true