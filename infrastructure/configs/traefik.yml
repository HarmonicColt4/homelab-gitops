---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert
  namespace: traefik
spec:
  secretName: cert
  dnsNames:
    - "${domain}"
    - "*.${domain}"
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`flux-webhook.${domain}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: webhook-receiver
          port: 80
