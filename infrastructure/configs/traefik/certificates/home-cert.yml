---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home
spec:
  secretName: home-tls
  commonName: Home Certificate
  dnsNames:
  - home.arpa
  - "*.home.arpa"
  issuerRef:
    name: teamg-ca-issuer
    kind: ClusterIssuer
  duration: 8760h
  renewBefore: 1h
  additionalOutputFormats:
  - type: CombinedPEM
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalPushSecret
metadata:
  name: home-arpa
spec:
  resyncInterval: 1m
  updatePolicy: Replace
  deletionPolicy: Delete

  destination:
    projectSlug: homelab-deoo
    environmentSlug: production
    secretsPath: /certificates

  push:
    secret:
      secretName: home-tls

      template:
        includeAllSecrets: false
        data:
          home-arpa.crt: '{{ (index . "tls.crt").Value }}'
          home-arpa-combined.pem: '{{ (index . "tls-combined.pem").Value }}'

  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: secrets-operator
