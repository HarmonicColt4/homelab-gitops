---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- letsencrypt-cert.yml
- penda-cert.yml
- teamg-cert.yml
- truenas-cert.yml
- tls-store.yml

namespace: traefik

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-important-to-example
    namespace: traefik
  fieldSpecs:
  - path: spec/push/secret/secretNamespace
    kind: InfisicalPushSecret
    create: true
