---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: teamg
spec:
  secretName: teamg-tls
  commonName: TeamG Certificate
  dnsNames:
  - teamg.gg
  - "*.teamg.gg"
  issuerRef:
    name: teamg-ca-issuer
    kind: ClusterIssuer
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalPushSecret
metadata:
  name: teamg-gg
spec:
  resyncInterval: 1m
  updatePolicy: Replace
  deletionPolicy: Delete

  destination:
    projectSlug: homelab-deoo
    environmentSlug: production
    secretsPath: /certificates

  push:
    secret:
      secretName: teamg-tls

      template:
        includeAllSecrets: false
        data:
          teamg-gg.crt: '{{ (index . "tls.crt").Value }}'

  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: secrets-operator
