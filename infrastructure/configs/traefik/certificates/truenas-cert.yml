---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: truenas
spec:
  secretName: truenas-tls
  commonName: Truenas Certificate
  dnsNames:
  - truenas
  - truenas.home.arpa
  ipAddresses:
  - 10.13.25.10
  issuerRef:
    name: teamg-ca-issuer
    kind: ClusterIssuer
  duration: 8760h
  renewBefore: 1h
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalPushSecret
metadata:
  name: truenas
spec:
  resyncInterval: 1m
  updatePolicy: Replace
  deletionPolicy: Delete

  destination:
    projectSlug: homelab-deoo
    environmentSlug: production
    secretsPath: /certificates

  push:
    secret:
      secretName: truenas-tls

      template:
        includeAllSecrets: false
        data:
          truenas-gg.crt: '{{ (index . "tls.crt").Value }}'

  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: secrets-operator
