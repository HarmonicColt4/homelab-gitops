---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opencloud
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`opencloud.weirdrussiandomain.com`) && PathPrefix(`/`)
    services:
    - name: truenas
      port: 30259
      scheme: https
  - kind: Rule
    match: Host(`opencloud.teamg.app`) && PathPrefix(`/`)
    services:
    - name: truenas
      port: 30259
      scheme: https
