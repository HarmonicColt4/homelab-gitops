---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opencloud
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: HostRegexp(`opencloud\.(teamg\.gg|weirdrussiandomain\.com)`) && PathPrefix(`/`)
    services:
    - name: truenas
      port: 30259
      scheme: https
