---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pikvm
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pikvm.teamg.app`) && PathPrefix(`/`)
      services:
        - name: pikvm
          port: 443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: pikvm-ssh
spec:
  entryPoints:
    - pikvm-ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: pikvm
          port: 22
