---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: default
spec:
  interval: 24h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: default
spec:
  releaseName: cert-manager
  targetNamespace: cert-manager
  interval: 24h
  chart:
    spec:
      chart: cert-manager
      version: 1.17.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 24h
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true