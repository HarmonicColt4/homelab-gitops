apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - metallb.yml
  - cert-manager.yml 
  - longhorn.yml 
  - traefik.yml
configMapGenerator:
  - name: longhorn-values
    namespace: default
    files:
      - values.yaml=values/longhorn.yml
configurations:
  - kustomizeconfig.yml