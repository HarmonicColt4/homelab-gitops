---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: default
spec:
  interval: 24h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  releaseName: longhorn
  targetNamespace: longhorn-system
  interval: 24h
  chart:
    spec:
      chart: longhorn
      version: '1.*'
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: default
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: longhorn-values