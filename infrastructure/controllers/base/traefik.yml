---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: default
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: default
spec:
  targetNamespace: traefik
  releaseName: traefik
  interval: 24h
  chart:
    spec:
      chart: traefik
      version: "34.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 24h
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    deployment:
      kind: DaemonSet
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    ingressRoute:
      dashboard:
        matchRule: Host(`traefik.${domain}`) && ( PathPrefix(`/`) || PathPrefix(`/api`))
        enabled: true
        entryPoints:
          - websecure
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 10.13.25.31
    tlsStore:
      default:
        defaultCertificate:
          secretName: cert
    globalArguments:
      - --global.checknewversion
      - --serversTransport.insecureSkipVerify=true
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        allowCrossNamespace: true
      file:
        enabled: true
        content: |-
          http:
            routers:
              truenas:
                entryPoints:
                - websecure
                service: truenas
                rule: Host(`truenas.${domain}`) && PathPrefix(`/`)              
              proxmox:
                entryPoints:
                - websecure
                service: proxmox
                rule: Host(`pve.${domain}`) && PathPrefix(`/`)              
              gitea:
                entryPoints:
                - websecure
                service: gitea
                rule: Host(`gitea.${domain}`) && PathPrefix(`/`)              
              minio:
                entryPoints:
                - websecure
                service: minio
                rule: Host(`minio.${domain}`) && PathPrefix(`/`)              
              netbootxyz:
                entryPoints:
                - websecure
                service: netbootxyz
                rule: Host(`netbootxyz.${domain}`) && PathPrefix(`/`)            
            services:
              truenas:
                loadBalancer:
                  servers:
                  - url: https://10.13.25.10/
              proxmox:
                loadBalancer:
                  servers:
                  - url: https://10.13.25.9:8006/
              gitea:
                loadBalancer:
                  servers:
                  - url: http://10.13.25.10:30008/
              minio:
                loadBalancer:
                  servers:
                  - url: http://10.13.25.10:9002/
              netbootxyz:
                loadBalancer:
                  servers:
                  - url: http://10.13.25.10:31010/
