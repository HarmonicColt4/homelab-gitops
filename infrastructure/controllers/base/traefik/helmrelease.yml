apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: traefik
  releaseName: traefik
  interval: 24h
  chart:
    spec:
      chart: traefik
      version: 36.3.0
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 24h
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    deployment:
      kind: DaemonSet
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    ingressRoute:
      dashboard:
        matchRule: Host(`traefik.${domain}`) && ( PathPrefix(`/`) || PathPrefix(`/api`))
        enabled: true
        entryPoints:
          - websecure
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 10.13.25.31
    tlsStore:
      default:
        defaultCertificate:
          secretName: cert
    global:
      checkNewVersion: true
      sendAnonymousUsage: false
    additionalArguments:
      - "--serverstransport.insecureskipverify=true"
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        allowCrossNamespace: true
