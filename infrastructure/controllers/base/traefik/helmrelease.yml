apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: traefik
  releaseName: traefik
  interval: 24h
  chart:
    spec:
      chart: traefik
      version: 37.1.1
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 24h
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    deployment:
      kind: DaemonSet
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 600s
            idleTimeout: 600s
            writeTimeout: 600s
    ingressRoute:
      dashboard:
        matchRule: Host(`traefik.${domain}`)
        enabled: true
        entryPoints:
          - websecure
    tlsStore:
      default:
        defaultCertificate:
          secretName: cert
    global:
      checkNewVersion: true
      sendAnonymousUsage: false
    additionalArguments:
      - "--serverstransport.insecureskipverify=true"
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        allowCrossNamespace: true
