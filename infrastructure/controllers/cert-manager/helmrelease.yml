---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 24h
  chart:
    spec:
      chart: cert-manager
      version: v1.19.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 1h
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
spec:
  interval: 24h
  chart:
    spec:
      chart: trust-manager
      version: v0.20.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 1h
  values:
    app:
      webhook:
        tls:
          approverPolicy:
            enabled: true
            certManagerNamespace: cert-manager
