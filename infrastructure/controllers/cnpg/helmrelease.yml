---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  timeout: 10m
  interval: 1h
  releaseName: cnpg
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
      interval: 1h
      version: 0.29.1
