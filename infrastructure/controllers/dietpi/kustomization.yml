apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - renovate
patches:
  - patch: |-
      - op: add
        path: /spec/values/defaultSettings/backupTarget
        value:
          nfs://10.25.25.10:/mnt/media/longhorn/production
      - op: add
        path: /spec/values/persistence/defaultClassReplicaCount
        value: 1
    target:
      kind: HelmRelease
      name: longhorn
  - patch: |
      - op: replace
        path: /spec/values/service/annotations
        value:
          metallb.io/loadBalancerIPs: 10.25.25.11
      - op: replace
        path: /spec/values/ingressRoute/dashboard/matchRule
        value: Host(`traefik-dietpi.${domain}`)
      - op: replace
        path: /spec/values/additionalArguments
        value:
          - "--serverstransport.insecureskipverify=true"
          - "--entrypoints.truenas-penda-ssh.address=:50022"
    target:
      kind: HelmRelease
      name: traefik
