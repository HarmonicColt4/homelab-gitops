apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - renovate
patches:
  - patch: |-
      - op: add
        path: /spec/values/defaultSettings/backupTarget
        value:
          nfs://10.25.25.10:/mnt/media/longhorn/production
      - op: add
        path: /spec/values/persistence/defaultClassReplicaCount
        value: 1
    target:
      kind: HelmRelease
      name: longhorn
  - patch: |
      - op: replace
        path: /spec/values/service
        value:
          spec:
            externalTrafficPolicy: Local
          annotations:
            metallb.io/loadBalancerIPs: 10.25.25.11
      - op: replace
        path: /spec/values/ingressRoute/dashboard/matchRule
        value: Host(`traefik-dietpi.${domain}`)
      - op: add
        path: /spec/values/ports
        value:
          tsp-ssh:
            expose:
              default: true
            exposedPort: 50022
            port: 50022
            protocol: TCP

    target:
      kind: HelmRelease
      name: traefik
