apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: HelmRelease
      name: longhorn
      namespace: default
    patch: |-
      - op: add
        path: /spec/values/defaultSettings/backupTarget
        value:
          nfs://10.25.25.10:/mnt/storage/longhorn/production
  - patch: |
      - op: replace
        path: /spec/values/service/annotations
        value:
          metallb.universe.tf/loadBalancerIPs: 10.25.25.11
      - op: replace
        path: /spec/values/ingressRoute/dashboard/matchRule
        value: Host(`traefik-dietpi.${domain}`) && ( PathPrefix(`/`) || PathPrefix(`/api`))
    target:
      kind: HelmRelease
      name: traefik
      namespace: default