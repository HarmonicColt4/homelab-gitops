apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: HelmRelease
      name: traefik
    patch: |-
      - op: add
        path: /spec/values/service/annotations
        value:  
          metallb.universe.tf/loadBalancerIPs: 10.19.53.11
      - op: add
        path: /spec/values/globalArguments/-
        value:  
          --entryPoints.minecraft.address=:25565
  - target:
      kind: HelmRelease
      name: longhorn
    patch: |-
      - op: add
        path: /spec/values/defaultSettings/backupTarget
        value:
          nfs://10.13.25.10:/mnt/storage/longhorn/ecbafc
