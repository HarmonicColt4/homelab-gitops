---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-plugin-daemonset
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deployments/gpu_plugin/overlays/nfd_labeled_nodes
  prune: true
  sourceRef:
    kind: GitRepository
    name: intel-device-plugins-for-kubernetes
  timeout: 5m0s
  wait: true
  patches:
    - target:
        kind: DaemonSet
        name: intel-gpu-plugin
      patch: |-
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: intel-gpu-plugin
        spec:
          template:
            spec:
              containers:
                - name: intel-gpu-plugin
                  args:
                    - '-shared-dev-num=5'
