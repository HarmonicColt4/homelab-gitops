---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: default
spec:
  interval: 24h
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: default
spec:
  releaseName: metallb
  targetNamespace: metallb-system
  interval: 24h
  chart:
    spec:
      chart: metallb
      version: '0.14.*'
      sourceRef:
        kind: HelmRepository
        name: metallb
      interval: 24h
  values:
    speaker:
      ignoreExcludeLB: true
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 10.13.25.20-10.13.25.29
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2adv
  namespace: metallb-system