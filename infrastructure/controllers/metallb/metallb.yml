---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 24h
  sourceRef:
    kind: GitRepository
    name: metallb
  path: "./config/native"
  prune: true
  timeout: 2m
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: speaker
        spec:
          template:
            spec:
              containers:
              - args:
                - --port=7472
                - --log-level=info
                - --ignore-exclude-lb
                name: speaker
      target:
        kind: DaemonSet
        name: speaker
