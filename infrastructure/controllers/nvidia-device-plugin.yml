---
apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-device-plugin
---
apiVersion: node.k8s.io/v1                                                                                                                                        │
kind: RuntimeClass                                                                                                                                                │
metadata:                                                                                                                                                         │
  name: nvidia                                                                                                                                                    │
handler: nvidia 
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia-device-plugin
  namespace: default
spec:
  interval: 24h
  url: https://nvidia.github.io/k8s-device-plugin
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: default
spec:
  releaseName: nvidia-device-plugin
  targetNamespace: nvidia-device-plugin
  interval: 24h
  chart:
    spec:
      chart: nvidia-device-plugin
      version: '0.17.*'
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
      interval: 24h
  values:
    runtimeClassName: nvidia
    config:
      map:
        default: |-
          version: v1
          flags:
            migStrategy: none
          sharing:
            timeSlicing:
              renameByDefault: false
              failRequestsGreaterThanOne: false
              resources:
                - name: nvidia.com/gpu
                  replicas: 5
    gfd:
      enabled: true