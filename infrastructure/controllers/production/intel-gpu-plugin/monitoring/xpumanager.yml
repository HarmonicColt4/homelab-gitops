---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: xpumanager
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deployment/kubernetes/daemonset/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: xpumanager
  targetNamespace: xpumanager
  timeout: 5m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: xpumanager-monitoring
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deployment/kubernetes/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: xpumanager
  targetNamespace: xpumanager
  timeout: 5m0s
  wait: true
