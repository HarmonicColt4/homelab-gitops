apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - renovate
patches:
  - target:
      kind: HelmRelease
      name: traefik
      namespace: default
    patch: |-
      - op: add
        path: /spec/values/service/annotations
        value:  
          metallb.universe.tf/loadBalancerIPs: 10.13.25.21
      - op: add
        path: /spec/values/providers/file
        value:  
          enabled: true
          content: |-
            http:
              routers:
                truenas:
                  entryPoints:
                  - websecure
                  service: truenas
                  rule: Host(`truenas.${domain}`) && PathPrefix(`/`)              
                proxmox:
                  entryPoints:
                  - websecure
                  service: proxmox
                  rule: Host(`pve.${domain}`) && PathPrefix(`/`)              
                pikvm:
                  entryPoints:
                  - websecure
                  service: pikvm
                  rule: Host(`pikvm.${domain}`) && PathPrefix(`/`)
                gitea:
                  entryPoints:
                  - websecure
                  service: gitea
                  rule: Host(`gitea.${domain}`) && PathPrefix(`/`)              
                minio:
                  entryPoints:
                  - websecure
                  service: minio
                  rule: Host(`minio.${domain}`) && PathPrefix(`/`)              
                netbootxyz:
                  entryPoints:
                  - websecure
                  service: netbootxyz
                  rule: Host(`netbootxyz.${domain}`) && PathPrefix(`/`)            
              services:
                truenas:
                  loadBalancer:
                    servers:
                    - url: https://10.13.25.10/
                proxmox:
                  loadBalancer:
                    servers:
                    - url: https://10.13.25.9:8006/
                pikvm:
                  loadBalancer:
                    servers:
                    - url: https://10.13.25.98/
                gitea:
                  loadBalancer:
                    servers:
                    - url: http://10.13.25.10:30008/
                minio:
                  loadBalancer:
                    servers:
                    - url: http://10.13.25.10:9002/
                netbootxyz:
                  loadBalancer:
                    servers:
                    - url: http://10.13.25.10:31010/

  - target:
      kind: HelmRelease
      name: longhorn
      namespace: default
    patch: |-
      - op: add
        path: /spec/values/defaultSettings/backupTarget
        value:
          nfs://10.13.25.10:/mnt/storage/longhorn/production