apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - intel-gpu-plugin
  - multus
  - renovate
patches:
  - target:
      kind: HelmRelease
      name: traefik
    patch: |-
      - op: add
        path: /spec/values/service
        value:
          spec:
            externalTrafficPolicy: Local
          annotations:
            metallb.io/loadBalancerIPs: 10.25.25.11
      - op: add
        path: /spec/values/ports/tsp-ssh
        value:
          expose:
            default: true
          exposedPort: 50022
          port: 50022
          protocol: TCP
  - target:
      kind: HelmRelease
      name: longhorn
    patch: |-
      - op: add
        path: /spec/values/defaultBackupStore
        value:
          backupTarget: s3://longhorn@garage/
          backupTargetCredentialSecret: garage