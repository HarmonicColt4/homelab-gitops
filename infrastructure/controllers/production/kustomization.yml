apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - intel-gpu-plugin
  - multus
patches:
  - target:
      kind: HelmRelease
      name: traefik
    patch: |-
      - op: add
        path: /spec/values/service
        value:
          spec:
            externalTrafficPolicy: Local
          annotations:
            metallb.io/loadBalancerIPs: 10.25.25.21
      - op: remove
        path: /spec/values/ingressRoute
  - target:
      kind: HelmRelease
      name: longhorn
    patch: |-
      - op: add
        path: /spec/values/defaultSettings/backupTarget
        value:
          nfs://truenas.home.auckland:/mnt/media/longhorn/production
