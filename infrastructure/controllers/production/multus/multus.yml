---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: multus-cni
spec:
  interval: 10m0s
  path: ./deployments
  prune: true
  sourceRef:
    kind: GitRepository
    name: multus-cni
  patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: not-used
      spec:
        template:
          spec:
            volumes:
            - name: host-run-netns
              hostPath:
                path: /var/run/netns/
            initContainers:
            - name: install-multus-binary
              command:
              - "/usr/src/multus-cni/bin/install_multus"
              - "-d"
              - "/host/opt/cni/bin"
              - "-t"
              - "thick"
            - command:
              - /install-cni.sh
              image: ghcr.io/siderolabs/install-cni:v1.10.5
              name: install-cni
              securityContext:
                privileged: true
              volumeMounts:
              - mountPath: /host/opt/cni/bin
                mountPropagation: Bidirectional
                name: cnibin
    target:
      kind: DaemonSet
      name: kube-multus-ds
