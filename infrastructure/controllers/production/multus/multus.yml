---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: multus-cni
spec:
  interval: 10m0s
  path: ./deployments
  prune: true
  sourceRef:
    kind: GitRepository
    name: multus-cni
  patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: not-used
      spec:
        template:
          spec:
            volumes:
            - name: host-run-netns
              hostPath:
                path: /var/run/netns/
    target:
      kind: DaemonSet
      name: kube-multus-ds
