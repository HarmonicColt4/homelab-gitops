---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-env
data:
  RENOVATE_AUTODISCOVER: "false"
  RENOVATE_ENDPOINT: "https://git.teamg.app/api/v1"
  RENOVATE_GIT_AUTHOR: "Renovate Bot <bot@renovateapp.com>"
  RENOVATE_PLATFORM: "gitea"
  RENOVATE_PLATFORM_AUTOMERGE: "false"
  RENOVATE_TIMEZONE: "Pacific/Auckland"
  RENOVATE_REPOSITORIES: "gpenda/fluxcd, gpenda/talos-linux"
