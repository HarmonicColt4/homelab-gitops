---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: '0/30 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: ssh-key-volume
            secret:
              secretName: ssh-key-secret
          containers:
          - name: renovate
            volumeMounts:
            - name: ssh-key-volume
              readOnly: true
              mountPath: '/home/ubuntu/.ssh'
            image: renovate/renovate:41.171.0
            args:
            - gpenda/fluxcd
            env:
            - name: LOG_LEVEL
              value: info
            envFrom:
            - secretRef:
                name: renovate-env
            - configMapRef:
                name: renovate-env
          restartPolicy: Never
