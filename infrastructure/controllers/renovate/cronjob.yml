---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: '0/30 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: ca-cert
            secret:
              secretName: teamg.gg
              items:
              - key: ca.crt
                path: teamg-ca.crt
          containers:
          - name: renovate
            image: renovate/renovate:42.70.0
            volumeMounts:
            - name: ca-cert
              readOnly: true
              mountPath: /etc/ssl/certs
            args:
            - gpenda/fluxcd
            env:
            - name: LOG_LEVEL
              value: info
            envFrom:
            - secretRef:
                name: renovate-env
            - configMapRef:
                name: renovate-env
          restartPolicy: Never
