apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  values:
    deployment:
      kind: DaemonSet
    ports:
      web:
        redirectTo:
          port: websecure
      traefik:
        expose:
          default: true
    ingressRoute:
      dashboard:
        enabled: true
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 10.13.25.40
