---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 24h
  releaseName: tailscale
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tailscale-operator
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 1h
      version: 1.98.3
  valuesFrom:
    - kind: Secret
      name: tailscale-values
