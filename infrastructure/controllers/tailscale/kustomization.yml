---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- helmrelease.yml
- namespace.yml
- repository.yml

secretGenerator:
- name: tailscale-values
  namespace: flux-system
  files:
  - values.yaml=values.enc.yml

transformers:
- |
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-important-to-example
    namespace: tailscale
  setRoleBindingSubjects: none
  unsetOnly: true
  fieldSpecs:
    - kind: HelmRelease
      path: spec/targetNamespace
      create: true
