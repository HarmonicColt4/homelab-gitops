---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: default
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: default
spec:
  targetNamespace: traefik
  releaseName: traefik
  interval: 24h
  chart:
    spec:
      chart: traefik
      version: '34.1.0'
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 24h
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    ports:
      web:
        redirections:
          entrypoint:
            to: websecure
            scheme: https
            permanent: true
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
        - websecure
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 10.13.25.31
    tlsStore:
      default:
        defaultCertificate:
          secretName: cert
    providers:
      kubernetesCRD:
        allowExternalNameServices: true