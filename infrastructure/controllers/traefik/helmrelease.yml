---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: traefik
  releaseName: traefik
  interval: 24h
  chart:
    spec:
      chart: traefik
      version: 38.0.2
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 1h
  values:
    deployment:
      kind: DaemonSet
    service:
      spec:
        externalTrafficPolicy: Local
      annotations:
        metallb.io/loadBalancerIPs: 10.25.25.11
      additionalServices:
        tsp-ssh:
          type: LoadBalancer
          annotations:
            metallb.io/loadBalancerIPs: 10.25.25.12
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 600s
            idleTimeout: 600s
            writeTimeout: 600s
      tsp-ssh:
        expose:
          default: false
          tsp-ssh: true
        exposedPort: 22
        port: 50022
        protocol: TCP
    ingressRoute:
      dashboard:
        matchRule: Host(`traefik.teamg.app`)
        enabled: true
        entryPoints:
        - websecure
    global:
      checkNewVersion: true
      sendAnonymousUsage: false
    additionalArguments:
    - "--serverstransport.insecureskipverify=true"
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        allowCrossNamespace: true
