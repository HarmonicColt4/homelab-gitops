---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  timeout: 10m
  targetNamespace: traefik
  releaseName: traefik
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 41.6.0
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 1h
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      kind: DaemonSet
    service:
      spec:
        externalTrafficPolicy: Local
      annotations:
        metallb.io/loadBalancerIPs: 10.25.25.11
      additionalServices:
        tsp-ssh:
          type: LoadBalancer
          annotations:
            metallb.io/loadBalancerIPs: 10.25.25.12
        pikvm-ssh:
          type: LoadBalancer
          annotations:
            metallb.io/loadBalancerIPs: 10.25.25.13
    ports:
      web:
        forwardedHeaders:
          insecure: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        forwardedHeaders:
          insecure: true
        transport:
          respondingTimeouts:
            readTimeout: 1800s
            idleTimeout: 1800s
            writeTimeout: 1800s
      tsp-ssh:
        expose:
          default: false
          tsp-ssh: true
        exposedPort: 22
        port: 50022
        protocol: TCP
      pikvm-ssh:
        expose:
          default: false
          pikvm-ssh: true
        exposedPort: 22
        port: 50122
        protocol: TCP
    ingressRoute:
      dashboard:
        matchRule: Host(`traefik.teamg.app`)
        enabled: true
        entryPoints:
          - websecure
    global:
      checkNewVersion: true
      sendAnonymousUsage: false
    additionalArguments:
      - "--serverstransport.insecureskipverify=true"
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        allowCrossNamespace: true
