---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tinyauth
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`tinyauth.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: tinyauth
      port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tinyauth-public
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`tinyauth.weirdrussiandomain.com`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: tinyauth
      port: 3000
