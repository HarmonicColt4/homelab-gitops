---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tinyauth
spec:
  forwardAuth:
    address: http://tinyauth.tinyauth.svc.cluster.local:3000/api/auth/traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tinyauth-public
spec:
  forwardAuth:
    address: http://tinyauth-public.tinyauth.svc.cluster.local:3000/api/auth/traefik
