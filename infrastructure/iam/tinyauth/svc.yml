---
apiVersion: v1
kind: Service
metadata:
  name: tinyauth
spec:
  selector:
    app: tinyauth
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: tinyauth-public
spec:
  selector:
    app: tinyauth-public
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
