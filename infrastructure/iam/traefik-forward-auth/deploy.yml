---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tfa-public
  name: tfa-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tfa-public
  strategy: {}
  template:
    metadata:
      labels:
        app: tfa-public
    spec:
      volumes:
      - name: config
        secret:
          secretName: config-public
      containers:
      - image: ghcr.io/italypaleale/traefik-forward-auth:4.5.0
        name: traefik-forward-auth
        ports:
        - containerPort: 4181
        resources: {}
        volumeMounts:
        - mountPath: /etc/traefik-forward-auth
          name: config
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4181
          initialDelaySeconds: 30
          failureThreshold: 6
          periodSeconds: 10
