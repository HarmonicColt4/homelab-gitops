---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tfa-public
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`auth.weirdrussiandomain.com`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: tfa-public
      port: 4181
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tfa-local
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`auth.teamg.gg`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: tfa-local
      port: 4181
