---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: info
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
  - kind: Kustomization
    name: '*'
  - kind: HelmRelease
    name: '*'
  eventMetadata:
    cluster: weird-russian-cluster
  exclusionList:
  - Dependencies do not meet ready condition
  - HelmRelease.* configured
  - Service.*truenas-penda.*configured
  - dependency.*is not ready
  - Health check passed
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: error
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: error
  eventSources:
  - kind: GitRepository
    name: '*'
  - kind: OCIRepository
    name: '*'
  - kind: HelmRepository
    name: '*'
  eventMetadata:
    cluster: weird-russian-cluster
  exclusionList:
  - Dependencies do not meet ready condition
  - HelmRelease.* configured
  - Service.*truenas-penda.*configured
  - dependency.*is not ready
