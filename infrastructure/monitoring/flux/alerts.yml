---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: info
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
  - kind: Kustomization
    name: '*'
  - kind: HelmRelease
    name: '*'
  - kind: GitRepository
    name: '*'
  - kind: HelmRepository
    name: '*'
  - kind: OCIRepository
    name: '*'
  eventMetadata:
    cluster: weird-russian-cluster
  exclusionList:
  - "Dependencies do not meet ready condition"
  - "HelmRelease.* configured"
  - "Service.*truenas-penda.*configured"
  - "dependency.*is not ready"
