---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  releaseName: kps
  interval: 24h
  suspend: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 80.10.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 1h
  valuesFrom:
  - kind: Secret
    name: kube-prometheus-stack-values
