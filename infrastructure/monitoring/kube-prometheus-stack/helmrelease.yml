---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  releaseName: kps
  interval: 24h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 79.8.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 1h
  valuesFrom:
  - kind: ConfigMap
    name: kube-prometheus-stack-values
  - kind: Secret
    name: kps-values
