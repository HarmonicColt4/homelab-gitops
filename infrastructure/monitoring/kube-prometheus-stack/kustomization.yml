---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-prometheus-stack
resources:
- namespace.yml
- helmrelease.yml
- repository.yml
- secret.enc.yml
- ingress-route.yml
configMapGenerator:
- name: kube-prometheus-stack-values
  files:
  - values.yaml=values.yml
configurations:
- kustomizeconfig.yml
