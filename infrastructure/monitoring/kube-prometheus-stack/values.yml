---
fullnameOverride: kps

defaultRules:
  create: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        am-config: discord-receiver

crds:
  upgradeJob:
    enabled: true

grafana:
  enabled: true
  grafana.ini:
    server:
      root_url: https://grafana.teamg.app
  admin:
    existingSecret: grafana-admin-user
    userKey: admin-user
    passwordKey: admin-password
kubernetesServiceMonitors:
  enabled: true

kubeApiServer:
  enabled: false

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

coreDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: false
    darwin:
      enabled: false

prometheusOperator:
  enabled: true

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 10Gi
