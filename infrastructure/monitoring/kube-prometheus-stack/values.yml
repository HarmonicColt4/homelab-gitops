prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 20Gi
    retention: 30d
kubeProxy:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
defaultRules:
  rules:
    kubeControllerManager: false
    kubeProxy: false
fullnameOverride: kps

alertmanager:
  config:
    receivers:
      - name: discord
