---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: beast
auto: off
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: ens18
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/29e27ffc20b46e05fccac0b226db69c2cc6987f0d5bca89ab49d02b286674646:v1.14.2
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sdb"
  grow: true
  minSize: 100GiB
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: config
annotations:
  node.longhorn.io/default-disks-config: '[
    {
    "path": "/var/mnt/longhorn",
    "allowScheduling": true,
    "storageReserved": 0
    }
    ]'
---
# Load the NVIDIA kernel modules provided by the
# nvidia-open-gpu-kernel-modules-production extension. Without these the
# ext-nvidia-persistenced / ext-nvidia-cdi-gen services wait forever on
# /sys/bus/pci/drivers/nvidia, which blocks the Talos boot sequence
# (startAllServices) and leaves the machine stage stuck at "booting".
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_uvm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_drm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_modeset
