---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: beast
auto: off
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: ens18
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/29e27ffc20b46e05fccac0b226db69c2cc6987f0d5bca89ab49d02b286674646:v1.14.2
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sdb"
  grow: true
  minSize: 100GiB
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: config
annotations:
  node.longhorn.io/default-disks-config: '[
    {
    "path": "/var/mnt/longhorn",
    "allowScheduling": true,
    "storageReserved": 0
    }
    ]'
