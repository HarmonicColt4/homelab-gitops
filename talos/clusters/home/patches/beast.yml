---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: beast
auto: off
---
# VLAN 25, matching the other cluster nodes. The MAC-based alias keeps the
# config stable if the kernel renames the interface.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  match: mac(link.permanent_addr) == "04:7c:16:b7:68:8c"
---
apiVersion: v1alpha1
kind: VLANConfig
name: net0.25
vlanID: 25
parent: net0
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: net0.25
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/e6a68146e08bac983d34c6a621626ace2a768d6d5132e052dd3f5013d15d0b64:v1.14.2
provisioning:
  diskSelector:
    match: disk.wwid == "eui.000000000000000100a075202879d5aa"
  wipe: true
reboot: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  minSize: 100GiB
  maxSize: 100GiB
  grow: false
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: disk.wwid == "eui.000000000000000100a075202879d5aa"
  grow: true
  minSize: 100GiB
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: config
annotations:
  node.longhorn.io/default-disks-config: '[
    {
    "path": "/var/mnt/longhorn",
    "allowScheduling": true,
    "storageReserved": 0
    }
    ]'
---
# Load the NVIDIA kernel modules provided by the
# nvidia-open-gpu-kernel-modules-production extension. Without these the
# ext-nvidia-persistenced / ext-nvidia-cdi-gen services wait forever on
# /sys/bus/pci/drivers/nvidia, which blocks the Talos boot sequence
# (startAllServices) and leaves the machine stage stuck at "booting".
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_uvm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_drm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_modeset
