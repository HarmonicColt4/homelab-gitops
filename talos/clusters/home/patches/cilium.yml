---
# Control-plane-only patch: disable the default Talos CNI (flannel) and
# kube-proxy so Cilium can run as the sole CNI with kube-proxy replacement.
#
# KubeFlannelCNIConfig and KubeProxyConfig are cluster-level documents that
# only exist in the control plane machine config, so this patch must be applied
# to control plane nodes only (never to workers).
# See: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
